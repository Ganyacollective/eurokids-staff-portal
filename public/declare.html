<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Please read and sign · EuroKids JMD Enclave</title>
<link rel="icon" href="/favicon.png">
<style>
  /* A parent, on a phone, reading something about their four-year-old. Text
     at the width of the screen — never a PDF they have to scroll sideways. */
  :root{ --blue:#21409A; --green:#15803D; --ink:#15181C; --mute:#6B7280;
         --line:#E5E7EB; --wash:#F7F8FA; --r:14px; --safe: env(safe-area-inset-bottom, 0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--wash);padding-bottom:calc(24px + var(--safe))}
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
  .brand img{height:34px;width:auto}
  .brand span{font-size:12px;color:var(--mute)}
  h1{font-size:25px;line-height:1.25;margin:0 0 6px;letter-spacing:-.3px}
  h2{font-size:17px;margin:0 0 10px}
  p{margin:0 0 12px}
  .mute{color:var(--mute)} .small{font-size:13.5px}
  .tiny{font-size:12px;color:var(--mute);line-height:1.5}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin:0 0 6px}
  input[type=text],input[type=tel]{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(33,64,154,.12)}
  .btn{display:block;width:100%;font:inherit;font-size:17px;font-weight:700;padding:15px 18px;border-radius:12px;
       border:0;background:var(--green);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.line{background:#fff;color:var(--blue);border:1.5px solid var(--line);font-weight:600}
  .btn+.btn,.btn+a.btn{margin-top:10px}
  .facts{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
  .facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
  .facts div:last-child{border-bottom:0}
  .facts b{font-weight:650;text-align:right}
  .ok{background:#ECFDF3;border:1px solid #ABEFC6;color:#0B7B3E;padding:11px 13px;border-radius:11px;font-size:14px;margin-bottom:12px}
  .err{background:#FEF3F2;border:1px solid #FECDCA;color:#B42318;padding:11px 13px;border-radius:11px;font-size:14px;margin-bottom:12px}
  .pad{height:180px;border:1.5px dashed #CBD5E1;border-radius:12px;background:#fff;touch-action:none;width:100%;display:block}
  .otp{letter-spacing:10px;font-size:26px;text-align:center;font-weight:700}
  .doc{font-size:15.5px;line-height:1.66}
  .doc p{margin:0 0 11px}
  .doc h3{font-size:15.5px;font-weight:700;margin:22px 0 8px}
  .doc .decl{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px;font-weight:600}
  .doc strong{font-weight:650}
  .foot{text-align:center;padding:18px 6px;font-size:12px;color:var(--mute);line-height:1.6}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/brand/icons/icon-192.png" alt="" onerror="this.style.display='none'">
    <span>EuroKids JMD Enclave · Mohammadwadi, Pune</span>
  </div>
  <div id="app"><div class="card"><p class="mute">Opening…</p></div></div>
  <div class="foot">
    Any questions at all — call the school on <a href="tel:+917875096690">+91 78750 96690</a>.<br>
    This page is private to you. Please don't forward the link.
  </div>
</div>

<script>
const token = location.hash.replace(/^#/, '').trim();
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bold = t => esc(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const api = (p, o) => fetch(`/api/dsign/${encodeURIComponent(token)}${p}`, o)
  .then(r => r.json().catch(() => ({ ok:false, error:'The server did not answer.' })));

let me = null, doc = null, four = '';
const shell = h => { app.innerHTML = h; window.scrollTo({ top: 0 }); };
const err = m => { const b = document.getElementById('msg'); if (b) b.innerHTML = `<div class="err">${esc(m)}</div>`; };
const note = m => { const b = document.getElementById('msg'); if (b) b.innerHTML = `<div class="ok">${esc(m)}</div>`; };

// ── 1. what this is ────────────────────────────────────────────────────
function cover(){
  const inPerson = me.channel === 'in_person';
  shell(`
    <div class="card">
      <h1>${esc(me.title)}</h1>
      <p class="mute">${inPerson
        ? 'Please read this and sign on the screen. The school office is here if anything is unclear.'
        : 'EuroKids JMD Enclave has sent you this to read and sign.'}</p>
      <div class="facts">
        <div><span class="mute">For</span><b>${esc(me.child_name || '—')}</b></div>
        <div><span class="mute">Parent / Guardian</span><b>${esc(me.party_name || '')}</b></div>
      </div>
      <p class="small">Please read it properly before you sign. If there is anything you are not comfortable with, tell us before signing rather than after — we would much rather talk it through.</p>
      <button class="btn" id="read">Read it</button>
      <a class="btn line" href="/api/dsign/${encodeURIComponent(token)}/pdf" target="_blank" rel="noopener">Open as a PDF</a>
    </div>`);
  document.getElementById('read').onclick = reader;
}

// ── 2. the document, at the width of the phone ─────────────────────────
async function reader(){
  shell(`<div class="card"><p class="mute">Opening…</p></div>`);
  if (!doc) {
    const r = await api('/doc');
    if (!r.ok) return shell(`<div class="card"><h2>We can't open this</h2><p class="mute">${esc(r.error||'')}</p></div>`);
    doc = r.doc;
  }
  const para = t => String(t || '').split(/\n/).map(x => x.trim()).filter(Boolean)
    .map(x => `<p>${bold(x)}</p>`).join('');
  shell(`
    <div class="card doc">
      <p class="mute small">EuroKids JMD Enclave · ${esc(doc.issuedOn)}</p>
      <h2>${esc(doc.title)}</h2>
      <p><strong>Child:</strong> ${esc(doc.childName || '')}<br>
         <strong>Parent / Guardian:</strong> ${esc(doc.partyName || '')}</p>
      ${para(doc.intro)}
      ${(doc.clauses||[]).map(c => `${c.heading ? `<h3>${esc(c.heading)}</h3>` : ''}${para(c.body)}`).join('')}
      <div class="decl">${bold(doc.declaration)}</div>
    </div>
    <div class="card">
      <button class="btn" id="go">I've read it — sign</button>
      <a class="btn line" href="/api/dsign/${encodeURIComponent(token)}/pdf" target="_blank" rel="noopener">Open the PDF</a>
      <button class="btn line" id="back">Back</button>
    </div>`);
  document.getElementById('go').onclick = () => me.channel === 'in_person' ? signStep(null) : identify();
  document.getElementById('back').onclick = cover;
}

// ── 3. by link: prove it's you ─────────────────────────────────────────
function identify(){
  shell(`
    <div class="card">
      <h2>Just checking it's you</h2>
      <p class="small mute">We'll email a six-digit code to ${esc(me.email_hint || 'your email')}.</p>
      <div id="msg"></div>
      ${me.has_phone ? `<div style="margin-bottom:14px">
        <label for="four">Last 4 digits of your mobile number</label>
        <input id="four" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
        <p class="tiny" style="margin-top:6px">The number the school has for you.</p>
      </div>` : ''}
      <button class="btn" id="send">Email me the code</button>
      <button class="btn line" id="back">Back</button>
    </div>`);
  document.getElementById('back').onclick = reader;
  const b = document.getElementById('send');
  b.onclick = async () => {
    four = (document.getElementById('four')?.value || '').replace(/\D/g, '');
    if (me.has_phone && four.length !== 4) return err('Please enter the last four digits of your mobile number.');
    b.disabled = true; b.textContent = 'Sending…';
    const r = await api('/otp', { method: 'POST' });
    b.disabled = false; b.textContent = 'Email me the code';
    if (!r.ok) return err(r.error || 'Could not send the code.');
    signStep(r.sent_to);
  };
}

// ── 4. sign ────────────────────────────────────────────────────────────
function signStep(sentTo){
  const inPerson = me.channel === 'in_person';
  shell(`
    <div class="card">
      <h2>Sign</h2>
      <div id="msg">${inPerson
        ? `<div class="ok">Signing at the school office${me.witnessed_by ? ', with ' + esc(String(me.witnessed_by).split('@')[0]) : ''}.</div>`
        : `<div class="ok">Code sent to ${esc(sentTo || 'your email')}. It's good for ten minutes.</div>`}</div>

      ${inPerson ? '' : `<div style="margin-bottom:16px">
        <label for="otp">The six-digit code</label>
        <input id="otp" type="tel" inputmode="numeric" maxlength="6" class="otp" placeholder="000000" autocomplete="one-time-code">
        <p class="tiny" style="margin-top:6px">Didn't arrive? Check spam, or <a href="#" id="again">send it again</a>.</p>
      </div>`}

      <div style="margin-bottom:16px">
        <label for="full">Your full name</label>
        <input id="full" type="text" value="${esc(me.party_name || '')}" autocomplete="name">
      </div>

      <label>Sign with your finger</label>
      <canvas class="pad" id="pad"></canvas>
      <button class="btn line" id="clear" style="padding:9px;font-size:14px;margin:8px 0 18px">Clear</button>

      <p class="tiny" style="margin-bottom:14px">By signing you confirm you are the parent or guardian, that you have read this, and that you accept it. We record the time and device as proof of signing, as the law allows.</p>
      <button class="btn" id="done">Sign</button>
      <button class="btn line" id="back">Back</button>
    </div>`);

  const pad = setupPad(document.getElementById('pad'));
  document.getElementById('clear').onclick = pad.clear;
  document.getElementById('back').onclick = reader;
  const again = document.getElementById('again');
  if (again) again.onclick = async e => {
    e.preventDefault();
    const r = await api('/otp', { method: 'POST' });
    r.ok ? note(r.note || 'A new code is on its way.') : err(r.error || 'Could not resend.');
  };

  const b = document.getElementById('done');
  b.onclick = async () => {
    const otp = (document.getElementById('otp')?.value || '').replace(/\D/g, '');
    const full = document.getElementById('full').value.trim();
    if (!inPerson && otp.length !== 6) return err('Please enter the six-digit code from your email.');
    if (full.length < 3) return err('Please type your full name.');
    if (pad.empty()) return err('Please sign in the box with your finger.');
    b.disabled = true; b.textContent = 'Signing…';
    const r = await api('/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp, phone_last4: four, signer_name: full, signature_png: pad.png() }) });
    b.disabled = false; b.textContent = 'Sign';
    if (!r.ok) return err(r.error || 'Could not sign.');
    done(r);
  };
}

function done(r){
  shell(`
    <div class="card" style="text-align:center">
      <div style="font-size:44px;line-height:1;margin:6px 0 14px">✅</div>
      <h1>Signed — thank you</h1>
      <p class="mute">${me.channel === 'in_person'
        ? 'A copy has been saved and emailed where we have an address.'
        : 'A signed copy is on its way to your email. Please keep it.'}</p>
      <div class="facts" style="text-align:left">
        <div><span class="mute">Signed</span><b>${esc(r.signed_at || '')}</b></div>
        <div><span class="mute">Reference</span><b>${esc(r.reference || '')}</b></div>
      </div>
      <a class="btn" href="/api/dsign/${encodeURIComponent(token)}/pdf" target="_blank" rel="noopener">Download the signed copy</a>
    </div>`);
}

// ── the signature pad ──────────────────────────────────────────────────
function setupPad(cv){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const c = () => cv.getContext('2d');
  const ctx0 = c(); ctx0.scale(dpr, dpr);
  ctx0.lineWidth = 2.4; ctx0.lineCap = 'round'; ctx0.lineJoin = 'round'; ctx0.strokeStyle = '#15181C';
  let drawing = false, dirty = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  cv.addEventListener('pointerdown', e => { drawing = true; dirty = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e), ctx = c();
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  return {
    clear(){ c().clearRect(0, 0, cv.width, cv.height); dirty = false; },
    empty(){ return !dirty; },
    png(){
      // Trim to the ink so the signature sits on the line in the PDF rather
      // than floating in a large transparent rectangle.
      const ctx = c(), w = cv.width, h = cv.height;
      const d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 <= x0 || y1 <= y0) return cv.toDataURL('image/png');
      const p = Math.round(6 * dpr);
      x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p);
      x1 = Math.min(w - 1, x1 + p); y1 = Math.min(h - 1, y1 + p);
      const out = document.createElement('canvas');
      out.width = x1 - x0; out.height = y1 - y0;
      out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    },
  };
}

// ── boot ───────────────────────────────────────────────────────────────
(async () => {
  if (!token) return shell(`<div class="card"><h2>This link is incomplete</h2>
    <p class="mute">Please open the link exactly as it came to you, or ask the school to send it again.</p></div>`);
  const r = await api('');
  if (!r.ok) return shell(`<div class="card"><h2>We can't open this</h2><p class="mute">${esc(r.error || '')}</p></div>`);
  me = r;
  if (me.status === 'signed') {
    return shell(`<div class="card" style="text-align:center">
      <div style="font-size:42px;margin:4px 0 12px">✅</div><h1>Already signed</h1>
      <p class="mute">Signed by ${esc(me.signer_name || me.party_name)}.</p>
      <a class="btn" href="/api/dsign/${encodeURIComponent(token)}/pdf" target="_blank" rel="noopener">Open the signed copy</a>
    </div>`);
  }
  cover();
})();
</script>
</body>
</html>

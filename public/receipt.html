<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fee receipt · EuroKids JMD Enclave</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{ --blue:#21409A; --ink:#15181C; --mute:#6B7280; --line:#E5E7EB; --wash:#F7F8FA;
         --safe: env(safe-area-inset-bottom, 0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--wash);padding-bottom:calc(24px + var(--safe))}
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
  .brand img{height:34px;width:auto}
  .brand span{font-size:12px;color:var(--mute)}
  h1{font-size:23px;line-height:1.25;margin:0 0 4px;letter-spacing:-.3px}
  p{margin:0 0 12px} .mute{color:var(--mute)} .small{font-size:13.5px}
  .facts{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
  .facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
  .facts div:last-child{border-bottom:0}
  .facts b{font-weight:650;text-align:right}
  .btn{display:block;width:100%;font-size:17px;font-weight:700;padding:15px 18px;border-radius:12px;
       border:0;background:var(--blue);color:#fff;text-align:center;text-decoration:none}
  .foot{text-align:center;padding:18px 6px;font-size:12px;color:var(--mute);line-height:1.6}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/brand/icons/icon-192.png" alt="" onerror="this.style.display='none'">
    <span>EuroKids JMD Enclave · Mohammadwadi, Pune</span>
  </div>
  <div id="app"><div class="card"><p class="mute">Opening…</p></div></div>
  <div class="foot">
    Any question about this receipt — call the school on <a href="tel:+912069622686">020 6962 2686</a>.
  </div>
</div>
<script>
// A receipt a parent forwards to their employer. Nobody here has an account,
// so the page is the document and one button to download it.
const token = location.hash.replace(/^#/, '').trim();
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = `/api/rcert/${encodeURIComponent(token)}`;

if (!token) {
  app.innerHTML = `<div class="card"><h1>This link is incomplete</h1>
    <p class="mute">Please open it exactly as it came to you, or ask the school to send it again.</p></div>`;
} else {
  fetch(url, { method: 'HEAD' }).then(r => {
    if (!r.ok) throw new Error(r.status === 410
      ? 'This receipt was cancelled. Please ask the school for a fresh one.'
      : 'This link is not valid. Please ask the school to send it again.');
    app.innerHTML = `<div class="card">
      <h1>Your fee receipt</h1>
      <p class="mute small">Issued by EuroKids JMD Enclave. You can download it and pass it to your employer.</p>
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the receipt</a>
    </div>`;
  }).catch(e => {
    app.innerHTML = `<div class="card"><h1>We can't open this</h1><p class="mute">${esc(e.message)}</p></div>`;
  });
}
</script>
</body>
</html>

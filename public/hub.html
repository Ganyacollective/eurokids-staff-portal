      // This wrote nothing anywhere and reset on reload, so a coordinator
      // believed the follow-up was on record when it was not.
      alert('Call logging is not built yet — please note the follow-up wherever you keep them.');
    });
  if (has('epms_admin')) wireSync(s, () => { if (tab === 'overview') tabOverview(); });
}


/* ── the EPMS sync button — shared by the finance overview and the coordinator's worklist ── */
function wireSync(s, afterSync){
    // When did data last arrive from EPMS?
    const showLastSync = async () => {
      const info = el('sync-info'); if (!info) return;
      try {
        const { data: runs } = await s.schema('epms').from('sync_runs')
          .select('finished_at,status,rows_fetched').not('finished_at','is',null)
          .order('finished_at', { ascending: false }).limit(1);
        const last = runs && runs[0];
        info.textContent = last
          ? `Last synced ${new Date(last.finished_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${last.status==='ok' ? '' : ' (failed)'}`
          : 'Never synced';
      } catch (_) { info.textContent = ''; }
    };
    showLastSync();

    // Manual sync — logs into EPMS server-side, re-pulls the Payment Due report,
    // then re-renders this tab with the fresh figures.
    const b = el('sync');
    if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = 'Syncing…';
      el('sync-info').textContent = 'Fetching from EPMS…';
      try {
        const { data: { session: sess } } = await getSb().auth.getSession();
        const r = await fetch(`${SUPABASE_URL}/functions/v1/epms-pull`, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${sess.access_token}`, apikey: SUPABASE_ANON_KEY },
        });
        const j = await r.json();
        if (j.ok) {
          // Second pass: the Admission report carries parent emails, batch, kit dispatch.
          el('sync-info').textContent = 'Fetching parent details…';
          let extra = '';
          try {
            const r2 = await fetch(`${SUPABASE_URL}/functions/v1/epms-admission-pull`, {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${sess.access_token}`, apikey: SUPABASE_ANON_KEY },
            });
            const j2 = await r2.json();
            if (j2.ok) extra = ` · ${j2.with_email} parent emails`;
          } catch (_) { /* the main sync already succeeded */ }

          // Third pass: money EPMS has just recognised for a family whose cash
          // we are holding is us posting it onward. Consume the held amount by
          // exactly that much, so the payment is counted once rather than twice.
          let matched = '';
          try {
            const { data: m } = await getSb().schema('eurokids').rpc('auto_match_remittances');
            const row = Array.isArray(m) ? m[0] : m;
            if (row && Number(row.matched_amount) > 0) {
              matched = ` · ₹${Number(row.matched_amount).toLocaleString('en-IN')} of held cash settled`;
            }
          } catch (_) { /* matching is a convenience, never a blocker */ }

          el('sync-info').textContent = (j.new_payments
            ? `${j.new_payments} new payment${j.new_payments===1?'':'s'} · ₹${j.new_payments_rupees.toLocaleString('en-IN')} received`
            : `Synced ${j.invoices} records · ${j.active} active`) + extra + matched;
          b.textContent = 'Synced ✓';
          setTimeout(afterSync, 900);
        } else {
          el('sync-info').textContent = '';
          alert('Sync failed:\n\n' + (j.error || 'unknown error'));
          b.disabled = false; b.textContent = 'Sync from EPMS';
        }
      } catch (e) {
        el('sync-info').textContent = '';
        alert('Sync failed: ' + e.message);
        b.disabled = false; b.textContent = 'Sync from EPMS';
      }
    };
}

/* ── children ─────────────────────────────────────────── */
// Roster state — kept module-level so filters don't refetch.
let _kids = [], _kidQ = '', _kidProg = 'all', _kidBatch = 'all', _kidSort = 'newest';

async function tabChildren(){
  el('body').innerHTML = '<div class="loading">Loading roster…</div>';
  // Everyone, newest admission first. No limit — the whole active roster.
  const { data, error } = await getSb().schema('eurokids').from('v_dues')
    .select('uin,student_name,father_name,program_name,student_status,eurokids_discount,our_discount,uncredited_cash,admission_date,batch,mobile1,mobile2,parent_email1,parent_email2,total_collected,total_invoiced,epms_due,true_due,payment_status')
    .order('admission_date', { ascending: false })
    .order('student_name', { ascending: true });
  if (error) return el('body').innerHTML = fail(error);
  _kids = data || [];
  renderChildren();
}

// Extracted so the roster table can be redrawn on its own. Rebuilding the whole
// panel per keystroke also destroyed the search box being typed into.
function kidRowHtml(r){
  const fmtDate = d => d ? _DFY2.format(new Date(d + 'T00:00:00Z')) : '—';

          const paid = Number(r.true_due) <= 0;
          const part = !paid && Number(r.total_collected) > 0;
          const tint = paid ? 't-good' : (part ? 't-warn' : 't-crit');
          const contacts = [r.parent_email1, r.parent_email2].filter(Boolean);
          const phones   = [r.mobile1, r.mobile2].filter(Boolean);
          return `<tr class="${tint}" style="cursor:pointer" onclick="openPlanFrom('${esc(r.uin)}')">
          <td><strong>${esc(r.student_name)}</strong>
            ${Number(r.our_discount) ? `<span class="chip c-mute" style="margin-left:6px">−${money(r.our_discount)}</span>`:''}
            ${Number(r.uncredited_cash) ? `<span class="chip c-warn" style="margin-left:4px">${money(r.uncredited_cash)} in hand</span>`:''}
            <br><span class="uin">${esc(r.uin)}</span></td>
          <td class="hint" onclick="event.stopPropagation()">${esc(r.father_name || '—')}
            ${phones.length?`<br>${phones.map(p=>`<a href="tel:${esc(p)}" style="color:var(--label-2)">${esc(p)}</a>`).join(' · ')}`:''}
            ${contacts.length?`<br>${contacts.map(e2=>`<a href="mailto:${esc(e2)}">${esc(e2)}</a>`).join(' · ')}`
                             :'<br><span style="color:var(--label-3)">no email on file</span>'}</td>
          <td>${esc(r.program_name)}</td>
          <td onclick="event.stopPropagation()">${r.batch ? esc(r.batch) : `<select class="in" style="width:auto" onchange="setBatch('${esc(r.uin)}', this.value)">
                <option value="">Set…</option><option value="Morning">Morning</option><option value="Afternoon">Afternoon</option></select>`}</td>
          <td class="hint">${fmtDate(r.admission_date)}</td>
          <td class="r num">${money(r.total_invoiced)}</td>
          <td class="r num">${money(r.total_collected)}</td>
          <td class="r num ${paid ? 'money-ok' : (part ? '' : 'money-due')}" style="font-weight:600">${paid ? 'Paid' : money(r.true_due)}</td>
          <td class="r" style="color:var(--label-3)">›</td>
        </tr>`;
}
const _DFY2 = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', year:'2-digit', timeZone:'UTC' });

function filteredKids(){
  const q = _kidQ.trim().toLowerCase();
  let rows = _kids.filter(r => {
    if (_kidProg !== 'all' && (r.program_name || '') !== _kidProg) return false;
    if (_kidBatch !== 'all' && (r.batch || 'Unset') !== _kidBatch) return false;
    if (!q) return true;
    return (r.student_name || '').toLowerCase().includes(q)
        || (r.father_name || '').toLowerCase().includes(q)
        || (r.uin || '').toLowerCase().includes(q);
  });
  if (_kidSort === 'newest') rows.sort((a,b) => (b.admission_date||'').localeCompare(a.admission_date||''));
  else if (_kidSort === 'oldest') rows.sort((a,b) => (a.admission_date||'').localeCompare(b.admission_date||''));
  else if (_kidSort === 'name')   rows.sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''));
  else if (_kidSort === 'due')    rows.sort((a,b) => Number(b.true_due) - Number(a.true_due));
  return rows;
}

function repaintKidRows(){
  const rows = filteredKids();
  const body = el('kid-rows'); if (!body) return;
  body.innerHTML = rows.length ? rows.map(kidRowHtml).join('')
    : `<tr><td colspan="9" style="padding:26px;text-align:center;color:var(--muted)">No child matches that search.</td></tr>`;
  const owing = rows.filter(r => Number(r.true_due) > 0).length;
  const hint = el('kid-count');
  if (hint) hint.innerHTML = `<strong>${rows.length}</strong> shown of ${_kids.length} active ·
      <span style="color:var(--good)">${rows.length-owing} fully paid</span> ·
      <span style="color:var(--crit)">${owing} still owe</span>`;
}

function renderChildren(){
  const PROGRAMS = ['Play Group','Nursery','Euro Junior','Euro Senior','Eurotots'];
  const q = _kidQ.trim().toLowerCase();
  let rows = _kids.filter(r => {
    if (_kidProg !== 'all' && (r.program_name || '') !== _kidProg) return false;
    if (_kidBatch !== 'all' && (r.batch || 'Unset') !== _kidBatch) return false;
    if (!q) return true;
    return (r.student_name || '').toLowerCase().includes(q)
        || (r.father_name || '').toLowerCase().includes(q)
        || (r.uin || '').toLowerCase().includes(q);
  });
  if (_kidSort === 'newest') rows.sort((a,b) => (b.admission_date||'').localeCompare(a.admission_date||''));
  else if (_kidSort === 'oldest') rows.sort((a,b) => (a.admission_date||'').localeCompare(b.admission_date||''));
  else if (_kidSort === 'name')   rows.sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''));
  else if (_kidSort === 'due')    rows.sort((a,b) => Number(b.true_due) - Number(a.true_due));

  // Counts per program for the filter chips
  const countFor = p => _kids.filter(r => (r.program_name||'') === p).length;
  const fmtDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'}) : '—';
  const owing = rows.filter(r => Number(r.true_due) > 0).length;

  // Per-class strip: headcount and what the class is worth
  const classStrip = PROGRAMS.filter(p => countFor(p)).map(p => {
    const set = _kids.filter(r => r.program_name === p);
    const due = set.reduce((a,r) => a + Number(r.true_due), 0);
    return `<div class="stat" style="padding:11px 13px">
      <div class="k">${p}</div><div class="v" style="font-size:19px">${set.length}</div>
      <div class="m">${!has('finance') ? '' : due > 0 ? money(due) + ' outstanding' : 'all paid'}</div></div>`;
  }).join('');

  el('body').innerHTML = head('Children', has('finance') ? 'Active roster. Quit and Transfer Out are excluded everywhere.' : 'Active roster — set batches and find contact details here.')
    + `<div class="stats" style="margin-bottom:14px">${classStrip}</div>
      <div class="tools">
          <div class="search"><input class="in" id="kid-q" type="search" placeholder="Search name, father or UIN" value="${esc(_kidQ)}"></div>
          <select class="in" id="kid-prog" style="width:auto">
            <option value="all">All classes (${_kids.length})</option>
            ${PROGRAMS.filter(p=>countFor(p)).map(p=>`<option value="${p}" ${_kidProg===p?'selected':''}>${p} (${countFor(p)})</option>`).join('')}
          </select>
          <select class="in" id="kid-batch" style="width:auto">
            <option value="all">Both batches</option>
            <option value="Morning"   ${_kidBatch==='Morning'?'selected':''}>Morning</option>
            <option value="Afternoon" ${_kidBatch==='Afternoon'?'selected':''}>Afternoon</option>
            <option value="Unset"     ${_kidBatch==='Unset'?'selected':''}>Batch not set</option>
          </select>
          <select class="in" id="kid-sort" style="width:auto">
            <option value="newest" ${_kidSort==='newest'?'selected':''}>Newest admission first</option>
            <option value="oldest" ${_kidSort==='oldest'?'selected':''}>Oldest first</option>
            <option value="name"   ${_kidSort==='name'?'selected':''}>Name A–Z</option>
            <option value="due"    ${_kidSort==='due'?'selected':''}>Biggest balance</option>
          </select>
      </div>

      <div class="panel"><div class="ptop"><h2>Roster</h2>
        <span class="hint" id="kid-count"><strong>${rows.length}</strong> shown of ${_kids.length} active ·
          <span style="color:var(--good)">${rows.length-owing} fully paid</span> ·
          <span style="color:var(--crit)">${owing} still owe</span></span></div>
      <div class="tw"><table><thead><tr>
        <th>Child</th><th>Parents</th><th>Class</th><th>Batch</th><th>Admitted</th>
        <th class="r">Fee</th><th class="r">Collected</th><th class="r">Truly due</th><th></th></tr></thead><tbody id="kid-rows">
      </tbody></table></div></div>`;

  // Wire the controls (preserve caret position in the search box)
  // Typing used to destroy and rebuild the whole panel — including the input
  // being typed into, hence the caret-restoring dance. Now only the table body
  // is redrawn, so the input is never touched and focus takes care of itself.
  const qEl = el('kid-q');
  qEl.oninput = debounce(() => { _kidQ = qEl.value; repaintKidRows(); }, 160);
  repaintKidRows();
  el('kid-prog').onchange  = e => { _kidProg  = e.target.value; renderChildren(); };
  el('kid-batch').onchange = e => { _kidBatch = e.target.value; renderChildren(); };
  el('kid-sort').onchange  = e => { _kidSort  = e.target.value; renderChildren(); };
}

async function setBatch(uin, batch){
  if (!batch) return;
  const { error } = await getSb().schema('eurokids').from('child_batch')
    .upsert({ uin, batch, updated_at: new Date().toISOString() });
  if (error) return alert('Could not save batch: ' + error.message);
  const k = _kids.find(x => x.uin === uin); if (k) k.batch = batch;
  renderChildren();
}

/* ── cash in hand: money received but not yet posted into EPMS ─────────── */
/* ── liabilities: everything we have physically taken in ──────────
   Two obligations attach to money the moment it reaches us, and they move
   independently: cash has to reach the bank, and tuition has to reach
   EuroKids. Until tuition is posted onward, EPMS still shows it as due while
   we are the ones holding it — so only the un-posted part is netted off the
   parent's balance. Day care, uniform and event money never enters EPMS at
   all and never touches a fee.                                            */
let _liab = { recs: [], kids: [], byLabel: {} };

// A half-typed receipt must survive a trip to another tab. Kept in memory for
// the session and mirrored to localStorage so a stray refresh doesn't lose it.
const LB_FIELDS = ['lb-child','lb-name','lb-email','lb-phone','lb-purpose',
                   'lb-purpose-note','lb-mode','lb-amt','lb-on','lb-by'];
const lbDraftSave = () => {
  const d = { who: _liab.who };
  LB_FIELDS.forEach(id => { const e = el(id); if (e) d[id] = e.value; });
  _liab.draft = d;
  try { localStorage.setItem('ek-liab-draft', JSON.stringify(d)); } catch (_) {}
};
const lbDraftLoad = () => {
  if (_liab.draft) return _liab.draft;
  try { return JSON.parse(localStorage.getItem('ek-liab-draft') || 'null'); } catch (_) { return null; }
};
const lbDraftClear = () => {
  _liab.draft = null;
  try { localStorage.removeItem('ek-liab-draft'); } catch (_) {}
};

async function tabLiability(){
  el('body').innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  const [{ data: recs, error }, { data: kids }] = await Promise.all([
    s.schema('eurokids').from('receipt_offline').select('*').order('received_on', { ascending: false }).limit(2000),
    s.schema('eurokids').from('v_schedule').select('uin,student_name,program_name').order('student_name').limit(2000),
  ]);
  if (error) return el('body').innerHTML = fail(error);
  _liab.recs = recs || [];
  _liab.kids = kids || [];

  // "Name — Class" keeps two children of the same name apart.
  _liab.byLabel = {};
  const dupe = {};
  (kids || []).forEach(k => { dupe[k.student_name] = (dupe[k.student_name] || 0) + 1; });
  const options = (kids || []).map(k => {
    const label = `${k.student_name} — ${k.program_name || 'class ?'}`;
    _liab.byLabel[label.toLowerCase()] = k;
    return `<option value="${esc(label)}">`;
  }).join('');

  const sum = f => _liab.recs.filter(f).reduce((a, r) => a + Number(r.amount_rupees), 0);
  const heldForEuro = _liab.recs.filter(r => r.purpose === 'tuition')
    .reduce((a, r) => a + (Number(r.amount_rupees) - Number(r.remitted || 0)), 0);
  const notBanked = sum(r => r.mode === 'Cash' && !r.deposited_on);
  const otherMoney = sum(r => r.purpose !== 'tuition');

  el('body').innerHTML = head('Liabilities',
      'Money already in our hands. Cash still to reach the bank, fees still to reach EuroKids, and collections that were never EuroKids’ to begin with.',
      `<button class="btn" id="lb-open">Record Money…</button>`)
    + `<div class="stats" style="margin-bottom:16px">
        <div class="stat crit"><div class="k">Owed to EuroKids</div><div class="v">${money(heldForEuro)}</div>
          <div class="m">Fee money taken but not yet posted</div></div>
        <div class="stat warn"><div class="k">Cash not banked</div><div class="v">${money(notBanked)}</div>
          <div class="m">Physically with us</div></div>
        <div class="stat"><div class="k">Other collections</div><div class="v">${money(otherMoney)}</div>
          <div class="m">Day care, uniform, events — ours, not EuroKids’</div></div>
      </div>

      <div class="tools">
        <div class="search"><input class="in" id="lb-q" type="search" placeholder="Search a name"></div>
        <select class="in" id="lb-f">
          <option value="">Everything</option>
          <option value="owed">Still owed to EuroKids</option>
          <option value="cash">Cash not yet banked</option>
          <option value="other">Other collections</option>
          <option value="done">Fully posted</option>
        </select>
      </div>

      <div class="panel"><div class="ptop"><h2 id="lb-h">Receipts</h2>
        <span class="hint">Posting to EuroKids is matched automatically on the next sync</span></div>
        <div class="tw"><table><thead><tr><th>Who</th><th>For</th><th>Mode</th><th class="r">Amount</th>
          <th class="r">Still Held</th><th>Received</th><th>By</th><th>Banked</th><th></th></tr></thead>
        <tbody id="lb-rows"></tbody></table></div></div>`;

  // ── recording money is a scoped task, so it opens as a sheet ─────────────
  const openRecord = () => {
    const body = openDrawer('Record Money', 'What came in, from whom, and what it was for.');
    body.innerHTML = `
      <div class="grp"><div class="box">
        <div class="row"><div class="l">Paid by</div>
          <div class="seg"><button id="lb-t-child" data-who="child">A school child</button><button id="lb-t-other" data-who="other">Someone else</button></div></div>
      </div><div class="foot">“Someone else” is for day care, guests and anything not tied to a child on the roll.</div></div>

      <div class="grp" id="lb-child-row"><h3>Child</h3><div class="box">
        <div class="row"><div class="l">Child</div><input class="in wide" id="lb-child" list="lb-kids" placeholder="Start typing a name" autocomplete="off"><datalist id="lb-kids">${options}</datalist></div>
        <div class="row"><div class="l">For</div><select class="in" id="lb-purpose"><option value="tuition">Tuition / term fees</option><option value="other">Something else…</option></select></div>
      </div><div class="foot" id="lb-child-hint">${(kids || []).length} children on the roll</div></div>

      <div class="grp" id="lb-other-row" style="display:none"><h3>Payer</h3><div class="box">
        <div class="row"><div class="l">Name</div><input class="in wide" id="lb-name" placeholder="e.g. Aarav (day care only)"></div>
        <div class="row"><div class="l">Email</div><input class="in wide" id="lb-email" type="email" placeholder="optional — for the receipt"></div>
        <div class="row"><div class="l">Phone</div><input class="in wide" id="lb-phone" placeholder="optional"></div>
      </div></div>

      <div class="grp" id="lb-purpose-note-wrap" style="display:none"><div class="box">
        <div class="row"><div class="l">What for</div><input class="in wide" id="lb-purpose-note" placeholder="e.g. Day care August · Uniform · Annual function"></div>
      </div></div>

      <div class="grp"><h3>Payment</h3><div class="box">
        <div class="row"><div class="l">Amount</div><input class="in num" id="lb-amt" type="number" min="1" placeholder="₹"></div>
        <div class="row"><div class="l">Mode</div><select class="in" id="lb-mode"><option>Cash</option><option>UPI</option><option>Cheque</option><option>Other</option></select></div>
        <div class="row"><div class="l">Received on</div><input class="in" id="lb-on" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="row"><div class="l">Received by</div><input class="in" id="lb-by" placeholder="who took it"></div>
      </div></div>

      <div class="grp"><div class="box">
        <label class="row" id="lb-receipt-label" style="cursor:pointer"><span class="l">Email a receipt now<span class="sub" id="lb-receipt-hint"></span></span><input type="checkbox" class="sw" id="lb-receipt" checked></label>
      </div></div>`;
    el('drawer-foot').innerHTML = `<div id="pf-msg"></div><button class="btn line" id="lb-cancel">Cancel</button><button class="btn" id="lb-add">Record</button>`;
    el('lb-cancel').onclick = closeDrawer;
    wireRecord();
  };
  el('lb-open').onclick = openRecord;

  function wireRecord(){
  // ── who-is-paying toggle ────────────────────────────────────────────────
  const setWho = who => {
    _liab.who = who;
    el('lb-t-child').classList.toggle('on', who === 'child');
    el('lb-t-other').classList.toggle('on', who !== 'child');
    el('lb-child-row').style.display = who === 'child' ? '' : 'none';
    el('lb-other-row').style.display = who === 'child' ? 'none' : '';
    // Someone off the roll can never be paying EuroKids tuition.
    if (who !== 'child') { el('lb-purpose').value = 'other'; }
    togglePurposeNote();
    refreshReceiptTick();
  };
  // Don't offer to email a receipt when there is nowhere to send it.
  const refreshReceiptTick = () => {
    const box = el('lb-receipt'); if (!box) return;
    const hasAddress = _liab.who === 'child'
      ? !!_liab.byLabel[(el('lb-child').value || '').trim().toLowerCase()]
      : !!(el('lb-email').value || '').trim();
    box.disabled = !hasAddress;
    if (!hasAddress) box.checked = false;
    el('lb-receipt-label').style.opacity = hasAddress ? '1' : '.55';
    el('lb-receipt-hint').textContent = hasAddress ? 'Goes to the family, cc the office.'
      : (_liab.who === 'child' ? 'Pick a child first.' : 'Add their email above to enable this.');
  };
  const togglePurposeNote = () => {
    const other = _liab.who !== 'child' || el('lb-purpose').value === 'other';
    el('lb-purpose-note-wrap').style.display = other ? '' : 'none';
  };
  el('lb-t-child').onclick = () => { setWho('child'); lbDraftSave(); };
  el('lb-t-other').onclick = () => { setWho('other'); lbDraftSave(); };
  el('lb-purpose').onchange = () => { togglePurposeNote(); lbDraftSave(); };

  // Restore anything half-typed before the user wandered off.
  const draft = lbDraftLoad();
  setWho(draft?.who || 'child');
  if (draft) {
    LB_FIELDS.forEach(id => { const e = el(id); if (e && draft[id] != null) e.value = draft[id]; });
    togglePurposeNote();
    if (LB_FIELDS.some(id => id !== 'lb-on' && id !== 'lb-mode' && (draft[id] || '').trim())) {
      el('pf-msg').innerHTML = `<div class="ok">Picked up where you left off. <a href="#" id="lb-clear" style="color:inherit;font-weight:600">Clear it</a></div>`;
      el('lb-clear').onclick = ev => { ev.preventDefault(); lbDraftClear(); openRecord(); };
    }
  }
  LB_FIELDS.forEach(id => {
    const e = el(id); if (!e) return;
    if (!e.oninput)  e.oninput  = lbDraftSave;
    if (!e.onchange) e.onchange = lbDraftSave;
  });
  refreshReceiptTick();

  el('lb-child').oninput = e => {
    const k = _liab.byLabel[(e.target.value || '').trim().toLowerCase()];
    el('lb-child-hint').textContent = k
      ? `${k.student_name} · ${k.program_name || 'class ?'}`
      : `${_liab.kids.length} children on the roll`;
    el('lb-child-hint').style.color = k ? 'var(--green)' : '';
    refreshReceiptTick();
    lbDraftSave();
  };
  el('lb-email').oninput = () => { refreshReceiptTick(); lbDraftSave(); };
  el('lb-add').onclick = recordMoney;
  setTimeout(() => el(_liab.who === 'child' ? 'lb-child' : 'lb-name')?.focus(), 250);
  }   // wireRecord

  // A draft left behind reopens the sheet, so nothing typed is lost.
  const d0 = lbDraftLoad();
  if (d0 && LB_FIELDS.some(id => id !== 'lb-on' && id !== 'lb-mode' && (d0[id] || '').trim())) openRecord();

  // ── the list ────────────────────────────────────────────────────────────
  const paintRows = () => {
    const q = (el('lb-q').value || '').trim().toLowerCase();
    const f = el('lb-f').value;
    let rows = _liab.recs.filter(r => {
      const held = Number(r.amount_rupees) - Number(r.remitted || 0);
      if (q && !((r.student_name || '') + ' ' + (r.purpose_note || '')).toLowerCase().includes(q)) return false;
      if (f === 'owed'  && !(r.purpose === 'tuition' && held > 0.01)) return false;
      if (f === 'cash'  && !(r.mode === 'Cash' && !r.deposited_on)) return false;
      if (f === 'other' && r.purpose === 'tuition') return false;
      if (f === 'done'  && !(r.purpose === 'tuition' && held <= 0.01)) return false;
      return true;
    });
    el('lb-h').textContent = `${rows.length} receipt${rows.length === 1 ? '' : 's'}`;
    el('lb-rows').innerHTML = rows.map(r => {
      const held = Number(r.amount_rupees) - Number(r.remitted || 0);
      const isFee = r.purpose === 'tuition';
      return `<tr>
        <td><strong>${esc(r.student_name || '—')}</strong>${r.uin ? '' : ' <span class="chip c-mute">not on roll</span>'}
          ${r.receipt_sent_at ? '<br><span class="hint" style="font-size:10.5px">receipt emailed</span>' : ''}</td>
        <td>${isFee ? '<span class="chip c-good">Fees</span>'
                    : `<span class="chip c-mute">${esc(r.purpose_note || 'Other')}</span>`}</td>
        <td><span class="chip ${r.mode === 'Cash' ? 'c-warn' : 'c-mute'}">${esc(r.mode)}</span></td>
        <td class="r num" style="font-weight:600">${money(r.amount_rupees)}</td>
        <td class="r num">${isFee ? (held > 0.01
             ? `<span style="color:var(--crit);font-weight:600">${money(held)}</span>`
             : '<span class="chip c-good">posted</span>') : '—'}</td>
        <td class="hint">${shortDate(r.received_on)}</td>
        <td class="hint">${esc(r.received_by || '—')}</td>
        <td><input class="in" type="date" value="${r.deposited_on || ''}" style="padding:3px 6px;font-size:12px;width:auto"
              onchange="setDeposited(${r.id}, this.value, this)"></td>
        <td style="white-space:nowrap">
          ${r.uin ? `<a style="cursor:pointer" onclick="openStatement('${esc(r.uin)}')">Statement</a> · ` : ''}
          ${r.uin ? `<a style="cursor:pointer" onclick="sendReceipt(${r.id}, this)">Receipt</a> · ` : ''}
          <a style="color:var(--crit);cursor:pointer" onclick="delReceipt(${r.id})">Remove</a></td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--muted)">Nothing matches.</td></tr>`;
  };
  paintRows();
  el('lb-q').oninput = debounce(paintRows, 160);
  el('lb-f').onchange = paintRows;

  // ── record ──────────────────────────────────────────────────────────────
  async function recordMoney(e){
    const btn = e.currentTarget;
    const amt = Number(el('lb-amt').value) || 0;
    const say = (h, c='err') => el('pf-msg').innerHTML = `<div class="${c}">${h}</div>`;
    if (amt <= 0) return say('Enter an amount.');

    let uin = null, name = null, purpose = 'other', email = null, phone = null;
    if (_liab.who === 'child') {
      const k = _liab.byLabel[(el('lb-child').value || '').trim().toLowerCase()];
      if (!k) return say('Pick a child from the list — start typing and choose a suggestion.');
      uin = k.uin; name = k.student_name; purpose = el('lb-purpose').value;
    } else {
      name = (el('lb-name').value || '').trim();
      if (!name) return say('Whose money is this? Enter a name.');
      email = (el('lb-email').value || '').trim().toLowerCase() || null;
      phone = (el('lb-phone').value || '').trim() || null;
    }
    const note = (el('lb-purpose-note').value || '').trim();
    if (purpose === 'other' && !note) return say('Say what this payment is for.');

    btn.disabled = true; btn.textContent = 'Saving…';
    const { data, error } = await getSb().schema('eurokids').from('receipt_offline').insert({
      uin, student_name: name, purpose, purpose_note: purpose === 'other' ? note : null,
      mode: el('lb-mode').value, amount_rupees: amt,
      received_on: el('lb-on').value || new Date().toISOString().slice(0,10),
      received_by: el('lb-by').value || null,
      payer_email: email, payer_phone: phone,
    }).select('id').maybeSingle();
    if (error) {
      btn.disabled = false; btn.textContent = 'Record';
      // Surface the real reason — a silent failure here loses real money records.
      return say(`Could not save: ${esc(error.message)}${error.hint ? ' — ' + esc(error.hint) : ''}`);
    }

    lbDraftClear();
    const canEmail = el('lb-receipt').checked && data?.id && (uin || email);
    if (canEmail) {
      // The money is already committed at this point. If the email fails the
      // operator must be told it was SAVED, or they re-enter it and the cash
      // is counted twice.
      btn.textContent = 'Emailing receipt…';
      try {
        const r = await feesApi('/api/fees/payment-receipt', { receipt_id: data.id });
        say(r.ok ? `Recorded. Receipt emailed to ${esc((r.sent_to || []).join(', '))}.`
                 : `Recorded — but the receipt email failed: ${esc(r.error || '')}. Use the Receipt link on the row to retry. Do not enter the payment again.`,
            r.ok ? 'ok' : 'err');
      } catch (e) {
        say(`Recorded — but the receipt email failed: ${esc(e.message)}. Use the Receipt link on the row to retry. Do not enter the payment again.`, 'err');
      } finally {
        btn.textContent = 'Recorded ✓';
        setTimeout(() => { closeDrawer(); if (tab === 'liability') tabLiability(); }, 1800);
      }
    } else {
      closeDrawer(); tabLiability();
    }
  }
}

async function sendReceipt(id, a){
  const rec = _liab.recs.find(x => x.id === id);
  if (!confirm(`Email a receipt for ${money(rec?.amount_rupees || 0)} to ${rec?.student_name || 'this family'}?`
      + (rec?.receipt_sent_at ? '\n\nOne was already sent. Send another?' : ''))) return;
  const was = a.textContent;
  a.textContent = 'sending…';
  a.style.pointerEvents = 'none';          // a second click sent a second email
  try {
    const r = await feesApi('/api/fees/payment-receipt', { receipt_id: id });
    a.textContent = r.ok ? 'sent ✓' : 'failed';
    if (!r.ok) alert(r.error || 'Could not send the receipt.');
    else if (rec) { rec.receipt_sent_at = new Date().toISOString(); }
  } catch (e) {
    a.textContent = 'failed';
    alert('Could not send the receipt: ' + e.message);
  } finally {
    setTimeout(() => { a.textContent = was; a.style.pointerEvents = ''; }, 2500);
  }
}

async function setDeposited(id, d, box){
  const { error } = await getSb().schema('eurokids').from('receipt_offline')
    .update({ deposited_on: d || null }).eq('id', id);
  if (error) {
    // Leaving the date sitting in the box made a refused write look saved.
    alert('Could not record the deposit: ' + error.message);
    const rec = _liab.recs.find(x => x.id === id);
    if (box) box.value = rec?.deposited_on || '';
    return;
  }
  const rec = _liab.recs.find(x => x.id === id);
  if (rec) rec.deposited_on = d || null;
  tabLiability();          // the "Cash not banked" total has just changed
}
async function delReceipt(id){
  const rec = _liab.recs.find(x => x.id === id);
  if (rec && Number(rec.remitted || 0) > 0.01) {
    return alert(`${rec.student_name}'s receipt has already been part-posted to EuroKids (${money(rec.remitted)} of ${money(rec.amount_rupees)}).\n\nRemoving it would leave the books out of step. Correct it in EPMS first.`);
  }
  if (!confirm(`Remove the ${money(rec?.amount_rupees || 0)} ${(rec?.mode || '').toLowerCase()} receipt for ${rec?.student_name || 'this payer'}?\n\nThis un-does a recorded liability and cannot be undone.`)) return;
  const { error } = await getSb().schema('eurokids').from('receipt_offline').delete().eq('id', id);
  if (error) return alert('Could not remove it: ' + error.message);
  tabLiability();
}

async function tabPlans(){

  const CLASS_ORDER = ['play group', 'nursery', 'euro junior', 'euro senior'];
  const classRank = n => {
    const i = CLASS_ORDER.indexOf((n || '').trim().toLowerCase());

  const tint = k => k.schedule_flag === 'OVERDUE' ? 't-crit'
    : (k.schedule_flag === 'SETTLED' ? 't-good' : (k.schedule_flag === 'NO SCHEDULE' || k.schedule_flag === 'OVERPAID') ? 't-warn' : '');

  el('body').innerHTML = head('Fees &amp; Plans',
      'Fee, discount, instalments, letter — per child.')

        <select class="in" id="plan-sort" style="max-width:210px">
          ${[['new','Newest admission first'],['class','Class, then name'],['due','Most owed first'],['overdue','Most overdue first'],['missing','Needs a schedule first']]
            .map(([v,l]) => `<option value="${v}" ${_planF.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      <div class="panel"><div class="ptop"><h2 id="plan-h">All children</h2>
        <span class="hint">${withPlan} of ${(kids||[]).length} have a fee agreed</span></div>
        <div class="tw"><table><thead><tr><th>Child</th><th>Class</th>
          <th class="r">Fee</th><th class="r">Term 1 due</th><th class="r">Term 2 due</th>
          <th class="r">Truly due</th><th>Status</th><th></th></tr></thead>
        <tbody id="plan-rows"></tbody></table></div></div>
      <div id="plan-editor"></div>`;

  const paint = () => {
    _planF = { q: el('plan-q').value || '', cls: el('plan-class').value, sort: el('plan-sort').value };
    const q = _planF.q.trim().toLowerCase();
    const cls = _planF.cls.toLowerCase();

      (!q || (k.student_name || '').toLowerCase().includes(q) || (k.uin || '').toLowerCase().includes(q)) &&
      (!cls || (k.program_name || '').trim().toLowerCase() === cls));

    if (sort === 'class')        rows.sort((a,b) => classRank(a.program_name) - classRank(b.program_name) || (a.student_name||'').localeCompare(b.student_name||''));
    else if (sort === 'due')     rows.sort((a,b) => Number(b.true_due||0) - Number(a.true_due||0));
    else if (sort === 'overdue') rows.sort((a,b) => (b.schedule_flag==='OVERDUE') - (a.schedule_flag==='OVERDUE') || Number(b.true_due||0) - Number(a.true_due||0));
    else if (sort === 'missing') rows.sort((a,b) => (a.has_schedule?1:0) - (b.has_schedule?1:0) || Number(b.true_due||0) - Number(a.true_due||0));

    el('plan-h').textContent = `${rows.length} ${rows.length === 1 ? 'child' : 'children'}`;
    el('plan-rows').innerHTML = rows.map(k => {
      const fee = Number(k.final_fee || 0);
      return `<tr class="${tint(k)}" style="cursor:pointer" onclick="openPlan('${esc(k.uin)}')"><td><strong>${esc(k.student_name)}</strong>

          <span class="uin">${esc(k.uin)}</span></td>
        <td>${esc(k.program_name || '')}</td>

  };
  paint();
  const paintSoon = debounce(paint, 160);
  el('plan-q').oninput = paintSoon;                 // typing: debounced
  ['plan-class','plan-sort'].forEach(id => el(id).onchange = paint);   // selects: once

// One drawer for a child, used from every tab. Opening it never re-renders
// the list behind it, so filters and scroll position survive.
function openDrawer(title, subtitle){
  let bg = el('drawer-bg'), dr = el('drawer');
  if (!bg) {
    document.body.insertAdjacentHTML('beforeend',
      `<div id="drawer-bg" class="drawer-bg"></div>
       <aside id="drawer" class="drawer" role="dialog" aria-modal="true">
         <div class="drawer-hd"><div><h2 id="drawer-title"></h2><div class="hint" id="drawer-sub"></div></div>
           <button class="drawer-x" id="drawer-x" aria-label="Close">×</button></div>
         <div class="drawer-body" id="drawer-body"></div>
         <div class="drawer-foot" id="drawer-foot"></div>
       </aside>`);
    bg = el('drawer-bg'); dr = el('drawer');
    bg.onclick = closeDrawer; el('drawer-x').onclick = closeDrawer;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  }
  el('drawer-title').textContent = title; el('drawer-sub').textContent = subtitle || '';
  el('drawer-body').innerHTML = '<div class="loading">Loading…</div>';
  el('drawer-foot').innerHTML = '';
  requestAnimationFrame(() => { bg.classList.add('on'); dr.classList.add('on'); });
  document.body.style.overflow = 'hidden';
  return el('drawer-body');
}
function closeDrawer(){
  el('drawer-bg')?.classList.remove('on'); el('drawer')?.classList.remove('on');
  document.body.style.overflow = '';
  if (typeof _afterDrawerClose === 'function') { const f = _afterDrawerClose; _afterDrawerClose = null; f(); }
}

// The statement: what was agreed, what came off, what came in (with dates
// where we have them), and what is left. Green is money in the family's
// favour, red is money still owed.
function statementHtml(c, ledger, items){
  const fee = Number(c.total_fee || c.epms_invoiced || 0);
  const disc = Number(c.our_discount || 0);
  const agreed = Number(c.agreed_fee || (fee - disc));
  const held = Number(c.uncredited_cash || 0);
  const owed = Number(c.true_due || 0);
  const settled = owed <= 1;
  const d = x => x ? longDate(x) : '';
  const pays = (ledger || []).filter(l => l.counts_to_fees).sort((a,b) => String(a.on_date).localeCompare(String(b.on_date)));
  const epmsKnown = pays.filter(l => l.source === 'epms').reduce((a,l) => a + Number(l.amount), 0);
  const epmsUndated = Math.max(0, Number(c.collected || 0) - epmsKnown);
  const over = Number(c.overpaid || 0);
  const nextDue = !settled && c.next_due_date ? `Next instalment ${money(c.next_amount || 0)} due ${d(c.next_due_date)}` : '';
  const heroCls = settled ? (over > 1 ? 'credit' : 'paid') : 'due';
  const heroK = settled ? (over > 1 ? 'Paid in full · credit' : 'Paid in full') : (c.schedule_flag === 'OVERDUE' ? 'Overdue' : 'Balance due');
  const heroV = settled ? (over > 1 ? '+' + money(over) : money(0)) : money(owed);
  const heroM = settled ? 'Nothing outstanding.' : (nextDue || 'No instalment scheduled.');
  const line = (l, v, cls = '', sub = '') =>
    `<div class="row"><div class="l">${l}${sub ? `<span class="sub">${sub}</span>` : ''}</div><div class="v ${cls}">${v}</div></div>`;
  return `
    <div class="hero ${heroCls}"><div class="k">${heroK}</div><div class="v">${heroV}</div><div class="m">${heroM}</div></div>
    <div class="grp"><h3>Statement</h3><div class="box">
      ${line('Annual fee', money(fee), 'mute', 'as invoiced by EuroKids')}
      ${disc > 0 ? line('Our discount', '− ' + money(disc), 'credit') : ''}
      ${line('<strong>Agreed fee</strong>', '<strong>' + money(agreed) + '</strong>')}
      ${epmsUndated > 0 ? line('Paid to EuroKids', '− ' + money(epmsUndated), 'credit', 'before we started tracking dates') : ''}
      ${pays.map(l => line(l.source === 'epms' ? 'Paid to EuroKids' : 'Paid to us', '− ' + money(l.amount), 'credit',
          `${d(l.on_date)}${l.mode && l.source !== 'epms' ? ' · ' + esc(l.mode) : ''}${Number(l.still_held) > 0.01 ? ' · ' + money(l.still_held) + ' not yet posted' : ''}`)).join('')}
      <div class="row total"><div class="l">${settled ? 'Balance' : 'Balance due'}</div><div class="v ${settled ? 'credit' : 'due'}">${money(owed)}</div></div>
    </div>
    ${held > 0 ? `<div class="foot warn">EuroKids still shows ${money(c.epms_due)} because ${money(held)} of this family's money has not been posted to them yet. The balance above is the honest one.</div>` : ''}
    </div>`;
}

      if (i !== rows.length - 1) autoLast();
    });
    document.querySelectorAll('.pf-due').forEach(x => x.onchange = e => { rows[+e.target.dataset.i].due_date = e.target.value; });
    document.querySelectorAll('.pf-del').forEach(x => x.onclick = e => { rows.splice(+e.target.dataset.i,1); drawItems(); autoLast(); });
  };

  // final = total − discount; last instalment = final − everything before it
  const recalcFinal = () => {
    const t = Number(el('pf-total').value)||0, d = Number(el('pf-disc').value)||0;
    el('pf-final').value = Math.max(0, t - d);
  };
  const warnMismatch = () => {
    const box = el('pf-warn'); if (!box) return;
    const final = Number(el('pf-final').value) || 0;
    const sum = rows.reduce((a, r) => a + (Number(r.amount) || 0), 0);
    const gap = Math.round(sum - final);
    box.innerHTML = (final > 0 && Math.abs(gap) > 1)
      ? `<div class="foot warn">The instalments add up to ${money(sum)} but the agreed fee is ${money(final)} —
           <strong>${gap > 0 ? money(gap) + ' too much' : money(-gap) + ' short'}</strong>.
           A letter cannot be sent until these agree.</div>` : '';
  };

  // The fee must be what EPMS billed this family — the Payment Due report —
  // never the standard grid. Uniform opt-outs and joining-month pricing make
  // the two differ, and the grid figure over-bills.
  const epmsFee = Number(kid?.epms_invoiced || 0);
  const warnFee = () => {
    const box = el('pf-fee-warn'); if (!box) return;
    const t = Number(el('pf-total').value) || 0;
    box.innerHTML = (epmsFee > 0 && Math.abs(t - epmsFee) > 1)
      ? `<div class="foot warn">EPMS invoiced <strong>${money(epmsFee)}</strong>, not ${money(t)}.
           <a href="#" id="pf-use-epms" style="margin-left:6px">Use the EPMS figure</a></div>`
      : '';
    const a = el('pf-use-epms');
    if (a) a.onclick = ev => { ev.preventDefault(); el('pf-total').value = epmsFee; autoLast(); };
  };
  const autoLast = () => {
    recalcFinal();
    warnFee();
    const final = Number(el('pf-final').value)||0;
    if (rows.length < 2) { if (rows.length===1 && !rows[0].amount) { rows[0].amount = final;
      const f = document.querySelector('.pf-amt[data-i="0"]'); if (f) f.value = final; } return; }
    const head = rows.slice(0,-1).reduce((a,r)=>a + (Number(r.amount)||0), 0);
    const last = Math.max(0, final - head);
    setTimeout(warnMismatch, 0);
    rows[rows.length-1].amount = last;
    const lastEl = document.querySelector(`.pf-amt[data-i="${rows.length-1}"]`);
    if (lastEl) lastEl.value = last;
  };

  drawItems(); autoLast(); warnMismatch();
  el('pf-total').oninput = autoLast;
  el('pf-disc').oninput  = autoLast;
  el('pf-add').onclick = () => { if (rows.length >= 5) return alert('Five instalments is the maximum.');
    rows.push({ amount:'', due_date:'' }); drawItems(); autoLast(); };

  const savePlan = async () => {
    const total = Number(el('pf-total').value)||0, disc = Number(el('pf-disc').value)||0;
    const final = Math.max(0, total - disc);
    const clean = rows.filter(r => Number(r.amount) > 0 && r.due_date);
    if (!clean.length) { el('pf-msg').innerHTML = '<div class="err">Add at least one instalment with an amount and a date.</div>'; return false; }
    const sum = clean.reduce((a,r)=>a+Number(r.amount),0);
    if (Math.abs(sum - final) > 1) { el('pf-msg').innerHTML = `<div class="err">Instalments add to ${money(sum)} but the final fee is ${money(final)}.</div>`; return false; }

    const s = getSb();
    const p = await s.schema('eurokids').from('payment_plan').upsert({
      uin: _planUin, total_fee: total, our_discount: disc, final_fee: final,
      note: el('pf-note').value || null, updated_at: new Date().toISOString() }, { onConflict: 'uin' });
    if (p.error) { el('pf-msg').innerHTML = `<div class="err">${esc(p.error.message)}</div>`; return false; }

    await s.schema('eurokids').from('payment_plan_item').delete().eq('uin', _planUin);
    const ins = await s.schema('eurokids').from('payment_plan_item')
      .insert(clean.map((r,i) => ({ uin: _planUin, seq: i+1, amount: Number(r.amount), due_date: r.due_date })));
    if (ins.error) { el('pf-msg').innerHTML = `<div class="err">${esc(ins.error.message)}</div>`; return false; }

    // Always write, never skip: leaving the old row behind meant a discount
    // could be reduced to zero on screen while the family kept it forever, so
    // every reminder kept quoting a discount they no longer had.
    const dres = disc > 0
      ? await s.schema('eurokids').from('child_discount')
          .upsert({ uin: _planUin, amount_rupees: disc, reason: 'Payment plan' }, { onConflict: 'uin' })
      : await s.schema('eurokids').from('child_discount').delete().eq('uin', _planUin);
    if (dres.error) {
      // Silently swallowing this meant a coordinator without finance rights saw
      // "Plan saved" while the discount was refused by the database.
      el('pf-msg').innerHTML = `<div class="err">The plan saved, but the discount did not: ${esc(dres.error.message)}</div>`;
      return false;
    }

    await s.schema('eurokids').from('child_contact').upsert({
      uin: _planUin, parent_email1: el('pf-em1').value.trim() || null,
      parent_email2: el('pf-em2').value.trim() || null, updated_at: new Date().toISOString() }, { onConflict: 'uin' });
    invalidate('views');
    return true;
  };

  el('pf-save').onclick = async () => {
    el('pf-msg').innerHTML = '';
    if (await savePlan()) {
      el('pf-msg').innerHTML = '<div class="ok">Plan saved.</div>';
      _afterDrawerClose = () => { if (tab === 'plans') tabPlans(); else if (tab === 'views') tabViews(); };
      setTimeout(() => openPlan(_planUin), 500);       // refresh the statement in place
    }
  };

  // One "Send…" menu. A test goes only to the address typed, never to the
  // parents; a real send is confirmed with who and what before it leaves.
  const menu = el('pf-menu'), sendBtn = el('pf-sendbtn');
  sendBtn.onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  if (!window._pfMenuBound) {   // one listener for the life of the page, not one per open
    window._pfMenuBound = true;
    document.addEventListener('click', e => { const m = el('pf-menu'); if (m && !m.contains(e.target)) m.classList.remove('open'); });
  }
  menu.addEventListener('click', e => e.stopPropagation());
  el('pf-testmode').onchange = e => { el('pf-test-to').style.display = e.target.checked ? '' : 'none'; if (e.target.checked) el('pf-test-to').focus(); };

  const sendLetter = async (kind) => {
    el('pf-msg').innerHTML = '';
    const name = kid?.student_name || 'this child';
    const owed = Number(kid?.true_due || 0);
    const testTo = el('pf-testmode').checked ? (el('pf-test-to').value || '').trim() : '';
    if (el('pf-testmode').checked && !testTo.includes('@')) { el('pf-msg').innerHTML = '<div class="err">Enter an email address to send the test to.</div>'; return; }

    if (!testTo) {
      const ask =
        kind === 'welcome'  ? `Send the welcome letter to ${name}'s parents?` +
                              (plan?.welcome_sent_at ? `\n\nThey were already sent one on ${
                                new Date(plan.welcome_sent_at).toLocaleDateString('en-IN')}. Send it again?` : '')
      : kind === 'schedule' ? `Email ${name}'s parents the payment schedule?`
      : kind === 'statement' ? `Email ${name}'s parents their fee statement — every payment received and ${owed > 1 ? money(owed) + ' still due' : 'nothing outstanding'}?`
      :                       `Tell ${name}'s parents their fees are fully paid?` +
                              (owed > 1 ? `\n\nCAREFUL — this family still owes ${money(owed)}. The letter will say nothing is outstanding.` : '');
      if (!confirm(ask)) return;
      // Only the welcome letter is a "save then send". Re-sending the terms or
      // a receipt must never rewrite the plan, and a fully-paid child often
      // has no schedule rows at all, which savePlan() would refuse.
      if (kind === 'welcome' && !(await savePlan())) return;
    }
    menu.classList.remove('open');
    const label = sendBtn.textContent; sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    try {
      const { data: { session: sess } } = await getSb().auth.getSession();
      if (!sess) throw new Error('Your session has expired — please sign in again.');
      const r = await fetch('/api/fees/welcome-email', { method:'POST',
        headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${sess.access_token}` },
        body: JSON.stringify({ uin: _planUin, kind, ...(testTo ? { testTo } : {}) }) });
      const j = await r.json().catch(() => ({ error: `The server returned ${r.status}. The email may not have been sent — check Resend before trying again.` }));
      el('pf-msg').innerHTML = j.ok
        ? `<div class="ok">${testTo
            ? `Test sent to ${esc(testTo)}. For real it would go to ${esc((j.would_go_to||[]).join(', ') || 'nobody — no parent email on file')}.`
            : `Sent to ${esc((j.sent_to||[]).join(', '))} (cc ${esc(j.cc||'')}).`}</div>`
        : `<div class="err">${esc(j.error||'Could not send')}</div>`;
      if (j.ok && !testTo && kind === 'welcome') openPlan(_planUin);   // refresh the "last sent" stamp
    } catch(e) {
      el('pf-msg').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    } finally {
      sendBtn.disabled = false; sendBtn.textContent = label;
    }
  };
  menu.querySelectorAll('button[data-kind]').forEach(b => b.onclick = () => sendLetter(b.dataset.kind));

  // ── notes ──
  const drawNotes = async () => {
    const { data: notes } = await s.schema('eurokids').from('child_note')
      .select('id,body,author,created_at').eq('uin', uin).order('created_at', { ascending: false });
    el('cn-list').innerHTML = (notes || []).map(x => `
      <div class="note">${esc(x.body)}<div class="who">
          <span>${esc(x.author || '')} · ${new Date(x.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
          <a href="#" data-id="${x.id}" class="cn-del">Remove</a></div></div>`).join('');
    document.querySelectorAll('.cn-del').forEach(a => a.onclick = async ev => {
      ev.preventDefault();
      if (!confirm('Remove this note?')) return;
      await s.schema('eurokids').from('child_note').delete().eq('id', Number(a.dataset.id));
      drawNotes();
    });
  };
  el('cn-add').onclick = async () => {
    const body = (el('cn-body').value || '').trim(); if (!body) return;
    const who = (profile?.full_name || session?.user?.email || '').split('@')[0];
    const { error: ne } = await s.schema('eurokids').from('child_note')
      .insert({ uin, body, author: who, created_by: session?.user?.id || null });
    if (ne) return alert('Could not save the note: ' + ne.message);
    invalidate('views');
    el('cn-body').value = ''; drawNotes();
  };
  drawNotes();
  // the note box grows with the text, like Messages
  const ta = el('cn-body');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; };

  el('drawer-body').scrollTop = 0;
}

/* ── discounts: where the phantom dues get corrected ──── */
async function tabDiscounts(){
  const s = getSb();
  const [{ data: rows, error }, { data: existing }] = await Promise.all([
    s.schema('eurokids').from('v_dues').select('uin,student_name,program_name,epms_due,our_discount,true_due')
      .order('student_name').limit(2000),
    s.schema('eurokids').from('child_discount').select('uin,amount_rupees,reason')
  ]);
  if (error) return el('body').innerHTML = fail(error);
  const byUin = Object.fromEntries((existing || []).map(r => [r.uin, r]));
  el('body').innerHTML = head('Discounts', 'Money you took off your own margin. EPMS never sees these, so it keeps showing them as due.')
    + `<div class="panel"><div class="ptop"><h2>Per-child discount</h2>
        <span class="hint">Type an amount and press Enter. Everything recalculates.</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th>
        <th class="r">EPMS says due</th><th style="width:150px">Our discount</th>
        <th class="r">Truly due</th><th>Reason</th></tr></thead><tbody>
        ${(rows || []).map(r => `<tr data-uin="${esc(r.uin)}">
          <td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
          <td class="r num" style="color:var(--faint)">${money(r.epms_due)}</td>
          <td><input class="in num disc" type="number" min="0" value="${Number(r.our_discount) || ''}" placeholder="0"></td>
          <td class="r num truedue" style="font-weight:600">${money(r.true_due)}</td>
          <td><input class="in reason" value="${esc(byUin[r.uin]?.reason || '')}" placeholder="optional"></td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  document.querySelectorAll('tr[data-uin]').forEach(tr => {
    const uin = tr.dataset.uin;
    const amt = tr.querySelector('.disc'), reason = tr.querySelector('.reason');
    const save = async () => {
      const v = Number(amt.value) || 0;
      const { error } = await getSb().schema('eurokids').from('child_discount')
        .upsert({ uin, amount_rupees: v, reason: reason.value || null }, { onConflict: 'uin' });
      amt.style.borderColor = error ? 'var(--crit)' : 'var(--good)';
      if (!error) { tab = 'discounts'; setTimeout(() => renderApp(), 350); }
    };
    amt.onkeydown = e => { if (e.key === 'Enter') save(); };
    amt.onblur = save;
    reason.onkeydown = e => { if (e.key === 'Enter') save(); };
    reason.onblur = save;          // typing a reason and clicking away lost it
  });
}

/* ── kits: eligibility, never amounts ─────────────────── */
async function tabKits(){
  const { data, error } = await getSb().schema('eurokids').from('v_kit_worklist')
    .select('uin,student_name,program_name,paid_enough_for_kit,dispatched_on,lr_number,handed_over_on,state')
    .order('state');
  if (error) return el('body').innerHTML = fail(error);
  const label = { handed_over:['c-good','Handed over'], ready_to_hand_over:['c-warn','Ready to hand over'],
                  awaiting_dispatch:['c-mute','Awaiting dispatch'], payment_short:['c-crit','Payment short'] };
  const ready = (data || []).filter(r => r.state === 'ready_to_hand_over').length;
  el('body').innerHTML = head('Kits', 'EPMS knows the kit was dispatched. Only we know it reached the parent.')
    + `<div class="panel"><div class="ptop"><h2>Handover worklist</h2>
        <span class="chip ${ready ? 'c-warn' : 'c-mute'}">${ready} ready</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th><th>Consignment</th>
        <th>Dispatched</th><th>State</th></tr></thead><tbody>
        ${(data || []).map(r => {
          const [cls, txt] = label[r.state] || ['c-mute', r.state];
          return `<tr><td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
            <td class="num" style="color:var(--muted)">${esc(r.lr_number || '—')}</td>
            <td>${esc(r.dispatched_on || '—')}</td>
            <td><span class="chip ${cls}">${txt}</span></td></tr>`;
        }).join('')}
      </tbody></table></div></div>`;
}

/* ── fee reference ────────────────────────────────────── */
async function tabFees(){
  const { data, error } = await getSb().schema('eurokids').from('fee_grid')
    .select('epms_program_id,joining_month,discount_code,total_fee')
    .eq('discount_code', 'none').order('epms_program_id').order('joining_month');
  if (error) return el('body').innerHTML = fail(error);
  const PROG = { 24:'Play Group', 25:'Nursery', 26:'Euro Junior', 27:'Euro Senior' };
  const months = [...new Set((data || []).map(r => r.joining_month))];
  const grid = {};
  (data || []).forEach(r => { (grid[r.epms_program_id] ||= {})[r.joining_month] = r.total_fee; });
  const fmt = m => new Date(m + 'T00:00:00').toLocaleDateString('en-GB', { month:'short', year:'2-digit' });
  el('body').innerHTML = head('Fee Reference', 'All 288 combinations, read out of the EPMS Fee Calculator.')
    + `<div class="panel"><div class="ptop"><h2>Full-year fee by joining month</h2>
        <span class="chip c-good">exact, not modelled</span></div>
      <div class="tw"><table><thead><tr><th>Program</th>
        ${months.map(m => `<th class="r">${fmt(m)}</th>`).join('')}</tr></thead><tbody>
        ${Object.keys(grid).map(p => `<tr><td style="font-weight:500">${PROG[p] || p}</td>
          ${months.map(m => `<td class="r num">${Number(grid[p][m]).toLocaleString('en-IN')}</td>`).join('')}
        </tr>`).join('')}
      </tbody></table></div>
      <div class="pbody hint">No discount applied. The fee steps down in six bands because Term 2 falls away
        from October and tuition pro-rates after that.</div></div>`;
}

boot();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurokids JMD — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bone:#FFFFFF; --card:#FFF; --ink:#1A1A1A; --muted:#6B6B6B; --faint:#9A968F;
  --line:#E5E7EB; --line-2:#D1D5DB; --accent:#DC2B1C; --accent-wash:#FCEEEC; --bar:#000;
  --good:#1E7A4B; --good-wash:#E8F3ED; --warn:#9A6410; --warn-wash:#FAF0DF;
  --crit:#B32519; --crit-wash:#FBEBE9; --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:Inter,-apple-system,"Helvetica Neue",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{height:26px;background:var(--bar)}
.chrome{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;gap:16px;flex-wrap:wrap}
@media(max-width:560px){.chrome{padding:14px 18px}}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px}
.dot{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#FF7A5C,var(--accent) 62%,#A81E12);filter:blur(.4px)}
.chromeR{display:flex;align-items:center;gap:20px;font-size:13.5px;color:var(--muted)}
.chromeR a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stage{max-width:1180px;margin:0 auto;padding:0 34px 90px}
@media(max-width:560px){.stage{padding:0 18px 60px}}
.chooser{min-height:60vh;display:flex;flex-direction:column;justify-content:center;max-width:940px}
.hello{font-size:46px;font-weight:700;letter-spacing:-.035em}
.askline{color:var(--muted);font-size:16px;margin-top:6px}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:22px;margin-top:38px}
.door{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(26,26,26,.06),0 4px 14px -6px rgba(26,26,26,.08);transition:box-shadow .18s,transform .18s,border-color .18s;width:100%}
.door:hover:not(.shut){box-shadow:0 6px 22px rgba(26,26,26,.09);transform:translateY(-2px);border-color:var(--line-2)}
.door h3{font-size:19px;font-weight:600}
.door p{margin:0;color:var(--muted);font-size:14px}
.door .open{color:var(--accent);font-weight:500;margin-top:8px}
.door.shut{background:transparent;cursor:not-allowed;box-shadow:none}
.door.shut h3,.door.shut p,.door.shut .open{color:var(--faint)}
.doorwrap{position:relative;display:flex}
.soon{position:absolute;top:22px;right:22px;font-size:11.5px;color:var(--faint);background:var(--bone);border-radius:999px;padding:3px 11px}
.crumb{display:flex;align-items:center;gap:9px;padding:22px 0 6px;font-size:13.5px;color:var(--muted)}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;font-weight:700}
.ph .s{color:var(--muted);font-size:14px;margin-top:4px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:7px}
.stat .m{font-size:12px;color:var(--muted);margin-top:4px}
.stat.acc .v{color:var(--accent)} .stat.good .v{color:var(--good)}
.stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--crit)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.ptop{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ptop h2{font-size:15px;font-weight:600}
.pbody{padding:18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bone)}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px}
.c-good{background:var(--good-wash);color:var(--good)} .c-warn{background:var(--warn-wash);color:var(--warn)}
.c-crit{background:var(--crit-wash);color:var(--crit)} .c-mute{background:var(--bone);color:var(--faint)}
.c-acc{background:var(--accent-wash);color:var(--accent)}
.btn{background:var(--ink);color:var(--bone);border:0;border-radius:9px;padding:11px 18px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.87} .btn:disabled{opacity:.5;cursor:default}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.in{background:var(--bone);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.err{background:var(--crit-wash);color:var(--crit);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.loading{color:var(--faint);padding:26px 0;font-size:13.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="chrome">
  <div class="brand"><span class="dot"></span><span>Eurokids JMD</span></div>
  <div class="chromeR" id="chromeR"></div>
</div>
<div class="stage" id="stage"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Eurokids JMD — Hub
   The front door. Signs the user in once, then hands them to the
   app they are entitled to. Shares its auth storageKey with
   portal.html so one sign-in covers every page on this domain.

   What a person can see is decided by public.module_access, and
   enforced in Postgres by RLS — never here. This file only
   decides what to *draw*; the database decides what to *return*.
   ============================================================ */
const SUPABASE_URL = 'https://saqefzgnvznuurupqpsw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_u8v_dh1zMGdbrIQPMcxrFg_HCPJeUP9';

let sb = null, session = null, modules = [], profile = null;
let app = null, tab = 'overview';

function getSb(){
  if (sb) return sb;
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'eurokids-portal-auth' }
  });
  return sb;
}
const money = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const has = m => modules.includes(m);
const el = id => document.getElementById(id);

const TABS = {
  overview:   { label: 'Overview', need: () => has('admission') || has('finance') },
  children:   { label: 'Children', need: () => has('finance') },
  discounts:  { label: 'Discounts', need: () => has('finance') },
  kits:       { label: 'Kits',     need: () => has('kits') },
  fees:       { label: 'Fee Reference', need: () => has('fees') || has('finance') }
};

/* ── boot ─────────────────────────────────────────────── */
async function boot(){
  const { data } = await getSb().auth.getSession();
  session = data.session;
  if (session) await loadMe();
  paint();
  getSb().auth.onAuthStateChange(async (_e, s) => {
    const was = session?.user?.id;
    session = s;
    if (session && session.user.id !== was) { await loadMe(); }
    if (!session) { modules = []; profile = null; app = null; }
    paint();
  });
}

async function loadMe(){
  const s = getSb();
  const [{ data: mods }, { data: prof }] = await Promise.all([
    s.from('module_access').select('module').eq('user_id', session.user.id),
    s.from('profiles').select('role, full_name').eq('id', session.user.id).maybeSingle()
  ]);
  modules = (mods || []).map(r => r.module);
  profile = prof || null;
}

/* ── chrome ───────────────────────────────────────────── */
function paintChrome(){
  el('chromeR').innerHTML = session
    ? `<span>${esc(profile?.full_name || session.user.email)}</span><a id="out">Sign out</a>`
    : `<span>admin.eurokidsjmdenclave.org</span>`;
  const o = el('out');
  if (o) o.onclick = async () => { await getSb().auth.signOut(); };
}

function paint(){
  paintChrome();
  if (!session) return renderLogin();
  if (app === 'users') return renderUsers();
  if (!app)     return renderChooser();
  renderApp();
}

function isOwner(){
  return (session?.user?.email || '').toLowerCase() === 'abhinav@ganya.in';
}

/* ── sign in ──────────────────────────────────────────── */
function renderLogin(){
  el('stage').innerHTML = `
    <div class="chooser">
      <h1 class="hello">Sign in</h1>
      <p class="askline">Eurokids JMD Enclave</p>
      <div style="max-width:360px;margin-top:30px">
        <div id="loginErr"></div>
        <div class="fld"><label for="em">Email</label>
          <input class="in" id="em" type="email" autocomplete="username" placeholder="you@eurokidsjmdenclave.org"></div>
        <div class="fld"><label for="pw">Password</label>
          <input class="in" id="pw" type="password" autocomplete="current-password"></div>
        <button class="btn" id="go" style="width:100%">Sign in</button>
        <p class="hint" style="margin-top:14px">Teachers: go to
          <a href="/teacher" style="color:var(--accent)">/teacher</a> to apply for leave.</p>
      </div>
    </div>`;
  const go = el('go');
  const submit = async () => {
    const email = el('em').value.trim(), password = el('pw').value;
    if (!email || !password) return;
    go.disabled = true; go.textContent = 'Signing in…';
    const { error } = await getSb().auth.signInWithPassword({ email, password });
    if (error) {
      el('loginErr').innerHTML = `<div class="err">${esc(error.message)}</div>`;
      go.disabled = false; go.textContent = 'Sign in';
    }
  };
  go.onclick = submit;
  el('pw').onkeydown = e => { if (e.key === 'Enter') submit(); };
  el('em').onkeydown = e => { if (e.key === 'Enter') el('pw').focus(); };
}

/* ── chooser ──────────────────────────────────────────── */
function renderChooser(){
  const canAdmissions = has('admission') || has('finance') || has('kits');
  const canStaff      = has('staff_portal') || has('payroll');
  const doors = [
    { key:'admissions', name:'Admissions & Fees',
      desc:'Children, fees, payment schedules and kits.', ok:canAdmissions, href:null },
    { key:'staff', name:'Staff Portal',
      desc:'Leave, attendance and payroll.', ok:canStaff, href:'/staff' },
    { key:'pulse', name:'Site Pulse',
      desc:'Enquiries, conversions and centre performance.', ok:false, soon:true }
  ];
  if (isOwner()) doors.push({ key:'users', name:'Users & access',
    desc:'Create accounts for coordinators and HR; grant modules.', ok:true, href:null });
  el('stage').innerHTML = `
    <div class="chooser">
      <h1 class="hello">Hello</h1>
      <p class="askline">Where would you like to go?</p>
      <div class="deck">${doors.map(d => `
        <div class="doorwrap">
          <button class="door ${d.ok ? '' : 'shut'}" data-key="${d.key}" ${d.ok ? '' : 'disabled'}>
            <h3>${d.name}</h3><p>${d.desc}</p>
            <span class="open">${d.ok ? 'Open &rarr;' : (d.soon ? 'Not ready yet' : 'Not your access')}</span>
          </button>${d.soon ? '<span class="soon">soon</span>' : ''}
        </div>`).join('')}</div>
      ${(!canAdmissions && !canStaff) ? `<p class="hint" style="margin-top:26px">
        No modules are granted to this account yet. Ask the administrator to add them.</p>` : ''}
    </div>`;
  document.querySelectorAll('.door[data-key]').forEach(b => {
    b.onclick = () => {
      const d = doors.find(x => x.key === b.dataset.key);
      if (d.href) { location.href = d.href; return; }
      app = d.key;
      tab = Object.keys(TABS).find(t => TABS[t].need()) || 'overview';
      paint(); scrollTo({ top: 0 });
    };
  });
}

/* ── users & access (owner only) ─────────────────────── */
const ALL_MODULES = ['staff_portal','epms_admin','pulse','payroll','fees','kits','admission','finance'];
const MODULE_LABEL = { staff_portal:'Staff portal', epms_admin:'EPMS admin', pulse:'Site Pulse',
  payroll:'Payroll', fees:'Fees', kits:'Kits', admission:'Admission', finance:'Finance (money)' };

async function hubUsersApi(method, body){
  const { data: { session: s } } = await getSb().auth.getSession();
  const resp = await fetch('/api/admin/hub-users', {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${s.access_token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  return resp.json();
}

function modChecks(prefix, selected){
  return ALL_MODULES.map(m => `
    <label style="display:inline-flex;align-items:center;gap:6px;margin:3px 12px 3px 0;font-size:13px;${m==='finance'?'color:var(--crit);font-weight:600':''}">
      <input type="checkbox" class="${prefix}-mod" value="${m}" ${selected?.includes(m)?'checked':''}> ${MODULE_LABEL[m]}
    </label>`).join('');
}

async function renderUsers(){
  el('stage').innerHTML = `
    <div class="crumb"><button id="back">&larr; All apps</button><span>/</span><span>Users &amp; access</span></div>
    <div id="body"><div class="loading">Loading users…</div></div>`;
  el('back').onclick = () => { app = null; paint(); };

  const json = await hubUsersApi('GET');
  if (!json.ok) { el('body').innerHTML = `<div class="err">${esc(json.error||'Could not load')}</div>`; return; }

  const staffUsers = json.users.filter(u => !u.is_teacher);
  const teacherCount = json.users.length - staffUsers.length;

  el('body').innerHTML = `
    <div class="panel" style="padding:20px">
      <h3 style="margin-bottom:4px">Create an account</h3>
      <p class="hint" style="margin-bottom:14px">For coordinators, HR staff and yourself. Teachers are created in the Staff Portal → Employees, the same as always (${teacherCount} teacher account${teacherCount===1?'':'s'} exist there).</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:820px">
        <div class="fld"><label>Full name</label><input class="in" id="nu-name" placeholder="e.g. Sunita Saxena"></div>
        <div class="fld"><label>Email</label><input class="in" id="nu-email" type="email" placeholder="name@eurokidsjmdenclave.org"></div>
        <div class="fld"><label>Password (min 8)</label><input class="in" id="nu-pass" placeholder="They can't change it — pick well"></div>
      </div>
      <div style="margin:8px 0 14px"><div class="hint" style="margin-bottom:4px">Modules — tick what they may open. <span style="color:var(--crit)">Finance shows money; grant sparingly.</span></div>${modChecks('nu')}</div>
      <div id="nu-msg"></div>
      <button class="btn" id="nu-go">Create account</button>
    </div>

    <div class="panel" style="padding:0;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--line)">
          <th style="padding:12px 16px">Person</th><th style="padding:12px">Modules</th>
          <th style="padding:12px">Last sign-in</th><th style="padding:12px 16px"></th>
        </tr></thead>
        <tbody>${staffUsers.map(u => `
          <tr style="border-bottom:1px solid var(--line)" data-uid="${u.id}">
            <td style="padding:12px 16px"><strong>${esc(u.full_name||'—')}</strong><br><span class="hint">${esc(u.email)}</span></td>
            <td style="padding:12px;max-width:340px">${u.modules.length ? u.modules.map(m=>`<span style="display:inline-block;background:${m==='finance'?'var(--crit-wash)':'var(--good-wash)'};color:${m==='finance'?'var(--crit)':'var(--good)'};border-radius:99px;padding:1px 9px;margin:2px;font-size:11px">${MODULE_LABEL[m]||m}</span>`).join('') : '<span class="hint">none</span>'}</td>
            <td style="padding:12px" class="hint">${u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : 'never'}</td>
            <td style="padding:12px 16px;white-space:nowrap">
              <a style="color:var(--accent);cursor:pointer" onclick="editUserModules('${u.id}')">Modules</a> ·
              <a style="color:var(--accent);cursor:pointer" onclick="resetUserPassword('${u.id}','${esc(u.email)}')">Password</a>
              ${u.email==='abhinav@ganya.in'?'':` · <a style="color:var(--crit);cursor:pointer" onclick="deleteHubUser('${u.id}','${esc(u.email)}')">Remove</a>`}
            </td>
          </tr>
          <tr class="modrow" id="modrow-${u.id}" style="display:none;border-bottom:1px solid var(--line);background:var(--bone)">
            <td colspan="4" style="padding:12px 16px">
              ${modChecks('mm-'+u.id, u.modules)}
              <div style="margin-top:8px"><button class="btn" onclick="saveUserModules('${u.id}')">Save modules</button></div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  el('nu-go').onclick = async () => {
    const full_name = el('nu-name').value.trim(), email = el('nu-email').value.trim(), password = el('nu-pass').value;
    const modules = [...document.querySelectorAll('.nu-mod:checked')].map(c=>c.value);
    if (!full_name || !email || password.length < 8) { el('nu-msg').innerHTML = '<div class="err">Name, email, and a password of at least 8 characters are required.</div>'; return; }
    if (modules.includes('finance') && !confirm('Grant FINANCE? This person will see collections, dues and discounts. Continue?')) return;
    el('nu-go').disabled = true; el('nu-go').textContent = 'Creating…';
    const r = await hubUsersApi('POST', { action:'create', email, password, full_name, modules });
    if (r.ok) { renderUsers(); }
    else { el('nu-msg').innerHTML = `<div class="err">${esc(r.error||'Failed')}</div>`; el('nu-go').disabled = false; el('nu-go').textContent = 'Create account'; }
  };
}

function editUserModules(uid){
  const row = el('modrow-'+uid);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function saveUserModules(uid){
  const modules = [...document.querySelectorAll(`.mm-${CSS.escape(uid)}-mod:checked`)].map(c=>c.value);
  if (modules.includes('finance') && !confirm('Grant FINANCE to this account?')) return;
  const r = await hubUsersApi('POST', { action:'set_modules', user_id: uid, modules });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

async function resetUserPassword(uid, email){
  const pw = prompt(`New password for ${email} (min 8 chars):`);
  if (!pw) return;
  if (pw.length < 8) return alert('At least 8 characters.');
  const r = await hubUsersApi('POST', { action:'reset_password', user_id: uid, password: pw });
  if (r.ok) alert(`Done. Share it with them privately:\n\n${email}\n${pw}`); else alert(r.error||'Failed');
}

async function deleteHubUser(uid, email){
  if (!confirm(`Remove ${email}? Their sign-in stops working immediately.`)) return;
  const r = await hubUsersApi('POST', { action:'delete', user_id: uid });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

/* ── app shell ────────────────────────────────────────── */
function renderApp(){
  const avail = Object.keys(TABS).filter(t => TABS[t].need());
  if (!avail.includes(tab)) tab = avail[0];
  el('stage').innerHTML = `
    <div class="crumb"><button id="back">&larr; All apps</button><span>/</span><span>Admissions &amp; Fees</span></div>
    <div class="tabs">${avail.map(t =>
      `<button class="tab ${t === tab ? 'on' : ''}" data-tab="${t}">${TABS[t].label}</button>`).join('')}</div>
    <div id="body"><div class="loading">Loading…</div></div>`;
  el('back').onclick = () => { app = null; paint(); };
  document.querySelectorAll('.tab[data-tab]').forEach(b =>
    b.onclick = () => { tab = b.dataset.tab; renderApp(); });
  ({ overview: tabOverview, children: tabChildren, discounts: tabDiscounts,
     kits: tabKits, fees: tabFees }[tab] || tabOverview)();
}

function head(t, s, right){
  return `<div class="ph"><div><h1>${t}</h1><div class="s">${s}</div></div><div>${right || ''}</div></div>`;
}
function fail(e){
  return `<div class="err">Could not load: ${esc(e?.message || e)}</div>`;
}

/* ── overview: position for the owner, worklist for everyone else ── */
async function tabOverview(){
  const s = getSb();
  if (has('finance')) {
    const [{ data: sum, error: e1 }, { data: due, error: e2 }] = await Promise.all([
      s.schema('eurokids').from('v_live_summary').select('*').maybeSingle(),
      s.schema('eurokids').from('v_dues').select('student_name,uin,program_name,term1_due,term2_due,true_due')
         .gt('true_due', 0).order('true_due', { ascending: false }).limit(10)
    ]);
    if (e1 || e2) return el('body').innerHTML = fail(e1 || e2);
    if (!sum)     return el('body').innerHTML = `<div class="err">No finance access.</div>`;
    el('body').innerHTML = head('Overview', 'Live from EPMS, corrected for status and discount.',
        `<button class="btn line sm" id="sync">Sync live data</button>`)
      + `<div class="stats">
        <div class="stat acc"><div class="k">Active students</div><div class="v">${sum.students_active}</div>
          <div class="m">${sum.students_in_epms} in EPMS − ${sum.students_quit} quit − ${sum.students_transferred_out} transferred</div></div>
        <div class="stat crit"><div class="k">Total pending</div><div class="v">${money(sum.true_pending_total)}</div>
          <div class="m">${sum.children_owing} children owe</div></div>
        <div class="stat warn"><div class="k">Term 1 due</div><div class="v">${money(sum.term1_due_total)}</div>
          <div class="m">Due before admission</div></div>
        <div class="stat"><div class="k">Term 2 due</div><div class="v">${money(sum.term2_due_total)}</div>
          <div class="m">The bulk of the balance</div></div>
        <div class="stat good"><div class="k">Collected</div><div class="v">${money(sum.collected_total)}</div>
          <div class="m">Royalty ${money(sum.royalty_accrued)} at 20%</div></div></div>
      <div class="panel"><div class="ptop"><h2>Biggest balances</h2>
        <span class="hint">${Number(sum.our_discounts_total) > 0
          ? money(sum.our_discounts_total) + ' of our own discount applied'
          : 'No discounts of ours entered yet — totals are EPMS figures'}</span></div>
       <div class="tw"><table><thead><tr><th>Child</th><th>UIN</th><th>Program</th>
         <th class="r">Term 1</th><th class="r">Term 2</th><th class="r">Truly due</th></tr></thead><tbody>
         ${(due || []).map(r => `<tr><td>${esc(r.student_name)}</td>
           <td class="num" style="color:var(--muted)">${esc(r.uin)}</td><td>${esc(r.program_name)}</td>
           <td class="r num">${r.term1_due > 0 ? money(r.term1_due) : '—'}</td>
           <td class="r num">${money(r.term2_due)}</td>
           <td class="r num" style="font-weight:600">${money(r.true_due)}</td></tr>`).join('')}
       </tbody></table></div></div>`;
    const b = el('sync');
    if (b) b.onclick = () => {
      b.disabled = true; b.textContent = 'Needs EPMS secrets';
      setTimeout(() => { b.disabled = false; b.textContent = 'Sync live data'; }, 2200);
    };
    return;
  }

  // No finance grant: a worklist. No roster count, no sums, nothing to multiply.
  const { data, error } = await s.schema('eurokids').from('v_action_items')
    .select('uin,student_name,father_name,program_name,action,priority,amount_to_collect');
  if (error) return el('body').innerHTML = fail(error);
  el('body').innerHTML = head("Today's list", 'The parents to follow up with.')
    + `<div class="panel"><div class="ptop"><h2>Fees to follow up</h2>
        <span class="hint">Term 1 first, then the largest balances</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Father</th><th>Program</th>
        <th>What is owed</th><th class="r">Amount</th><th></th></tr></thead><tbody>
        ${(data || []).map(r => `<tr><td>${esc(r.student_name)}</td>
          <td style="color:var(--muted)">${esc(r.father_name || '—')}</td><td>${esc(r.program_name)}</td>
          <td><span class="chip ${r.priority === 'urgent' ? 'c-crit' : 'c-warn'}">${esc(r.action)}</span></td>
          <td class="r num">${money(r.amount_to_collect)}</td>
          <td><button class="btn line sm logcall">Log a call</button></td></tr>`).join('')}
      </tbody></table></div></div>`;
  document.querySelectorAll('.logcall').forEach(b =>
    b.onclick = () => { b.textContent = 'Logged'; b.disabled = true; });
}

/* ── children ─────────────────────────────────────────── */
async function tabChildren(){
  const { data, error } = await getSb().schema('eurokids').from('v_dues')
    .select('student_name,father_name,program_name,eurokids_discount,our_discount,total_collected,epms_due,true_due,payment_status')
    .order('true_due', { ascending: false }).limit(60);
  if (error) return el('body').innerHTML = fail(error);
  el('body').innerHTML = head('Children', 'Active roster. Quit and Transfer Out are excluded everywhere.')
    + `<div class="panel"><div class="ptop"><h2>Active roster</h2>
        <span class="chip c-mute">Showing ${(data || []).length}</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Father</th><th>Program</th><th>EuroKids discount</th>
        <th class="r">Ours</th><th class="r">Collected</th><th class="r">Truly due</th><th>Status</th></tr></thead><tbody>
        ${(data || []).map(r => `<tr><td>${esc(r.student_name)}</td>
          <td style="color:var(--muted)">${esc(r.father_name || '—')}</td><td>${esc(r.program_name)}</td>
          <td>${esc(r.eurokids_discount || '—')}</td>
          <td class="r num">${Number(r.our_discount) ? money(r.our_discount) : '—'}</td>
          <td class="r num">${money(r.total_collected)}</td>
          <td class="r num" style="font-weight:600">${money(r.true_due)}</td>
          <td><span class="chip ${r.true_due <= 0 ? 'c-good' : r.total_collected > 0 ? 'c-warn' : 'c-crit'}">
            ${r.true_due <= 0 ? 'Paid' : r.total_collected > 0 ? 'Partial' : 'Nothing paid'}</span></td></tr>`).join('')}
      </tbody></table></div></div>`;
}

/* ── discounts: where the phantom dues get corrected ──── */
async function tabDiscounts(){
  const s = getSb();
  const [{ data: rows, error }, { data: existing }] = await Promise.all([
    s.schema('eurokids').from('v_dues').select('uin,student_name,program_name,epms_due,our_discount,true_due')
      .order('student_name').limit(200),
    s.schema('eurokids').from('child_discount').select('uin,amount_rupees,reason')
  ]);
  if (error) return el('body').innerHTML = fail(error);
  const byUin = Object.fromEntries((existing || []).map(r => [r.uin, r]));
  el('body').innerHTML = head('Discounts', 'Money you took off your own margin. EPMS never sees these, so it keeps showing them as due.')
    + `<div class="panel"><div class="ptop"><h2>Per-child discount</h2>
        <span class="hint">Type an amount and press Enter. Everything recalculates.</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th>
        <th class="r">EPMS says due</th><th style="width:150px">Our discount</th>
        <th class="r">Truly due</th><th>Reason</th></tr></thead><tbody>
        ${(rows || []).map(r => `<tr data-uin="${esc(r.uin)}">
          <td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
          <td class="r num" style="color:var(--faint)">${money(r.epms_due)}</td>
          <td><input class="in num disc" type="number" min="0" value="${Number(r.our_discount) || ''}" placeholder="0"></td>
          <td class="r num truedue" style="font-weight:600">${money(r.true_due)}</td>
          <td><input class="in reason" value="${esc(byUin[r.uin]?.reason || '')}" placeholder="optional"></td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  document.querySelectorAll('tr[data-uin]').forEach(tr => {
    const uin = tr.dataset.uin;
    const amt = tr.querySelector('.disc'), reason = tr.querySelector('.reason');
    const save = async () => {
      const v = Number(amt.value) || 0;
      const { error } = await getSb().schema('eurokids').from('child_discount')
        .upsert({ uin, amount_rupees: v, reason: reason.value || null }, { onConflict: 'uin' });
      amt.style.borderColor = error ? 'var(--crit)' : 'var(--good)';
      if (!error) { tab = 'discounts'; setTimeout(() => renderApp(), 350); }
    };
    amt.onkeydown = e => { if (e.key === 'Enter') save(); };
    amt.onblur = save;
    reason.onkeydown = e => { if (e.key === 'Enter') save(); };
  });
}

/* ── kits: eligibility, never amounts ─────────────────── */
async function tabKits(){
  const { data, error } = await getSb().schema('eurokids').from('v_kit_worklist')
    .select('uin,student_name,program_name,paid_enough_for_kit,dispatched_on,lr_number,handed_over_on,state')
    .order('state');
  if (error) return el('body').innerHTML = fail(error);
  const label = { handed_over:['c-good','Handed over'], ready_to_hand_over:['c-warn','Ready to hand over'],
                  awaiting_dispatch:['c-mute','Awaiting dispatch'], payment_short:['c-crit','Payment short'] };
  const ready = (data || []).filter(r => r.state === 'ready_to_hand_over').length;
  el('body').innerHTML = head('Kits', 'EPMS knows the kit was dispatched. Only we know it reached the parent.')
    + `<div class="panel"><div class="ptop"><h2>Handover worklist</h2>
        <span class="chip ${ready ? 'c-warn' : 'c-mute'}">${ready} ready</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th><th>Consignment</th>
        <th>Dispatched</th><th>State</th></tr></thead><tbody>
        ${(data || []).slice(0, 60).map(r => {
          const [cls, txt] = label[r.state] || ['c-mute', r.state];
          return `<tr><td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
            <td class="num" style="color:var(--muted)">${esc(r.lr_number || '—')}</td>
            <td>${esc(r.dispatched_on || '—')}</td>
            <td><span class="chip ${cls}">${txt}</span></td></tr>`;
        }).join('')}
      </tbody></table></div></div>`;
}

/* ── fee reference ────────────────────────────────────── */
async function tabFees(){
  const { data, error } = await getSb().schema('eurokids').from('fee_grid')
    .select('epms_program_id,joining_month,discount_code,total_fee')
    .eq('discount_code', 'none').order('epms_program_id').order('joining_month');
  if (error) return el('body').innerHTML = fail(error);
  const PROG = { 24:'Play Group', 25:'Nursery', 26:'Euro Junior', 27:'Euro Senior' };
  const months = [...new Set((data || []).map(r => r.joining_month))];
  const grid = {};
  (data || []).forEach(r => { (grid[r.epms_program_id] ||= {})[r.joining_month] = r.total_fee; });
  const fmt = m => new Date(m + 'T00:00:00').toLocaleDateString('en-GB', { month:'short', year:'2-digit' });
  el('body').innerHTML = head('Fee Reference', 'All 288 combinations, read out of the EPMS Fee Calculator.')
    + `<div class="panel"><div class="ptop"><h2>Full-year fee by joining month</h2>
        <span class="chip c-good">exact, not modelled</span></div>
      <div class="tw"><table><thead><tr><th>Program</th>
        ${months.map(m => `<th class="r">${fmt(m)}</th>`).join('')}</tr></thead><tbody>
        ${Object.keys(grid).map(p => `<tr><td style="font-weight:500">${PROG[p] || p}</td>
          ${months.map(m => `<td class="r num">${Number(grid[p][m]).toLocaleString('en-IN')}</td>`).join('')}
        </tr>`).join('')}
      </tbody></table></div>
      <div class="pbody hint">No discount applied. The fee steps down in six bands because Term 2 falls away
        from October and tuition pro-rates after that.</div></div>`;
}

boot();
</script>
</body>
</html>

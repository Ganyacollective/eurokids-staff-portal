   What a person can see is decided by public.module_access, and

   decides what to *draw*; the database decides what to *return*.

const SUPABASE_URL = 'https://saqefzgnvznuurupqpsw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_u8v_dh1zMGdbrIQPMcxrFg_HCPJeUP9';

let sb = null, session = null, modules = [], profile = null;
let app = null, tab = 'overview', _loadMeFailed = false;

function getSb(){
  if (sb) return sb;
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'eurokids-portal-auth' }
  });
  return sb;
}
const money = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');

// Building an Intl formatter is expensive; doing it per row of a 2000-row table
// is most of the cost of drawing that table. Build each one once.
const _DF = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', timeZone:'UTC' });
const _DFY = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
const shortDate = d => d ? _DFY.format(new Date(d + 'T00:00:00Z')) : '—';
const longDate  = d => d ? _DFY.format(new Date(d + 'T00:00:00Z')) : '—';

// Typing in a search box should filter, not fire a render per keystroke.
function debounce(fn, ms = 160){
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// Tab payloads are reused for a short window, so bouncing between tabs stops
// re-issuing the same queries. Any write clears the cache for correctness.
const _cache = new Map();
const CACHE_TTL = 45000;
async function cached(key, loader){
  const hit = _cache.get(key);
  if (hit && Date.now() - hit.at < CACHE_TTL) return hit.val;
  const val = await loader();
  _cache.set(key, { at: Date.now(), val });
  return val;
}
const invalidate = (prefix) => {
  if (!prefix) return _cache.clear();
  [..._cache.keys()].filter(k => k.startsWith(prefix)).forEach(k => _cache.delete(k));
};
// Also escapes quotes: esc() is used inside double-quoted HTML attributes, so a
// child or parent name containing " would otherwise break out of the attribute.
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const has = m => modules.includes(m);
const el = id => document.getElementById(id);

const TABBAR = ['overview', 'children', 'views', 'plans'];

/* ── boot ─────────────────────────────────────────────── */
async function boot(){
 try {
  // Home-screen shortcuts land here with ?open=liability / ?open=compose.
  const want = new URLSearchParams(location.search).get('open');
  if (want && TABS[want]) { app = 'admissions'; tab = want; }
  const { data } = await getSb().auth.getSession();
  session = data.session;
  if (session) await loadMe();
  paint();
  // Supabase fires this on TOKEN_REFRESHED too, which happens every time the
  // tab regains focus after being in the background. Repainting on that wiped
  // whatever the user was in the middle of. Only react when the identity
  // genuinely changes — a signed-in user is still the same user after their
  // token quietly renews.
 } catch (e) {
    el('stage').innerHTML = `<div class="err" style="margin:40px auto;max-width:520px">
      Could not start the app: ${esc(e.message)}
      <div style="margin-top:10px"><button class="btn sm" onclick="location.reload()">Try again</button></div></div>`;
    return;
 }

  getSb().auth.onAuthStateChange(async (event, s) => {
    const was = session?.user?.id;
    session = s;
    const now = s?.user?.id;
    if (was === now) return;                       // token refresh, nothing to redraw
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
    if (now) await loadMe();
    else { modules = []; profile = null; app = null; }
    paint();
  });
}

async function loadMe(){
  const s = getSb();
  const [{ data: mods, error: modErr }, { data: prof }] = await Promise.all([
    s.from('module_access').select('module').eq('user_id', session.user.id),
    s.from('profiles').select('role, full_name').eq('id', session.user.id).maybeSingle()
  ]);
  // A network blip used to render as "no modules granted", sending the owner to
  // an administrator to fix a problem that did not exist.
  _loadMeFailed = !!modErr;
  modules = (mods || []).map(r => r.module);
  profile = prof || null;
}

function paint(){
  if (!session) return renderLogin();
  if (app === 'users') { app = 'admissions'; tab = 'users'; }   // old home-screen links
  if (!app)     return renderChooser();
  renderApp();
}

function isOwner(){
  return (session?.user?.email || '').toLowerCase() === 'abhinav@ganya.in';
}

function renderLogin(){
  el('stage').innerHTML = `

      <div class="sb-brand" style="padding-bottom:18px"><span class="dot"></span><span>EuroKids JMD Enclave</span></div>
      <div class="card">
        <h1 class="t-t2" style="margin-bottom:14px">Sign In</h1>
        <div id="loginErr"></div>
        <div class="fld"><label for="em">Email</label>
          <input class="in" id="em" type="email" autocomplete="username" placeholder="you@eurokidsjmdenclave.org"></div>
        <div class="fld"><label for="pw">Password</label>
          <input class="in" id="pw" type="password" autocomplete="current-password"></div>
        <button class="btn lg" id="go" style="width:100%;margin-top:4px">Sign In</button>
      </div>
      <p class="hint" style="margin-top:16px">Teachers: go to <a href="/teacher">/teacher</a> to apply for leave.</p>
    </div>`;
  const go = el('go');
  const submit = async () => {
    const email = el('em').value.trim(), password = el('pw').value;
    if (!email || !password) return;
    go.disabled = true; go.textContent = 'Signing in…';
    const { error } = await getSb().auth.signInWithPassword({ email, password });
    if (error) {
      el('loginErr').innerHTML = `<div class="err">${esc(error.message)}</div>`;
      go.disabled = false; go.textContent = 'Sign In';
    }
  };
  go.onclick = submit;
  el('pw').onkeydown = e => { if (e.key === 'Enter') submit(); };
  el('em').onkeydown = e => { if (e.key === 'Enter') el('pw').focus(); };
}

/* ── users & access (owner only) ─────────────────────── */
const ALL_MODULES = ['staff_portal','epms_admin','pulse','payroll','fees','kits','admission','finance'];
const MODULE_LABEL = { staff_portal:'Staff portal', epms_admin:'EPMS admin', pulse:'Site Pulse',
  payroll:'Payroll', fees:'Fees', kits:'Kits', admission:'Admission', finance:'Finance (money)' };

async function hubUsersApi(method, body){
  const { data: { session: s } } = await getSb().auth.getSession();
  const resp = await fetch('/api/admin/hub-users', {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${s.access_token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  return resp.json();
}

// Module grants as a grouped list of switches — one row per module, the
// dangerous one (Finance) explained in its own footnote.
function modRows(prefix, selected){
  return ALL_MODULES.map(m => `
    <label class="row" style="cursor:pointer"><span class="l">${MODULE_LABEL[m]}${m==='finance' ? '<span class="sub">Shows school-wide money. Coordinators normally need Admission + EPMS admin only.</span>' : ''}</span>
      <input type="checkbox" class="sw ${prefix}-mod" value="${m}" ${selected?.includes(m)?'checked':''}></label>`).join('');
}

              <div class="menu">
                <button onclick="editUserModules('${u.id}')">Edit Access…</button>
                <button onclick="resetUserPassword('${u.id}','${esc(u.email)}')">Reset Password…</button>
                ${u.email==='abhinav@ganya.in'?'':`<div class="msep"></div><button style="color:var(--red)" onclick="deleteHubUser('${u.id}','${esc(u.email)}')">Remove Account…</button>`}
              </div></div></td>
          </tr>
          <tr class="modrow" id="modrow-${u.id}" style="display:none">
            <td colspan="4" class="user-edit" style="white-space:normal">
              <div class="box" style="max-width:520px">${modRows('mm-'+u.id, u.modules)}</div>
              <div style="margin-top:12px;display:flex;gap:8px"><button class="btn sm" onclick="saveUserModules('${u.id}')">Save</button>
                <button class="btn line sm" onclick="el('modrow-${u.id}').style.display='none'">Cancel</button></div>
            </td>
          </tr>`).join('')}
        </tbody></table></div>
      <div class="pbody hint">Teachers are created in the Staff Portal → Employees, as always (${teacherCount} teacher account${teacherCount===1?'':'s'} exist there).</div></div>`;
  if (!window._umenu) { window._umenu = true; document.addEventListener('click', () => document.querySelectorAll('#users-table .menu.open').forEach(m => m.classList.remove('open'))); }

  // Creating an account is a scoped task, so it opens as a sheet.
  el('nu-open').onclick = () => {
    const body = openDrawer('New Account', 'For coordinators, HR staff and yourself.');
    body.innerHTML = `
      <div class="grp"><h3>Person</h3><div class="box">
        <div class="row"><div class="l">Full name</div><input class="in wide" id="nu-name" placeholder="e.g. Sunita Saxena"></div>
        <div class="row"><div class="l">Email</div><input class="in wide" id="nu-email" type="email" placeholder="name@eurokidsjmdenclave.org"></div>

      <div class="grp"><h3>May open</h3><div class="box">${modRows('nu')}</div></div>`;

function editUserModules(uid){
  const row = el('modrow-'+uid);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function saveUserModules(uid){
  const modules = [...document.querySelectorAll(`.mm-${CSS.escape(uid)}-mod:checked`)].map(c=>c.value);
  if (modules.includes('finance') && !confirm('Grant FINANCE to this account?')) return;
  const r = await hubUsersApi('POST', { action:'set_modules', user_id: uid, modules });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

async function resetUserPassword(uid, email){
  const pw = prompt(`New password for ${email} (min 8 chars):`);
  if (!pw) return;
  if (pw.length < 8) return alert('At least 8 characters.');
  const r = await hubUsersApi('POST', { action:'reset_password', user_id: uid, password: pw });
  if (r.ok) alert(`Done. Share it with them privately:\n\n${email}\n${pw}`); else alert(r.error||'Failed');
}

async function deleteHubUser(uid, email){
  if (!confirm(`Remove ${email}? Their sign-in stops working immediately.`)) return;
  const r = await hubUsersApi('POST', { action:'delete', user_id: uid });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

/* ── app shell ────────────────────────────────────────── */
// NavigationSplitView: the sidebar is built once and only re-marked when the
// tab changes; the detail pane is what each tab function paints into.
function renderApp(){

/* ── views: stack conditions like a Coda filter, save them, act on them ──
   Everything evaluates in the browser against the live roster, so a view is
   instant and can be tweaked while you look at it. A saved view is shared
   with everyone who can see fees.                                            */
const VIEW_FIELDS = [
  { k:'student_name',  l:'Child',                     t:'text' },
  { k:'program_name',  l:'Class',                     t:'enum' },
  { k:'batch',         l:'Batch',                     t:'enum' },
  { k:'schedule_flag', l:'Status',                    t:'enum' },
  { k:'agreed_fee',    l:'Agreed fee',                t:'num' },
  { k:'our_discount',  l:'Our discount',              t:'num' },
  { k:'term1_due',     l:'Term 1 due (EPMS)',         t:'num' },
  { k:'term2_due',     l:'Term 2 due (EPMS)',         t:'num' },
  { k:'epms_due',      l:'EPMS total due',            t:'num' },
  { k:'true_due',      l:'Truly due',                 t:'num' },
  { k:'collected',     l:'Collected by EPMS',         t:'num' },
  { k:'uncredited_cash', l:'Cash with us, not posted', t:'num' },
  { k:'paid_so_far',   l:'Paid so far',               t:'num' },
  { k:'next_amount',   l:'Next instalment amount',    t:'num' },
  { k:'next_due_date', l:'Next due date',             t:'date' },
  { k:'admission_date',l:'Admitted on',               t:'date' },
  { k:'days_overdue',  l:'Days overdue',              t:'num' },
  { k:'instalments',   l:'No. of instalments',        t:'num' },
  { k:'has_schedule',  l:'Has a schedule',            t:'bool' },
  { k:'schedule_mismatch', l:'Schedule does not add up', t:'bool' },
  { k:'welcome_sent_at', l:'Welcome letter sent',     t:'exists' },
  { k:'parent_email1', l:'Has parent email',          t:'exists' },
  { k:'eurokids_discount', l:'EuroKids discount label', t:'text' },
  { k:'father_name',   l:'Father',                    t:'text' },
];
const OPS = {
  num:   [['=','is equal to'],['!=','is not equal to'],['<','is less than'],['<=','is at most'],['>','is greater than'],['>=','is at least'],['between','is between']],
  date:  [['=','is on'],['<','is before'],['>','is after'],['between','is between'],['empty','is blank'],['notempty','is not blank']],
  text:  [['contains','contains'],['=','is equal to'],['!=','is not equal to'],['startswith','starts with'],['empty','is blank'],['notempty','is not blank']],
  enum:  [['=','is equal to'],['!=','is not equal to']],
  bool:  [['true','is equal to'],['false','is equal to']],
  exists:[['notempty','is not blank'],['empty','is blank']],
};
const FIELD_ICON = { num:'₹', date:'📅', text:'T', enum:'≡', bool:'☑', exists:'☑' };
let _views = { rows:[], list:[], conds:[], sort:{ field:'student_name', dir:'asc' }, current:null };

function evalCond(r, c){
  const f = VIEW_FIELDS.find(x => x.k === c.field); if (!f) return true;
  const raw = r[c.field];
  const isEmpty = raw == null || raw === '' || raw === false;
  switch (c.op) {
    case 'empty':     return isEmpty;
    case 'notempty':  return !isEmpty;
    case 'true':      return raw === true;
    case 'false':     return !raw;
  }
  if (f.t === 'num') {
    const v = Number(raw || 0), a = Number(c.value), b = Number(c.value2);
    switch (c.op) {
      case '=': return v === a; case '!=': return v !== a;
      case '<': return v < a;   case '<=': return v <= a;
      case '>': return v > a;   case '>=': return v >= a;
      case 'between': return v >= Math.min(a,b) && v <= Math.max(a,b);
    }
  }
  if (f.t === 'date') {
    const v = String(raw || ''), a = String(c.value || ''), b = String(c.value2 || '');
    if (!v) return false;
    switch (c.op) {
      case '=': return v === a; case '<': return v < a; case '>': return v > a;
      case 'between': return v >= a && v <= b;
    }
  }
  const v = String(raw ?? '').toLowerCase(), a = String(c.value ?? '').toLowerCase();
  switch (c.op) {
    case '=': return v === a; case '!=': return v !== a;
    case 'contains': return v.includes(a); case 'startswith': return v.startsWith(a);
  }
  return true;
}
const describeCond = c => {
  const f = VIEW_FIELDS.find(x => x.k === c.field); if (!f) return '';
  const op = (OPS[f.t] || []).find(o => o[0] === c.op)?.[1] || c.op;
  const fmt = v => f.t === 'num' ? money(v) : f.t === 'date' ? longDate(v) : v;
  const val = ['empty','notempty','true','false'].includes(c.op) ? ''
    : c.op === 'between' ? ` ${fmt(c.value)} and ${fmt(c.value2)}` : ` ${fmt(c.value)}`;
  return `${f.l} ${op}${val}`;
};

// Coda-style filter panel: one card per filter, a control that fits the
// field's type, a searchable list to add another. Live count at the top.
function openFilterPanel(){
  const dr = el('drawer'); const body = openDrawer('Filter', ''); dr.classList.add('narrow');

    const total = _views.rows.length, shown = (_views.lastRows || []).length;
    el('drawer-sub').textContent = `${shown} of ${total} children`;
    const cards = _views.conds.map((c, i) => {
      const f = VIEW_FIELDS.find(x => x.k === c.field) || VIEW_FIELDS[0];
      const ops = OPS[f.t]; if (!ops.some(o => o[0] === c.op)) c.op = ops[0][0];
      const opLabel = ops.find(o => o[0] === c.op)?.[1] || c.op;
      let ctl = '';
      if (f.t === 'bool' || f.t === 'exists') {
        const yes = f.t === 'bool' ? 'true' : 'notempty', no = f.t === 'bool' ? 'false' : 'empty';
        ctl = `<div class="seg"><button data-i="${i}" data-op="${yes}" class="${c.op===yes?'on':''}">✓ Yes</button><button data-i="${i}" data-op="${no}" class="${c.op===no?'on':''}">— No</button></div>`;
      } else if (!['empty','notempty'].includes(c.op)) {
        if (f.t === 'enum') ctl = `<select class="in fval" data-i="${i}" style="margin-top:8px"><option value="">Select…</option>${enumVals(f.k).map(v => `<option ${String(c.value)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
        else ctl = `<input class="in fval" data-i="${i}" type="${f.t==='num'?'number':f.t==='date'?'date':'text'}" value="${esc(c.value ?? '')}" placeholder="${f.t==='num'?'Amount':'Value'}" style="margin-top:8px">`
             + (c.op === 'between' ? `<div class="hint" style="margin:6px 0 0">and</div><input class="in fval2" data-i="${i}" type="${f.t==='num'?'number':'date'}" value="${esc(c.value2 ?? '')}">` : '');
      }
      const opSel = (f.t === 'bool' || f.t === 'exists') ? '' :
        `<select class="fop fopsel" data-i="${i}">${ops.map(o => `<option value="${o[0]}" ${o[0]===c.op?'selected':''}>${o[1]}</option>`).join('')}</select>`;
      return `${i ? '<div class="fand">And</div>' : ''}
        <div class="fcard"><div class="fhead"><div><div class="fname">${esc(f.l)}</div>${opSel}</div>
          <button class="fdel" data-i="${i}" title="Remove">🗑</button></div>${ctl}</div>`;
    }).join('');
    body.innerHTML = `${cards || '<div class="hint" style="margin-top:12px">No filters — showing everyone.</div>'}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
        <button class="btn line sm" id="fadd">+ Add filter</button>
        ${_views.conds.length ? '<a href="#" id="fclear" class="hint">Remove all</a>' : ''}</div>
      <div id="fpick" style="display:none"><input class="in" id="fsearch" placeholder="Search fields…" style="margin-top:8px"><div class="flist" id="flistbox"></div></div>`;
    const sync = () => { run(); paint(); };
    body.querySelectorAll('.seg button').forEach(b => b.onclick = () => { _views.conds[+b.dataset.i].op = b.dataset.op; sync(); });
    body.querySelectorAll('.fopsel').forEach(e => e.onchange = () => { _views.conds[+e.dataset.i].op = e.value; sync(); });
    const live = () => { run(); el('drawer-sub').textContent = `${(_views.lastRows||[]).length} of ${_views.rows.length} children`; };
    body.querySelectorAll('.fval').forEach(e => { const h = () => { _views.conds[+e.dataset.i].value = e.value; live(); }; e.onchange = h; if (e.tagName === 'INPUT') e.oninput = debounce(h, 200); });
    body.querySelectorAll('.fval2').forEach(e => e.oninput = debounce(() => { _views.conds[+e.dataset.i].value2 = e.value; live(); }, 200));
    body.querySelectorAll('.fdel').forEach(b => b.onclick = () => { _views.conds.splice(+b.dataset.i, 1); sync(); });
    const fc = el('fclear'); if (fc) fc.onclick = ev => { ev.preventDefault(); _views.conds = []; sync(); };
    el('fadd').onclick = () => {
      el('fpick').style.display = ''; el('fsearch').focus();
      const list = q => el('flistbox').innerHTML = VIEW_FIELDS.filter(f => !q || f.l.toLowerCase().includes(q)).map(f =>
        `<button data-k="${f.k}"><span class="ic">${FIELD_ICON[f.t]||'·'}</span>${esc(f.l)}</button>`).join('');

      el('fsearch').oninput = () => list(el('fsearch').value.trim().toLowerCase());
      el('flistbox').onclick = ev => { const b = ev.target.closest('button'); if (!b) return;

        _views.conds.push({ field: f.k, op: OPS[f.t][0][0], value: f.t === 'num' ? 0 : '' }); sync(); };
    };
  };
  paint();
}

    if (!v) return loadQuick(0);
    _views.current = v;
    _views.conds = JSON.parse(JSON.stringify(v.conditions || []));
    _views.sort = { field: v.sort_field || 'student_name', dir: v.sort_dir || 'asc' };
    setBase(); drawSide(); run();
  };

  // ── the "you changed this" bar: save to the view, save as a new one, or put it back
  const drawDirty = () => {
    const box = el('vw-dirty');
    if (!isDirty()) { box.style.display = 'none'; return; }
    box.style.display = '';
    box.innerHTML = `<span>Edited</span><span class="sp"></span>
      ${_views.current ? `<a id="vw-save">Save to “${esc(_views.current.name)}”</a>` : ''}
      <a id="vw-saveas">Save as new view…</a><a id="vw-revert">Revert</a>`;
    const sv = el('vw-save'); if (sv) sv.onclick = async () => {
      const rec = { conditions: _views.conds, sort_field: _views.sort.field, sort_dir: _views.sort.dir, updated_at: new Date().toISOString() };
      const { data, error: e2 } = await s.schema('eurokids').from('saved_view').update(rec).eq('id', _views.current.id).select().maybeSingle();
      if (e2) return alert('Could not save: ' + e2.message);
      await refreshList(); loadView(data);
    };
    el('vw-saveas').onclick = () => el('vw-new').click();
    el('vw-revert').onclick = () => _views.current ? loadView(_views.current) : loadQuick(quickIdx);
  };

  // ── sort menu: pick a field; pick it again to flip the direction
  const drawSort = () => {
    el('vw-sortmenu').innerHTML = SORTS.map(([k, l]) => {
      const on = _views.sort.field === k;
      return `<button data-k="${k}"><span class="chk">${on ? '✓' : ''}</span>${l}${on ? `<span class="sub" style="margin-left:auto;color:var(--label2)">${_views.sort.dir === 'asc' ? '↑' : '↓'}</span>` : ''}</button>`;
    }).join('');
    el('vw-sortmenu').querySelectorAll('button').forEach(x => x.onclick = () => {
      if (_views.sort.field === x.dataset.k) _views.sort.dir = _views.sort.dir === 'asc' ? 'desc' : 'asc';
      else _views.sort = { field: x.dataset.k, dir: x.dataset.k === 'true_due' || x.dataset.k === 'days_overdue' || x.dataset.k === 'term2_due' ? 'desc' : 'asc' };
      run();
    });
  };
  const wireMenu = (btnId, menuId) => {
    el(btnId).onclick = e => { e.stopPropagation(); document.querySelectorAll('.menu.open').forEach(m => m !== el(menuId) && m.classList.remove('open')); el(menuId).classList.toggle('open'); };
    el(menuId).onclick = e => { e.stopPropagation(); if (e.target.closest('button')) el(menuId).classList.remove('open'); };
  };
  wireMenu('vw-sortbtn', 'vw-sortmenu'); wireMenu('vw-morebtn', 'vw-moremenu');
  if (!window._vwMenuBound) { window._vwMenuBound = true;
    document.addEventListener('click', () => document.querySelectorAll('#vw-sortmenu.open,#vw-moremenu.open').forEach(m => m.classList.remove('open'))); }

  // ── evaluate + draw
  const matched = () => {
    let rows = _views.rows.filter(r => _views.conds.every(c => evalCond(r, c)));
    const { field, dir } = _views.sort;
    const f = VIEW_FIELDS.find(x => x.k === field);
    rows.sort((a, b) => {
      let x = a[field], y = b[field];
      if (f?.t === 'num') { x = Number(x||0); y = Number(y||0); }
      else { x = String(x ?? ''); y = String(y ?? ''); }
      return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1);
    });
    return rows;
  };
  const viewName = () => _views.current ? _views.current.name : QUICK[quickIdx][0];
  run = () => {
    const rows = matched();
    _views.lastRows = rows;
    el('vw-title').textContent = viewName();
    el('vw-fcount').textContent = _views.conds.length ? String(_views.conds.length) : '';
    // the sidebar's own list already says what it is; only spell out edits
    el('vw-fdesc').textContent = (isDirty() || (_views.current && _views.conds.length))
      ? (_views.conds.length ? 'Where ' + _views.conds.map(describeCond).join(', and ') : 'No filters — everyone') : '';
    const owed = rows.reduce((a, r) => a + Number(r.true_due||0), 0);
    el('vw-meta').textContent = `${rows.length} ${rows.length===1?'child':'children'}` +
      (has('finance') && owed > 0 ? ` · ${money(owed)} still due` : '');
    drawDirty(); drawSort();
    el('vw-rename').style.display = el('vw-del').style.display =
      el('vw-moremenu').querySelector('.msep').style.display = _views.current ? '' : 'none';
    const tint = r => r.schedule_flag === 'OVERDUE' ? 't-crit' : r.schedule_flag === 'SETTLED' ? 't-good'
      : (r.schedule_flag === 'NO SCHEDULE' || r.schedule_flag === 'OVERPAID') ? 't-warn' : '';
    el('vw-rows').innerHTML = rows.map(r => `<tr class="${tint(r)}" style="cursor:pointer" onclick="openPlan('${esc(r.uin)}')">
      <td><strong>${esc(r.student_name)}</strong>
        ${r.latest_note ? `<div style="font-size:12px;opacity:.75;margin-top:2px">📝 ${esc(String(r.latest_note).slice(0,70))}${String(r.latest_note).length>70?'…':''}</div>` : ''}
        <br><span class="uin">${esc(r.uin)}</span></td>
      <td>${esc(r.program_name||'')}</td>
      <td class="r num">${Number(r.term1_due)>0?money(r.term1_due):'—'}</td>
      <td class="r num">${Number(r.term2_due)>0?money(r.term2_due):'—'}</td>
      <td class="r num money-disc">${Number(r.our_discount)>0?'− '+money(r.our_discount):'<span style="color:var(--faint)">·</span>'}</td>
      <td class="r num">${Number(r.true_due)>0?`<span class="${r.schedule_flag==='OVERDUE'?'money-due':''}" style="font-weight:650">${money(r.true_due)}</span>`:(Number(r.overpaid)>1?`<span class="money-ok">+${money(r.overpaid)}</span>`:'<span class="money-ok">paid</span>')}</td>
      <td><span class="chip ${r.schedule_flag==='OVERDUE'?'c-crit':r.schedule_flag==='SETTLED'?'c-good':(r.schedule_flag==='NO SCHEDULE'||r.schedule_flag==='OVERPAID')?'c-warn':'c-mute'}">${esc((r.schedule_flag||'').toLowerCase().replace('settled','paid up'))}</span></td>
      <td class="hint">${r.next_due_date ? longDate(r.next_due_date) : '—'}</td>
    </tr>`).join('') || `<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--muted)">No child matches these conditions.</td></tr>`;
  };
  el('vw-filter').onclick = openFilterPanel;

  // ── rename / delete
  el('vw-rename').onclick = async () => {
    if (!_views.current) return;
    const name = prompt('Rename this view:', _views.current.name);
    if (!name || !name.trim() || name.trim() === _views.current.name) return;
    const { data, error: e2 } = await s.schema('eurokids').from('saved_view').update({ name: name.trim(), updated_at: new Date().toISOString() }).eq('id', _views.current.id).select().maybeSingle();
    if (e2) return alert('Could not rename: ' + e2.message);
    await refreshList(); _views.current = data; drawSide(); run();
  };
  el('vw-del').onclick = async () => {
    if (!_views.current || !confirm(`Delete the view “${_views.current.name}”?`)) return;
    const { error: e3 } = await s.schema('eurokids').from('saved_view').delete().eq('id', _views.current.id);
    if (e3) return alert('Could not delete: ' + e3.message);
    _views.list = _views.list.filter(v => v.id !== _views.current.id); loadQuick(0);
  };

  // ── act on the result
  el('vw-csv').onclick = () => {
    const rows = _views.lastRows || [];
    const cols = ['student_name','uin','program_name','batch','father_name','mobile1','parent_email1','agreed_fee','our_discount','term1_due','term2_due','collected','uncredited_cash','true_due','schedule_flag','next_due_date','next_amount'];
    const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','))).join('\n');
    const a = document.createElement('a');

/* ── reminders: the automatic fee ladder ─────────────────────
   Off until the owner switches it on. Every step for every instalment is
   logged once, so the job can run twice a day and nobody hears twice.     */
async function tabReminders(){
  const b = el('body');
  b.innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  const [{ data: st, error }, { data: log }] = await Promise.all([
    s.schema('eurokids').from('reminder_settings').select('*').eq('id', true).maybeSingle(),
    s.schema('eurokids').from('reminder_log').select('uin,due_date,step,sent_at,sent_to,amount_due,result')
      .order('sent_at', { ascending: false }).limit(300),
  ]);
  if (error) return b.innerHTML = fail(error);
  const steps = (st?.steps || [-15, -5, 3]);
  const label = d => d < 0 ? `${-d} days before` : d === 0 ? 'on the day' : `${d} days after`;
  const nameOf = {};
  (await s.schema('eurokids').from('v_schedule').select('uin,student_name').limit(2000)).data?.forEach(r => nameOf[r.uin] = r.student_name);

  b.innerHTML = head('Automatic fee reminders',
      'Runs every morning at 9. Only families who still owe are contacted, using their true balance after discount and after any cash you hold.')
    + `<div style="max-width:720px">
      <div class="grp" style="margin-top:0"><div class="box">
        <label class="row" style="cursor:pointer"><span class="l"><strong>Automatic reminders</strong><span class="sub">${st?.enabled ? 'On — tomorrow morning’s run will go out.' : 'Off — nothing is sent until you switch this on.'}</span></span>
          <input type="checkbox" class="sw" id="rm-on" ${st?.enabled ? 'checked' : ''}></label>
        <label class="row" style="cursor:pointer"><span class="l">Copy the office on every reminder</span>
          <input type="checkbox" class="sw" id="rm-cc" ${st?.cc_office !== false ? 'checked' : ''}></label>
      </div></div>
      <div class="grp"><h3>When to remind</h3><div class="box">
        <div class="rowx"><div class="chips" id="rm-steps">${[-15,-10,-7,-5,-3,-1,0,1,3,5,7,10,14].map(d =>
          `<span class="chip ${steps.includes(d)?'on':''}" data-v="${d}">${label(d)}</span>`).join('')}</div></div>
      </div><div class="foot">Relative to each instalment’s due date. Pick as many as you like — a family gets each step once per instalment, and never once they have paid.</div></div>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn" id="rm-save">Save</button>
        <button class="btn line" id="rm-preview">Preview Tomorrow’s Run</button>
      </div>
      <div id="rm-msg" style="margin-top:12px"></div>
      <div id="rm-plan" style="margin-top:12px"></div>
    </div>

    <div class="panel" style="margin-top:22px"><div class="ptop"><h2>Sent so far</h2>
      <span class="hint">${(log||[]).length} entries</span></div>
      <div class="tw"><table><thead><tr><th>When</th><th>Child</th><th>Step</th><th>Due</th><th class="r">Owed</th><th>Result</th></tr></thead><tbody>
      ${(log||[]).map(l => `<tr>
        <td class="hint">${new Date(l.sent_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td><strong>${esc(nameOf[l.uin] || l.uin)}</strong></td>
        <td>${label(l.step)}</td><td class="hint">${longDate(l.due_date)}</td>
        <td class="r num">${money(l.amount_due)}</td>
        <td>${l.result === 'sent' ? '<span class="chip c-good">sent</span>' : `<span class="chip c-warn">${esc(l.result||'')}</span>`}</td>
      </tr>`).join('') || `<tr><td colspan="6" style="padding:22px;text-align:center;color:var(--muted)">Nothing sent yet.</td></tr>`}
      </tbody></table></div></div>`;

  document.querySelectorAll('#rm-steps .chip').forEach(c => c.onclick = () => c.classList.toggle('on'));
  const readSteps = () => [...document.querySelectorAll('#rm-steps .chip.on')].map(c => Number(c.dataset.v)).sort((a,b)=>a-b);

  el('rm-save').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    const enabled = el('rm-on').checked, picked = readSteps();
    if (enabled && !picked.length) { btn.disabled = false; return el('rm-msg').innerHTML = '<div class="err">Pick at least one step before switching reminders on.</div>'; }
    if (enabled && !st?.enabled && !confirm(`Switch automatic reminders ON?\n\nFrom tomorrow at 9 am, families who owe money will be emailed ${picked.map(label).join(', ')} each instalment.`)) { btn.disabled = false; return; }
    const { error: e2 } = await s.schema('eurokids').from('reminder_settings')
      .update({ enabled, steps: picked, cc_office: el('rm-cc').checked, updated_at: new Date().toISOString() }).eq('id', true);
    btn.disabled = false;
    if (e2) return el('rm-msg').innerHTML = `<div class="err">${esc(e2.message)}</div>`;
    tabReminders();
  };
  el('rm-preview').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    el('rm-plan').innerHTML = '<div class="hint">Working it out…</div>';
    // dry-run through the same code the cron uses, for tomorrow's date
    const tomorrow = new Date(Date.now() + 5.5*3600*1000 + 86400000).toISOString().slice(0,10);
    const j = await feesApi('/api/fees/reminder-preview', { on: tomorrow, steps: readSteps() });
    btn.disabled = false;
    if (!j.ok) return el('rm-plan').innerHTML = `<div class="err">${esc(j.error)}</div>`;
    el('rm-plan').innerHTML = `<div class="hint" style="margin-bottom:8px">On <strong>${longDate(j.on)}</strong>, with the steps selected above, <strong>${j.would_send}</strong> famil${j.would_send===1?'y':'ies'} would be reminded:</div>`
      + (j.plan.length ? `<div class="tw"><table><thead><tr><th>Child</th><th>Class</th><th>Step</th><th>Due</th><th class="r">Owed</th><th>To</th></tr></thead><tbody>
        ${j.plan.map(p => `<tr><td><strong>${esc(p.child)}</strong></td><td>${esc(p.class||'')}</td><td>${label(p.step)}</td>
          <td class="hint">${longDate(p.due)}</td><td class="r num">${money(p.amount_due)}</td>
          <td class="hint">${p.to.length ? esc(p.to.join(', ')) : '<span class="chip c-warn">no email</span>'}</td></tr>`).join('')}
        </tbody></table></div>` : '');
  };
}

async function feesApi(path, body){
  const { data:{ session:s } } = await getSb().auth.getSession();
  if (!s) return { ok:false, error:'Your session has expired — please sign in again.' };
  let r;
  try {
    r = await fetch(path, { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${s.access_token}` },
      body: JSON.stringify(body) });
  } catch (e) {
    return { ok:false, error:'Could not reach the server: ' + e.message };
  }
  // A gateway timeout or a body-too-large returns HTML, not JSON. Left
  // unhandled this rejected mid-send and stranded the button, which invited a
  // second click and a second email to every parent.
  const text = await r.text();
  try { return JSON.parse(text); }
  catch {
    return { ok:false, error: r.status === 413
      ? 'Those attachments are too large for one request. Send a link instead.'
      : `The server returned ${r.status}. If this was a send, check Resend before retrying — some emails may already have gone out.` };
  }
}

async function tabCompose(){
  // Attachments and hand-picked children used to survive a tab switch
  // invisibly: the file input looked empty while the old files were still
  // attached to the next send. Facets and the roll are only caches, so keep
  // those and rebuild everything the user can see.
  _cmp = { filters:{ money:'all' }, attachments:[], recipients:[],
           facets:_cmp.facets || null, picked:[], roll:_cmp.roll || [] };
  const b = el('body');
  b.innerHTML = head('Send email to parents',
    'Choose a group, write once, and every family gets it with the school’s branding.');
  b.innerHTML += `
  <div style="max-width:760px">
  <div class="grp" style="margin-top:0"><h3>To</h3><div class="box">
    <div class="row"><div class="l">Class</div><div id="cmp-classes" class="chips">…</div></div>
    <div class="row"><div class="l">Batch</div><div id="cmp-batches" class="chips">…</div></div>
    <div class="row"><div class="l">Who</div>
      <select id="cmp-money" class="in">
        <option value="all">Everyone in the selection</option>
        <option value="owing">Only families who still owe</option>
        <option value="overdue">Only families past their due date</option>
        <option value="settled">Only families fully paid</option>
      </select></div>
    <div class="row"><div class="l">Payment due on or before<span class="sub">Anyone whose next instalment falls after this date is left out.</span></div><input id="cmp-cutoff" type="date" class="in"></div>
    <label class="row" style="cursor:pointer"><span class="l">Only families with no payment schedule</span><input type="checkbox" class="sw" id="cmp-nosched"></label>
  </div>
  <div class="foot" id="cmp-count">Counting…</div><div class="foot" id="cmp-flags"></div></div>

  <div class="grp"><h3>Or name them</h3><div class="box">
    <div class="row"><div class="l">Children<span class="sub">Naming children overrides the filters above.</span></div>
      <input class="in wide" id="cmp-pick" list="cmp-kids" placeholder="Type a name and press Enter" autocomplete="off"><datalist id="cmp-kids"></datalist></div>
    <div class="rowx" id="cmp-picked-row" style="display:none"><div id="cmp-picked" class="chips"></div></div>
    <div class="row"><div class="l">Other addresses<span class="sub">Branding only — no fee details, since there is no child attached.</span></div>
      <textarea class="in" id="cmp-extra" rows="2" placeholder="someone@example.com, another@example.com" style="width:55%"></textarea></div>
  </div></div>

  <div class="grp"><h3>Message</h3><div class="box">
    <div class="row"><div class="l">Template<span class="sub">Fills everything below; edit freely afterwards.</span></div>
      <select id="cmp-tpl" class="in"><option value="">Write my own</option>${EMAIL_TEMPLATES.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="row"><div class="l">Subject</div><input id="cmp-subject" class="in wide" placeholder="e.g. Janmashtami celebration on 6 September"></div>
    <div class="row"><div class="l">Look</div><select id="cmp-theme" class="in">
        <option value="school">School blue</option>
        <option value="celebration">Celebration red</option>
        <option value="festive">Festive saffron</option>
        <option value="warm">Warm rose</option>
        <option value="notice">Payment notice amber</option>
        <option value="calm">Calm green</option>
      </select></div>
    <div class="rowx"><textarea id="cmp-message" class="in" rows="9" placeholder="Dear Parent,&#10;&#10;Write normally. Leave a blank line between paragraphs." style="width:100%"></textarea></div>
    <label class="row" style="cursor:pointer"><span class="l">Add each family’s fee statement underneath<span class="sub">Every payment received and what is left, per child.</span></span><input type="checkbox" class="sw" id="cmp-fees"></label>
    <div class="row"><div class="l">Attachments<span class="sub" id="cmp-filelist"></span></div><input id="cmp-files" type="file" multiple class="in" style="width:auto;text-align:left"></div>
  </div>
  <div class="foot">Personalise with <code>{{child}}</code>, <code>{{first_name}}</code>, <code>{{class}}</code>, <code>{{amount_due}}</code>, <code>{{due_date}}</code> — each family sees their own.</div></div>

  <div class="grp"><div class="box">
    <label class="row" style="cursor:pointer"><span class="l">Copy the office</span><input type="checkbox" class="sw" id="cmp-cc" checked></label>
  </div></div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px">
    <button class="btn line" id="cmp-preview">Preview</button>
    <button class="btn line" id="cmp-test">Send a Test…</button>
    <span style="flex:1"></span>
    <button class="btn" id="cmp-send">Send</button>
  </div>
  <div id="cmp-msg" style="margin-top:12px"></div>
  <div id="cmp-preview-box" style="margin-top:12px"></div>
  </div>`;

  const readFilters = () => {
    const on = sel => [...document.querySelectorAll(sel + ' .chip.on')].map(c => c.dataset.v);
    // A hand-picked list is an instruction, not a hint: honour it exactly and
    // ignore the filters, so nobody named here is silently dropped.
    if (_cmp.picked.length) return { uins: _cmp.picked.map(p => p.uin) };
    return {
      classes: on('#cmp-classes'), batches: on('#cmp-batches'),
      money: el('cmp-money').value,
      dueOnOrBefore: el('cmp-cutoff').value || null,
      missingSchedule: el('cmp-nosched').checked,
    };
  };
  const readExtras = () => (el('cmp-extra').value || '')
    .split(/[,;\s]+/).map(x => x.trim()).filter(x => x.includes('@'));

  async function refresh(){
    _cmp.filters = readFilters();
    el('cmp-count').textContent = 'Counting…';
    const j = await feesApi('/api/fees/recipients', { filters: _cmp.filters });
    if (!j.ok) { el('cmp-count').innerHTML = `<span style="color:var(--red)">${esc(j.error)}</span>`; return; }
    _cmp.recipients = j.recipients;
    const freeCount = readExtras().length;
    // The markup is rebuilt on every visit, so the chips must be too —
    // otherwise the second visit showed a literal "…" that never recovered.
    if (!_cmp.chipsDrawn) {
      _cmp.facets = j.facets;
      const chips = (list, id) => el(id).innerHTML = list.map(f =>
        `<span class="chip" data-v="${esc(f.value)}">${esc(f.value)} <b>${f.count}</b></span>`).join('') || '<span class="hint">none</span>';
      chips(j.facets.classes, 'cmp-classes');
      chips(j.facets.batches, 'cmp-batches');
      document.querySelectorAll('#cmp-classes .chip, #cmp-batches .chip').forEach(c =>
        c.onclick = () => { c.classList.toggle('on'); refreshSoon(); });
      _cmp.chipsDrawn = true;
    }
    if (!_cmp.roll.length) {
      const { data: roll } = await getSb().schema('eurokids').from('v_schedule')
        .select('uin,student_name,program_name').order('student_name').limit(2000);
      _cmp.roll = roll || [];
    }
    // Always repaint the datalist: without it the "name specific children" box
    // could never match anything on a second visit.
    el('cmp-kids').innerHTML = _cmp.roll
      .map(k => `<option value="${esc(k.student_name)} — ${esc(k.program_name || 'class ?')}">`).join('');
    drawPicked();
    const s = j.summary;
    const n = s.reachable + freeCount;
    _cmp.lastSummary = { reachable: n };
    el('cmp-count').innerHTML =
      `<strong style="color:var(--label)">${n} will receive this</strong> · ${s.addresses} email address${s.addresses === 1 ? '' : 'es'}` +
      (freeCount ? ` · ${freeCount} typed` : '') +
      (s.unreachable ? ` · <span style="color:#8A4B00">${s.unreachable} have no email on file</span>` : '') +
      (s.owed && has('finance') ? ` · ${money(s.owed)} outstanding across them` : '');
    el('cmp-flags').textContent = 'Across the school: ' +
      Object.entries(j.flags).map(([k,v]) => `${v} ${k.toLowerCase()}`).join(' · ');
    const sb = el('cmp-send'); if (sb && sb.textContent !== 'Sent') sb.textContent = n ? `Send to ${n}` : 'Send';
  }

  const drawPicked = () => {
    el('cmp-picked-row').style.display = _cmp.picked.length ? '' : 'none';
    el('cmp-picked').innerHTML = _cmp.picked.map((p, i) =>
      `<span class="chip on" data-i="${i}" style="cursor:pointer">${esc(p.student_name)} ✕</span>`).join('');
    document.querySelectorAll('#cmp-picked .chip').forEach(c => c.onclick = () => {
      _cmp.picked.splice(Number(c.dataset.i), 1); drawPicked(); refresh();
    });
  };
  el('cmp-pick').onchange = () => {
    const v = (el('cmp-pick').value || '').trim().toLowerCase();
    const k = _cmp.roll.find(x => `${x.student_name} — ${x.program_name || 'class ?'}`.toLowerCase() === v);
    if (k && !_cmp.picked.some(p => p.uin === k.uin)) { _cmp.picked.push(k); drawPicked(); refresh(); }
    el('cmp-pick').value = '';
  };
  el('cmp-extra').oninput = debounce(() => refresh(), 300);

  const refreshSoon = debounce(refresh, 250);
  ['cmp-money','cmp-cutoff','cmp-nosched'].forEach(id => el(id).onchange = refreshSoon);

  // A template fills the letter and points it at the right families.
  el('cmp-tpl').onchange = () => {
    const t = EMAIL_TEMPLATES[Number(el('cmp-tpl').value)]; if (!t) return;
    const typed = el('cmp-message').value.trim();
    if (typed && !confirm('Replace what you have written with the template?')) { el('cmp-tpl').value = ''; return; }
    el('cmp-subject').value = t.subject; el('cmp-message').value = t.body;
    el('cmp-theme').value = t.theme; el('cmp-fees').checked = t.fees;
    el('cmp-money').value = t.money;
    refresh();
    el('cmp-message').focus();
  };

  el('cmp-files').onchange = async e => {
    _cmp.attachments = [];
    for (const f of e.target.files) {
      const buf = await f.arrayBuffer();
      let bin = ''; new Uint8Array(buf).forEach(x => bin += String.fromCharCode(x));
      _cmp.attachments.push({ filename: f.name, content: btoa(bin) });
    }
    const kb = _cmp.attachments.reduce((n,a) => n + a.content.length*0.75, 0)/1024;
    el('cmp-filelist').textContent = _cmp.attachments.length
      ? `${_cmp.attachments.length} file(s), ${kb.toFixed(0)} KB total` + (kb > 8000 ? ' — too big, keep under 8 MB' : '') : '';
  };

  const payload = extra => ({
    filters: readFilters(),
    subject: el('cmp-subject').value.trim(),
    message: el('cmp-message').value.trim(),
    theme: el('cmp-theme').value,
    includeFees: el('cmp-fees').checked,
    ccOffice: el('cmp-cc').checked,
    attachments: _cmp.attachments,
    extraEmails: readExtras(),
    sendId: _cmp.sendId,
    ...extra,
  });
  const say = (h, cls='') => el('cmp-msg').innerHTML = cls ? `<div class="${cls}">${h}</div>` : h;

  el('cmp-preview').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true; say('Building preview…');
    let j;
    try { j = await feesApi('/api/fees/bulk-send', payload({})); }
    finally { btn.disabled = false; }
    if (!j.ok) return say(esc(j.error), 'err');
    say(`This is how it will look for <strong>${esc(j.preview_for||'')}</strong>. ${j.summary.reachable} families would receive it.`);
    el('cmp-preview-box').innerHTML =
      `<iframe style="width:100%;height:620px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>`;
    el('cmp-preview-box').querySelector('iframe').srcdoc = j.preview_html || '';
  };

  el('cmp-test').onclick = async e => {
    const to = prompt('Send one test copy to which address?', session?.user?.email || '');
    if (!to) return;
    const btn = e.currentTarget; btn.disabled = true; say('Sending test…');
    let j;
    try { j = await feesApi('/api/fees/bulk-send', payload({ testTo: to })); }
    finally { btn.disabled = false; }
    say(j.ok ? `Test sent to ${esc(to)} using ${esc(j.sample)}’s details.` : esc(j.error), j.ok ? 'ok' : 'err');
  };

  el('cmp-send').onclick = async e => {
    // One id per attempt: if the connection drops and the operator retries,
    // Resend recognises the key and will not deliver a second copy.
    _cmp.sendId = _cmp.sendId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    // Count what the server will actually send to, not the on-screen page of
    // children — those differ once anyone lacks an email or types an address.
    const n = (_cmp.lastSummary?.reachable ?? _cmp.recipients.length);
    const subj = el('cmp-subject').value.trim();
    if (!n) return say('Nobody is selected.', 'err');
    if (!confirm(`Send “${subj}” to ${n} recipient${n === 1 ? '' : 's'} now?\n\nThis cannot be undone.`)) return;

    const btn = e.currentTarget;
    btn.disabled = true;
    say(`Sending to ${n} recipients — this can take a couple of minutes for a large group. Do not close this tab.`);
    let j;
    try {
      j = await feesApi('/api/fees/bulk-send', payload({ confirm:true }));
    } finally {
      // Deliberately left disabled on success: re-enabling it here is what
      // tempts a second click and a second copy to every parent.
      if (!j || !j.ok) btn.disabled = false;
    }
    if (!j.ok) return say(esc(j.error), 'err');
    _cmp.attachments = []; _cmp.picked = [];
    btn.textContent = 'Sent';
    say(`Sent to ${j.sent} recipient${j.sent === 1 ? '' : 's'}.`
      + (j.failed ? `<br><strong>${j.failed} failed.</strong> ` +
          j.failures.map(f => `${esc(f.name)} — ${esc(f.error || 'unknown')}`).join('<br>')
          + '<br>Fix the cause, then send again to just those families.' : '')
      + '<br><span class="hint">Change the subject or reload the tab before sending anything else.</span>',
      j.failed ? 'err' : 'ok');
  };

  refresh();
}

function head(t, s, right){
  return `<div class="ph"><div><h1>${t}</h1>${s ? `<div class="s">${s}</div>` : ''}</div><div class="ph-r">${right || ''}</div></div>`;
}
function fail(e){
  return `<div class="err">Could not load: ${esc(e?.message || e)}</div>`;
}

      s.schema('eurokids').from('v_live_summary').select('*').maybeSingle(),

      <div class="panel" id="recent-pay"></div>

       </tbody></table></div></div>`;

    const showRecentPayments = async () => {

      try {
        const { data: pays } = await s.schema('epms').from('payment_events')
          .select('uin,student_name,term,amount_paise,detected_at')
          .order('detected_at', { ascending: false }).limit(12);
        if (!pays || !pays.length) { box.style.display = 'none'; return; }
        const sum = pays.reduce((a, p) => a + Number(p.amount_paise), 0) / 100;
        box.innerHTML = `<div class="ptop"><h2>Payments received</h2>
            <span class="hint">${money(sum)} across the last ${pays.length} · newest first</span></div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurokids JMD — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bone:#FFFFFF; --card:#FFF; --ink:#1A1A1A; --muted:#6B6B6B; --faint:#9A968F;
  --line:#E5E7EB; --line-2:#D1D5DB; --accent:#DC2B1C; --accent-wash:#FCEEEC; --bar:#000;
  --good:#1E7A4B; --good-wash:#E8F3ED; --warn:#9A6410; --warn-wash:#FAF0DF;
  --crit:#B32519; --crit-wash:#FBEBE9; --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:Inter,-apple-system,"Helvetica Neue",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{height:26px;background:var(--bar)}
.chrome{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;gap:16px;flex-wrap:wrap}
@media(max-width:560px){.chrome{padding:14px 18px}}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px}
.dot{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#FF7A5C,var(--accent) 62%,#A81E12);filter:blur(.4px)}
.chromeR{display:flex;align-items:center;gap:20px;font-size:13.5px;color:var(--muted)}
.chromeR a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stage{max-width:1180px;margin:0 auto;padding:0 34px 90px}
@media(max-width:560px){.stage{padding:0 18px 60px}}
.chooser{min-height:60vh;display:flex;flex-direction:column;justify-content:center;max-width:940px}
.hello{font-size:46px;font-weight:700;letter-spacing:-.035em}
.askline{color:var(--muted);font-size:16px;margin-top:6px}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:22px;margin-top:38px}
.door{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(26,26,26,.06),0 4px 14px -6px rgba(26,26,26,.08);transition:box-shadow .18s,transform .18s,border-color .18s;width:100%}
.door:hover:not(.shut){box-shadow:0 6px 22px rgba(26,26,26,.09);transform:translateY(-2px);border-color:var(--line-2)}
.door h3{font-size:19px;font-weight:600}
.door p{margin:0;color:var(--muted);font-size:14px}
.door .open{color:var(--accent);font-weight:500;margin-top:8px}
.door.shut{background:transparent;cursor:not-allowed;box-shadow:none}
.door.shut h3,.door.shut p,.door.shut .open{color:var(--faint)}
.doorwrap{position:relative;display:flex}
.soon{position:absolute;top:22px;right:22px;font-size:11.5px;color:var(--faint);background:var(--bone);border-radius:999px;padding:3px 11px}
.crumb{display:flex;align-items:center;gap:9px;padding:22px 0 6px;font-size:13.5px;color:var(--muted)}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;font-weight:700}
.ph .s{color:var(--muted);font-size:14px;margin-top:4px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:7px}
.stat .m{font-size:12px;color:var(--muted);margin-top:4px}
.stat.acc .v{color:var(--accent)} .stat.good .v{color:var(--good)}
.stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--crit)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.ptop{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ptop h2{font-size:15px;font-weight:600}
.pbody{padding:18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bone)}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px}
.c-good{background:var(--good-wash);color:var(--good)} .c-warn{background:var(--warn-wash);color:var(--warn)}
.c-crit{background:var(--crit-wash);color:var(--crit)} .c-mute{background:var(--bone);color:var(--faint)}
.c-acc{background:var(--accent-wash);color:var(--accent)}
.btn{background:var(--ink);color:var(--bone);border:0;border-radius:9px;padding:11px 18px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.87} .btn:disabled{opacity:.5;cursor:default}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.in{background:var(--bone);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.err{background:var(--crit-wash);color:var(--crit);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.ok{background:var(--good-wash);color:var(--good);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{cursor:pointer;border:1px solid var(--line-2);background:var(--bone);user-select:none;padding:5px 10px;font-size:12.5px;transition:.12s}
.chips .chip:hover{border-color:var(--ink)}
.chips .chip.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.chips .chip b{opacity:.55;font-weight:600;margin-left:2px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--line);font-size:12.5px;font-weight:500}
.pill.big{background:var(--ink);color:var(--bone);font-weight:600;font-size:13.5px}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--crit)}
code{background:var(--line);padding:1px 5px;border-radius:4px;font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.loading{color:var(--faint);padding:26px 0;font-size:13.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="chrome">
  <div class="brand"><span class="dot"></span><span>Eurokids JMD</span></div>
  <div class="chromeR" id="chromeR"></div>
</div>
<div class="stage" id="stage"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Eurokids JMD — Hub
   The front door. Signs the user in once, then hands them to the
   app they are entitled to. Shares its auth storageKey with
   portal.html so one sign-in covers every page on this domain.

   What a person can see is decided by public.module_access, and
   enforced in Postgres by RLS — never here. This file only
   decides what to *draw*; the database decides what to *return*.
   ============================================================ */
const SUPABASE_URL = 'https://saqefzgnvznuurupqpsw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_u8v_dh1zMGdbrIQPMcxrFg_HCPJeUP9';

let sb = null, session = null, modules = [], profile = null;
let app = null, tab = 'overview';

function getSb(){
  if (sb) return sb;
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'eurokids-portal-auth' }
  });
  return sb;
}
const money = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const has = m => modules.includes(m);
const el = id => document.getElementById(id);

const TABS = {
  overview:   { label: 'Overview', need: () => has('admission') || has('finance') },
  children:   { label: 'Children', need: () => has('finance') },
  plans:      { label: 'Fees & Plans', need: () => has('finance') || has('admission') },
  compose:    { label: 'Send email', need: () => has('finance') || has('admission') },
  liability:  { label: 'Liabilities', need: () => has('finance') },
  discounts:  { label: 'Quick discounts', need: () => has('finance') },
  kits:       { label: 'Kits',     need: () => has('kits') },
  fees:       { label: 'Fee Reference', need: () => has('fees') || has('finance') }
};

/* ── boot ─────────────────────────────────────────────── */
async function boot(){
  const { data } = await getSb().auth.getSession();
  session = data.session;
  if (session) await loadMe();
  paint();
  getSb().auth.onAuthStateChange(async (_e, s) => {
    const was = session?.user?.id;
    session = s;
    if (session && session.user.id !== was) { await loadMe(); }
    if (!session) { modules = []; profile = null; app = null; }
    paint();
  });
}

async function loadMe(){
  const s = getSb();
  const [{ data: mods }, { data: prof }] = await Promise.all([
    s.from('module_access').select('module').eq('user_id', session.user.id),
    s.from('profiles').select('role, full_name').eq('id', session.user.id).maybeSingle()
  ]);
  modules = (mods || []).map(r => r.module);
  profile = prof || null;
}

/* ── chrome ───────────────────────────────────────────── */
function paintChrome(){
  el('chromeR').innerHTML = session
    ? `<span>${esc(profile?.full_name || session.user.email)}</span><a id="out">Sign out</a>`
    : `<span>admin.eurokidsjmdenclave.org</span>`;
  const o = el('out');
  if (o) o.onclick = async () => { await getSb().auth.signOut(); };
}

function paint(){
  paintChrome();
  if (!session) return renderLogin();
  if (app === 'users') return renderUsers();
  if (!app)     return renderChooser();
  renderApp();
}

function isOwner(){
  return (session?.user?.email || '').toLowerCase() === 'abhinav@ganya.in';
}

/* ── sign in ──────────────────────────────────────────── */
function renderLogin(){
  el('stage').innerHTML = `
    <div class="chooser">
      <h1 class="hello">Sign in</h1>
      <p class="askline">Eurokids JMD Enclave</p>
      <div style="max-width:360px;margin-top:30px">
        <div id="loginErr"></div>
        <div class="fld"><label for="em">Email</label>
          <input class="in" id="em" type="email" autocomplete="username" placeholder="you@eurokidsjmdenclave.org"></div>
        <div class="fld"><label for="pw">Password</label>
          <input class="in" id="pw" type="password" autocomplete="current-password"></div>
        <button class="btn" id="go" style="width:100%">Sign in</button>
        <p class="hint" style="margin-top:14px">Teachers: go to
          <a href="/teacher" style="color:var(--accent)">/teacher</a> to apply for leave.</p>
      </div>
    </div>`;
  const go = el('go');
  const submit = async () => {
    const email = el('em').value.trim(), password = el('pw').value;
    if (!email || !password) return;
    go.disabled = true; go.textContent = 'Signing in…';
    const { error } = await getSb().auth.signInWithPassword({ email, password });
    if (error) {
      el('loginErr').innerHTML = `<div class="err">${esc(error.message)}</div>`;
      go.disabled = false; go.textContent = 'Sign in';
    }
  };
  go.onclick = submit;
  el('pw').onkeydown = e => { if (e.key === 'Enter') submit(); };
  el('em').onkeydown = e => { if (e.key === 'Enter') el('pw').focus(); };
}

/* ── chooser ──────────────────────────────────────────── */
function renderChooser(){
  const canAdmissions = has('admission') || has('finance') || has('kits');
  const canStaff      = has('staff_portal') || has('payroll');
  const doors = [
    { key:'admissions', name:'Admissions & Fees',
      desc:'Children, fees, payment schedules and kits.', ok:canAdmissions, href:null },
    { key:'staff', name:'Staff Portal',
      desc:'Leave, attendance and payroll.', ok:canStaff, href:'/staff' },
    { key:'pulse', name:'Site Pulse',
      desc:'Enquiries, conversions and centre performance.', ok:false, soon:true }
  ];
  if (isOwner()) doors.push({ key:'users', name:'Users & access',
    desc:'Create accounts for coordinators and HR; grant modules.', ok:true, href:null });
  el('stage').innerHTML = `
    <div class="chooser">
      <h1 class="hello">Hello</h1>
      <p class="askline">Where would you like to go?</p>
      <div class="deck">${doors.map(d => `
        <div class="doorwrap">
          <button class="door ${d.ok ? '' : 'shut'}" data-key="${d.key}" ${d.ok ? '' : 'disabled'}>
            <h3>${d.name}</h3><p>${d.desc}</p>
            <span class="open">${d.ok ? 'Open &rarr;' : (d.soon ? 'Not ready yet' : 'Not your access')}</span>
          </button>${d.soon ? '<span class="soon">soon</span>' : ''}
        </div>`).join('')}</div>
      ${(!canAdmissions && !canStaff) ? `<p class="hint" style="margin-top:26px">
        No modules are granted to this account yet. Ask the administrator to add them.</p>` : ''}
    </div>`;
  document.querySelectorAll('.door[data-key]').forEach(b => {
    b.onclick = () => {
      const d = doors.find(x => x.key === b.dataset.key);
      if (d.href) { location.href = d.href; return; }
      app = d.key;
      tab = Object.keys(TABS).find(t => TABS[t].need()) || 'overview';
      paint(); scrollTo({ top: 0 });
    };
  });
}

/* ── users & access (owner only) ─────────────────────── */
const ALL_MODULES = ['staff_portal','epms_admin','pulse','payroll','fees','kits','admission','finance'];
const MODULE_LABEL = { staff_portal:'Staff portal', epms_admin:'EPMS admin', pulse:'Site Pulse',
  payroll:'Payroll', fees:'Fees', kits:'Kits', admission:'Admission', finance:'Finance (money)' };

async function hubUsersApi(method, body){
  const { data: { session: s } } = await getSb().auth.getSession();
  const resp = await fetch('/api/admin/hub-users', {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${s.access_token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  return resp.json();
}

function modChecks(prefix, selected){
  return ALL_MODULES.map(m => `
    <label style="display:inline-flex;align-items:center;gap:6px;margin:3px 12px 3px 0;font-size:13px;${m==='finance'?'color:var(--crit);font-weight:600':''}">
      <input type="checkbox" class="${prefix}-mod" value="${m}" ${selected?.includes(m)?'checked':''}> ${MODULE_LABEL[m]}
    </label>`).join('');
}

async function renderUsers(){
  el('stage').innerHTML = `
    <div class="crumb"><button id="back">&larr; All apps</button><span>/</span><span>Users &amp; access</span></div>
    <div id="body"><div class="loading">Loading users…</div></div>`;
  el('back').onclick = () => { app = null; paint(); };

  const json = await hubUsersApi('GET');
  if (!json.ok) { el('body').innerHTML = `<div class="err">${esc(json.error||'Could not load')}</div>`; return; }

  const staffUsers = json.users.filter(u => !u.is_teacher);
  const teacherCount = json.users.length - staffUsers.length;

  el('body').innerHTML = `
    <div class="panel" style="padding:20px">
      <h3 style="margin-bottom:4px">Create an account</h3>
      <p class="hint" style="margin-bottom:14px">For coordinators, HR staff and yourself. Teachers are created in the Staff Portal → Employees, the same as always (${teacherCount} teacher account${teacherCount===1?'':'s'} exist there).</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:820px">
        <div class="fld"><label>Full name</label><input class="in" id="nu-name" placeholder="e.g. Sunita Saxena"></div>
        <div class="fld"><label>Email</label><input class="in" id="nu-email" type="email" placeholder="name@eurokidsjmdenclave.org"></div>
        <div class="fld"><label>Password (min 8)</label><input class="in" id="nu-pass" placeholder="They can't change it — pick well"></div>
      </div>
      <div style="margin:8px 0 14px"><div class="hint" style="margin-bottom:4px">Modules — tick what they may open. <span style="color:var(--crit)">Finance shows money; grant sparingly.</span></div>${modChecks('nu')}</div>
      <div id="nu-msg"></div>
      <button class="btn" id="nu-go">Create account</button>
    </div>

    <div class="panel" style="padding:0;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--line)">
          <th style="padding:12px 16px">Person</th><th style="padding:12px">Modules</th>
          <th style="padding:12px">Last sign-in</th><th style="padding:12px 16px"></th>
        </tr></thead>
        <tbody>${staffUsers.map(u => `
          <tr style="border-bottom:1px solid var(--line)" data-uid="${u.id}">
            <td style="padding:12px 16px"><strong>${esc(u.full_name||'—')}</strong><br><span class="hint">${esc(u.email)}</span></td>
            <td style="padding:12px;max-width:340px">${u.modules.length ? u.modules.map(m=>`<span style="display:inline-block;background:${m==='finance'?'var(--crit-wash)':'var(--good-wash)'};color:${m==='finance'?'var(--crit)':'var(--good)'};border-radius:99px;padding:1px 9px;margin:2px;font-size:11px">${MODULE_LABEL[m]||m}</span>`).join('') : '<span class="hint">none</span>'}</td>
            <td style="padding:12px" class="hint">${u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : 'never'}</td>
            <td style="padding:12px 16px;white-space:nowrap">
              <a style="color:var(--accent);cursor:pointer" onclick="editUserModules('${u.id}')">Modules</a> ·
              <a style="color:var(--accent);cursor:pointer" onclick="resetUserPassword('${u.id}','${esc(u.email)}')">Password</a>
              ${u.email==='abhinav@ganya.in'?'':` · <a style="color:var(--crit);cursor:pointer" onclick="deleteHubUser('${u.id}','${esc(u.email)}')">Remove</a>`}
            </td>
          </tr>
          <tr class="modrow" id="modrow-${u.id}" style="display:none;border-bottom:1px solid var(--line);background:var(--bone)">
            <td colspan="4" style="padding:12px 16px">
              ${modChecks('mm-'+u.id, u.modules)}
              <div style="margin-top:8px"><button class="btn" onclick="saveUserModules('${u.id}')">Save modules</button></div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  el('nu-go').onclick = async () => {
    const full_name = el('nu-name').value.trim(), email = el('nu-email').value.trim(), password = el('nu-pass').value;
    const modules = [...document.querySelectorAll('.nu-mod:checked')].map(c=>c.value);
    if (!full_name || !email || password.length < 8) { el('nu-msg').innerHTML = '<div class="err">Name, email, and a password of at least 8 characters are required.</div>'; return; }
    if (modules.includes('finance') && !confirm('Grant FINANCE? This person will see collections, dues and discounts. Continue?')) return;
    el('nu-go').disabled = true; el('nu-go').textContent = 'Creating…';
    const r = await hubUsersApi('POST', { action:'create', email, password, full_name, modules });
    if (r.ok) { renderUsers(); }
    else { el('nu-msg').innerHTML = `<div class="err">${esc(r.error||'Failed')}</div>`; el('nu-go').disabled = false; el('nu-go').textContent = 'Create account'; }
  };
}

function editUserModules(uid){
  const row = el('modrow-'+uid);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function saveUserModules(uid){
  const modules = [...document.querySelectorAll(`.mm-${CSS.escape(uid)}-mod:checked`)].map(c=>c.value);
  if (modules.includes('finance') && !confirm('Grant FINANCE to this account?')) return;
  const r = await hubUsersApi('POST', { action:'set_modules', user_id: uid, modules });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

async function resetUserPassword(uid, email){
  const pw = prompt(`New password for ${email} (min 8 chars):`);
  if (!pw) return;
  if (pw.length < 8) return alert('At least 8 characters.');
  const r = await hubUsersApi('POST', { action:'reset_password', user_id: uid, password: pw });
  if (r.ok) alert(`Done. Share it with them privately:\n\n${email}\n${pw}`); else alert(r.error||'Failed');
}

async function deleteHubUser(uid, email){
  if (!confirm(`Remove ${email}? Their sign-in stops working immediately.`)) return;
  const r = await hubUsersApi('POST', { action:'delete', user_id: uid });
  if (r.ok) renderUsers(); else alert(r.error||'Failed');
}

/* ── schedule coverage: what the coordinator still has to fill ──
   A child with no payment schedule cannot be chased, invoiced or
   reconciled, so it is surfaced on the front page rather than buried. */
async function renderScheduleFlags(){
  const box = el('sched-flags'); if (!box) return;
  const { data, error } = await getSb().schema('eurokids').from('v_schedule')
    .select('uin,student_name,program_name,schedule_flag,days_overdue,true_due,next_due_date')
    .limit(2000);
  if (error || !data) return;

  const by = f => data.filter(r => r.schedule_flag === f);
  const missing = by('NO SCHEDULE'), overdue = by('OVERDUE'), soon = by('DUE SOON');
  const rupees = rows => money(rows.reduce((s, r) => s + Number(r.true_due || 0), 0));
  if (!missing.length && !overdue.length && !soon.length) return;

  box.innerHTML = `<div class="panel"><div class="ptop">
      <h2>Payment schedules</h2>
      <span class="hint">Every child needs one before fees can be chased.</span></div>
    <div class="pill-row" style="padding:0 4px 14px">
      ${missing.length ? `<span class="pill warn">${missing.length} with no schedule · ${rupees(missing)}</span>` : ''}
      ${overdue.length ? `<span class="pill" style="background:var(--crit-wash);color:var(--crit)">${overdue.length} past their due date · ${rupees(overdue)}</span>` : ''}
      ${soon.length ? `<span class="pill">${soon.length} due within a fortnight · ${rupees(soon)}</span>` : ''}
      <button class="btn sm line" id="sf-mail">Email the overdue families →</button>
    </div>
    ${missing.length ? `<div class="tw"><table><thead><tr><th>Child</th><th>Class</th><th class="r">Owed</th><th></th></tr></thead><tbody>
      ${missing.slice(0, 12).map(r => `<tr><td><strong>${esc(r.student_name)}</strong></td>
        <td>${esc(r.program_name || '')}</td><td class="r num">${money(r.true_due)}</td>
        <td class="r"><a style="color:var(--accent);cursor:pointer" onclick="tab='plans';renderApp();setTimeout(()=>openPlan('${esc(r.uin)}'),400)">Add schedule →</a></td></tr>`).join('')}
      </tbody></table></div>
      ${missing.length > 12 ? `<div class="hint" style="padding:8px 4px">…and ${missing.length - 12} more.</div>` : ''}` : ''}

  el('sf-mail').onclick = () => {
    tab = 'compose';
    renderApp();
    setTimeout(() => { const m = el('cmp-money'); if (m) { m.value = 'overdue'; m.dispatchEvent(new Event('change')); } }, 350);

async function feesApi(path, body){

    body: JSON.stringify(body) });
  return r.json();
}

          // Third pass: money EPMS has just recognised for a family whose cash
          // we are holding is us posting it onward. Consume the held amount by
          // exactly that much, so the payment is counted once rather than twice.
          let matched = '';
          try {
            const { data: m } = await getSb().schema('eurokids').rpc('auto_match_remittances');

          el('sync-info').textContent = (j.new_payments

          alert('Sync failed:\n\n' + (j.error || 'unknown error'));
          b.disabled = false; b.textContent = 'Sync from EPMS';

      </tbody></table></div></div>`;
  document.querySelectorAll('.logcall').forEach(b =>
    b.onclick = () => { b.textContent = 'Logged'; b.disabled = true; });

  let rows = _kids.filter(r => {
    if (_kidProg !== 'all' && (r.program_name || '') !== _kidProg) return false;
    if (_kidBatch !== 'all' && (r.batch || 'Unset') !== _kidBatch) return false;
    if (!q) return true;
    return (r.student_name || '').toLowerCase().includes(q)
        || (r.father_name || '').toLowerCase().includes(q)
        || (r.uin || '').toLowerCase().includes(q);
  });
  if (_kidSort === 'newest') rows.sort((a,b) => (b.admission_date||'').localeCompare(a.admission_date||''));
  else if (_kidSort === 'oldest') rows.sort((a,b) => (a.admission_date||'').localeCompare(b.admission_date||''));
  else if (_kidSort === 'name')   rows.sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''));
  else if (_kidSort === 'due')    rows.sort((a,b) => Number(b.true_due) - Number(a.true_due));

  // Counts per program for the filter chips
  const countFor = p => _kids.filter(r => (r.program_name||'') === p).length;
  const fmtDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'}) : '—';
  const owing = rows.filter(r => Number(r.true_due) > 0).length;

  // Per-class strip: headcount and what the class is worth
  const classStrip = PROGRAMS.filter(p => countFor(p)).map(p => {
    const set = _kids.filter(r => r.program_name === p);
    const due = set.reduce((a,r) => a + Number(r.true_due), 0);
    return `<div class="stat" style="padding:11px 13px">
      <div class="k">${p}</div><div class="v" style="font-size:19px">${set.length}</div>
      <div class="m">${due > 0 ? money(due) + ' outstanding' : 'all paid'}</div></div>`;
  }).join('');

  el('body').innerHTML = head('Children', 'Active roster. Quit and Transfer Out are excluded everywhere.')
    + `<div class="stats" style="margin-bottom:14px">${classStrip}</div>
      <div class="panel" style="padding:14px 16px;margin-bottom:14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input class="in" id="kid-q" placeholder="Search name, father or UIN…" value="${esc(_kidQ)}" style="flex:1;min-width:220px">
          <select class="in" id="kid-prog" style="width:auto">
            <option value="all">All classes (${_kids.length})</option>
            ${PROGRAMS.filter(p=>countFor(p)).map(p=>`<option value="${p}" ${_kidProg===p?'selected':''}>${p} (${countFor(p)})</option>`).join('')}
          </select>
          <select class="in" id="kid-batch" style="width:auto">
            <option value="all">Both batches</option>
            <option value="Morning"   ${_kidBatch==='Morning'?'selected':''}>Morning</option>
            <option value="Afternoon" ${_kidBatch==='Afternoon'?'selected':''}>Afternoon</option>
            <option value="Unset"     ${_kidBatch==='Unset'?'selected':''}>Batch not set</option>
          </select>
          <select class="in" id="kid-sort" style="width:auto">
            <option value="newest" ${_kidSort==='newest'?'selected':''}>Newest admission first</option>
            <option value="oldest" ${_kidSort==='oldest'?'selected':''}>Oldest first</option>
            <option value="name"   ${_kidSort==='name'?'selected':''}>Name A–Z</option>
            <option value="due"    ${_kidSort==='due'?'selected':''}>Biggest balance</option>
          </select>
        </div>
      </div>

      <div class="panel"><div class="ptop"><h2>Roster</h2>
        <span class="hint"><strong>${rows.length}</strong> shown of ${_kids.length} active ·
          <span style="color:var(--good)">${rows.length-owing} fully paid</span> ·
          <span style="color:var(--crit)">${owing} still owe</span></span></div>
      <div class="tw"><table><thead><tr>
        <th>Child</th><th>Parents</th><th>Class</th><th>Batch</th><th>Admitted</th>
        <th class="r">Fee</th><th class="r">Collected</th><th class="r">Truly due</th><th></th></tr></thead><tbody>
        ${rows.length ? rows.map(r => {
          const paid = Number(r.true_due) <= 0;
          const part = !paid && Number(r.total_collected) > 0;
          const tint = paid ? 'background:var(--good-wash)' : (part ? 'background:var(--warn-wash)' : 'background:var(--crit-wash)');
          const bar  = paid ? 'var(--good)' : (part ? 'var(--warn)' : 'var(--crit)');
          const contacts = [r.parent_email1, r.parent_email2].filter(Boolean);
          const phones   = [r.mobile1, r.mobile2].filter(Boolean);
          return `<tr style="${tint}">
          <td style="border-left:3px solid ${bar}">
            <strong>${esc(r.student_name)}</strong>
            ${Number(r.our_discount) ? `<span class="chip c-mute" style="margin-left:6px">−${money(r.our_discount)}</span>`:''}
            ${Number(r.uncredited_cash) ? `<span class="chip c-warn" style="margin-left:4px">${money(r.uncredited_cash)} in hand</span>`:''}
            <br><span class="num" style="color:var(--muted);font-size:11px">${esc(r.uin)}</span></td>
          <td style="font-size:12px;color:var(--muted)">${esc(r.father_name || '—')}
            ${phones.length?`<br>${phones.map(p=>`<a href="tel:${esc(p)}" style="color:var(--muted)">${esc(p)}</a>`).join(' · ')}`:''}
            ${contacts.length?`<br>${contacts.map(e2=>`<a href="mailto:${esc(e2)}" style="color:var(--accent)">${esc(e2)}</a>`).join(' · ')}`
                             :'<br><span style="color:var(--faint)">no email on file</span>'}</td>
          <td>${esc(r.program_name)}</td>
          <td>${r.batch ? esc(r.batch) : `<select class="in" style="padding:2px 6px;font-size:12px;width:auto" onchange="setBatch('${esc(r.uin)}', this.value)">
                <option value="">—</option><option value="Morning">Morning</option><option value="Afternoon">Afternoon</option></select>`}</td>
          <td class="hint">${fmtDate(r.admission_date)}</td>
          <td class="r num">${money(r.total_invoiced)}</td>
          <td class="r num">${money(r.total_collected)}</td>
          <td class="r num" style="font-weight:700;color:${bar}">${paid ? 'Paid' : money(r.true_due)}</td>
          <td><a style="color:var(--accent);cursor:pointer;white-space:nowrap" onclick="app='admissions';tab='plans';renderApp();setTimeout(()=>openPlan('${esc(r.uin)}'),400)">Plan →</a></td>
        </tr>`;}).join('')
        : `<tr><td colspan="9" style="padding:26px;text-align:center;color:var(--muted)">No child matches that search.</td></tr>`}
      </tbody></table></div></div>`;

  // Wire the controls (preserve caret position in the search box)
  const qEl = el('kid-q');
  qEl.oninput = () => { _kidQ = qEl.value; const pos = qEl.selectionStart; renderChildren();
    const n = el('kid-q'); n.focus(); n.setSelectionRange(pos, pos); };
  el('kid-prog').onchange  = e => { _kidProg  = e.target.value; renderChildren(); };
  el('kid-batch').onchange = e => { _kidBatch = e.target.value; renderChildren(); };
  el('kid-sort').onchange  = e => { _kidSort  = e.target.value; renderChildren(); };
}

async function setBatch(uin, batch){
  if (!batch) return;
  const { error } = await getSb().schema('eurokids').from('child_batch')
    .upsert({ uin, batch, updated_at: new Date().toISOString() });
  if (error) return alert('Could not save batch: ' + error.message);
  const k = _kids.find(x => x.uin === uin); if (k) k.batch = batch;
  renderChildren();
}

/* ── cash in hand: money received but not yet posted into EPMS ─────────── */
/* ── liabilities: everything we have physically taken in ──────────
   Two obligations attach to money the moment it reaches us, and they move
   independently: cash has to reach the bank, and tuition has to reach
   EuroKids. Until tuition is posted onward, EPMS still shows it as due while
   we are the ones holding it — so only the un-posted part is netted off the
   parent's balance. Day care, uniform and event money never enters EPMS at
   all and never touches a fee.                                            */
let _liab = { recs: [], kids: [], byLabel: {} };

// A half-typed receipt must survive a trip to another tab. Kept in memory for
// the session and mirrored to localStorage so a stray refresh doesn't lose it.
const LB_FIELDS = ['lb-child','lb-name','lb-email','lb-phone','lb-purpose',
                   'lb-purpose-note','lb-mode','lb-amt','lb-on','lb-by'];
const lbDraftSave = () => {
  const d = { who: _liab.who };
  LB_FIELDS.forEach(id => { const e = el(id); if (e) d[id] = e.value; });
  _liab.draft = d;
  try { localStorage.setItem('ek-liab-draft', JSON.stringify(d)); } catch (_) {}
};
const lbDraftLoad = () => {
  if (_liab.draft) return _liab.draft;
  try { return JSON.parse(localStorage.getItem('ek-liab-draft') || 'null'); } catch (_) { return null; }
};
const lbDraftClear = () => {
  _liab.draft = null;
  try { localStorage.removeItem('ek-liab-draft'); } catch (_) {}
};

async function tabLiability(){
  el('body').innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  const [{ data: recs, error }, { data: kids }] = await Promise.all([
    s.schema('eurokids').from('receipt_offline').select('*').order('received_on', { ascending: false }).limit(2000),
    s.schema('eurokids').from('v_schedule').select('uin,student_name,program_name').order('student_name').limit(2000),
  ]);
  if (error) return el('body').innerHTML = fail(error);
  _liab.recs = recs || [];
  _liab.kids = kids || [];

  // "Name — Class" keeps two children of the same name apart.
  _liab.byLabel = {};
  const dupe = {};
  (kids || []).forEach(k => { dupe[k.student_name] = (dupe[k.student_name] || 0) + 1; });
  const options = (kids || []).map(k => {
    const label = `${k.student_name} — ${k.program_name || 'class ?'}`;
    _liab.byLabel[label.toLowerCase()] = k;
    return `<option value="${esc(label)}">`;
  }).join('');

  const sum = f => _liab.recs.filter(f).reduce((a, r) => a + Number(r.amount_rupees), 0);
  const heldForEuro = _liab.recs.filter(r => r.purpose === 'tuition')
    .reduce((a, r) => a + (Number(r.amount_rupees) - Number(r.remitted || 0)), 0);
  const notBanked = sum(r => r.mode === 'Cash' && !r.deposited_on);
  const otherMoney = sum(r => r.purpose !== 'tuition');

  el('body').innerHTML = head('Liabilities',
      'Money already in our hands. Cash still to reach the bank, fees still to reach EuroKids, and collections that were never EuroKids’ to begin with.')
    + `<div class="stats" style="margin-bottom:16px">
        <div class="stat crit"><div class="k">Owed to EuroKids</div><div class="v">${money(heldForEuro)}</div>
          <div class="m">Fee money taken but not yet posted</div></div>
        <div class="stat warn"><div class="k">Cash not banked</div><div class="v">${money(notBanked)}</div>
          <div class="m">Physically with us</div></div>
        <div class="stat"><div class="k">Other collections</div><div class="v">${money(otherMoney)}</div>
          <div class="m">Day care, uniform, events — ours, not EuroKids’</div></div>
      </div>

      <div class="panel" style="padding:18px">
        <h3 style="margin-bottom:12px">Record money received</h3>
        <div class="pill-row" style="margin-bottom:12px">
          <span class="chip on" id="lb-t-child" data-who="child" style="cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bone);padding:5px 11px">A school child</span>
          <span class="chip" id="lb-t-other" data-who="other" style="cursor:pointer;border:1px solid var(--line-2);padding:5px 11px">Someone else (day care, guest)</span>
        </div>

        <div id="lb-child-row" style="display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:end">
          <div class="fld" style="margin:0"><label>Child — type to search</label>
            <input class="in" id="lb-child" list="lb-kids" placeholder="Start typing a name…" autocomplete="off">
            <datalist id="lb-kids">${options}</datalist>
            <div class="hint" id="lb-child-hint">${(kids || []).length} children on the roll</div></div>
          <div class="fld" style="margin:0"><label>What is this for?</label>
            <select class="in" id="lb-purpose">
              <option value="tuition">Tuition / term fees</option>
              <option value="other">Something else…</option></select></div>
        </div>

        <div id="lb-other-row" style="display:none;grid-template-columns:1.4fr 1.4fr 1fr;gap:10px;align-items:end">
          <div class="fld" style="margin:0"><label>Who paid — name</label>
            <input class="in" id="lb-name" placeholder="e.g. Aarav (day care only)"></div>
          <div class="fld" style="margin:0"><label>Their email — for the receipt</label>
            <input class="in" id="lb-email" type="email" placeholder="optional"></div>
          <div class="fld" style="margin:0"><label>Phone</label>
            <input class="in" id="lb-phone" placeholder="optional"></div>
        </div>

        <div class="fld" id="lb-purpose-note-wrap" style="display:none;margin:10px 0 0">
          <label>What is it for?</label>
          <input class="in" id="lb-purpose-note" placeholder="e.g. Day care August · Uniform · Class photographs · Annual function">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:10px;align-items:end;margin-top:10px">
          <div class="fld" style="margin:0"><label>Mode</label>
            <select class="in" id="lb-mode"><option>Cash</option><option>UPI</option><option>Cheque</option><option>Other</option></select></div>
          <div class="fld" style="margin:0"><label>Amount</label><input class="in num" id="lb-amt" type="number" min="1"></div>
          <div class="fld" style="margin:0"><label>Received on</label><input class="in" id="lb-on" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="fld" style="margin:0"><label>Received by</label><input class="in" id="lb-by" placeholder="who took it"></div>
        </div>
        <label id="lb-receipt-label" style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px">
          <input type="checkbox" id="lb-receipt" checked> Email a receipt straight away<span id="lb-receipt-hint" class="hint"></span>
        </label>
        <div id="lb-msg" style="margin-top:10px"></div>
        <button class="btn" id="lb-add" style="margin-top:12px">Record it</button>
      </div>

      <div class="panel" style="margin-top:16px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input class="in" id="lb-q" placeholder="Search a name…" style="max-width:260px">
        <select class="in" id="lb-f" style="max-width:230px">
          <option value="">Everything</option>
          <option value="owed">Still owed to EuroKids</option>
          <option value="cash">Cash not yet banked</option>
          <option value="other">Other collections</option>
          <option value="done">Fully posted</option>
        </select>
      </div>

      <div class="panel" style="margin-top:14px"><div class="ptop"><h2 id="lb-h">Receipts</h2>
        <span class="hint">Posting to EuroKids is matched automatically on the next sync</span></div>
        <div class="tw"><table><thead><tr><th>Who</th><th>For</th><th>Mode</th><th class="r">Amount</th>
          <th class="r">Still held</th><th>Received</th><th>By</th><th>Banked</th><th></th></tr></thead>
        <tbody id="lb-rows"></tbody></table></div></div>`;

  // ── who-is-paying toggle ────────────────────────────────────────────────
  const setWho = who => {
    _liab.who = who;
    const on = id => { const e = el(id); e.style.background = 'var(--ink)'; e.style.color = 'var(--bone)'; e.style.borderColor = 'var(--ink)'; };
    const off = id => { const e = el(id); e.style.background = 'transparent'; e.style.color = 'var(--ink)'; e.style.borderColor = 'var(--line-2)'; };
    if (who === 'child') { on('lb-t-child'); off('lb-t-other'); }
    else                 { on('lb-t-other'); off('lb-t-child'); }
    el('lb-child-row').style.display = who === 'child' ? 'grid' : 'none';
    el('lb-other-row').style.display = who === 'child' ? 'none' : 'grid';
    // Someone off the roll can never be paying EuroKids tuition.
    if (who !== 'child') { el('lb-purpose').value = 'other'; }
    togglePurposeNote();
    refreshReceiptTick();
  };
  // Don't offer to email a receipt when there is nowhere to send it.
  const refreshReceiptTick = () => {
    const box = el('lb-receipt'); if (!box) return;
    const hasAddress = _liab.who === 'child'
      ? !!_liab.byLabel[(el('lb-child').value || '').trim().toLowerCase()]
      : !!(el('lb-email').value || '').trim();
    box.disabled = !hasAddress;
    if (!hasAddress) box.checked = false;
    el('lb-receipt-label').style.opacity = hasAddress ? '1' : '.5';
    el('lb-receipt-hint').textContent = hasAddress ? ''
      : (_liab.who === 'child' ? ' — pick a child first'
                               : ' — add their email above to enable this');
  };
  const togglePurposeNote = () => {
    const other = _liab.who !== 'child' || el('lb-purpose').value === 'other';
    el('lb-purpose-note-wrap').style.display = other ? 'block' : 'none';
  };
  el('lb-t-child').onclick = () => { setWho('child'); lbDraftSave(); };
  el('lb-t-other').onclick = () => { setWho('other'); lbDraftSave(); };
  el('lb-purpose').onchange = () => { togglePurposeNote(); lbDraftSave(); };

  // Restore anything half-typed before the user wandered off.
  const draft = lbDraftLoad();
  setWho(draft?.who || 'child');
  if (draft) {
    LB_FIELDS.forEach(id => { const e = el(id); if (e && draft[id] != null) e.value = draft[id]; });
    togglePurposeNote();
    if (LB_FIELDS.some(id => id !== 'lb-on' && id !== 'lb-mode' && (draft[id] || '').trim())) {
      el('lb-msg').innerHTML = `<div class="hint" style="background:var(--warn-wash);color:var(--warn);padding:8px 11px;border-radius:8px">
        Picked up where you left off. <a href="#" id="lb-clear" style="color:inherit;font-weight:600">Clear it</a></div>`;
      el('lb-clear').onclick = ev => { ev.preventDefault(); lbDraftClear(); tabLiability(); };
    }
  }
  LB_FIELDS.forEach(id => {
    const e = el(id); if (!e) return;
    if (!e.oninput)  e.oninput  = lbDraftSave;
    if (!e.onchange) e.onchange = lbDraftSave;
  });
  refreshReceiptTick();

  el('lb-child').oninput = e => {
    const k = _liab.byLabel[(e.target.value || '').trim().toLowerCase()];
    el('lb-child-hint').textContent = k
      ? `${k.student_name} · ${k.program_name || 'class ?'}`
      : `${_liab.kids.length} children on the roll`;
    el('lb-child-hint').style.color = k ? 'var(--good)' : 'var(--muted)';
    refreshReceiptTick();
    lbDraftSave();
  };
  el('lb-email').oninput = () => { refreshReceiptTick(); lbDraftSave(); };

  // ── the list ────────────────────────────────────────────────────────────
  const paintRows = () => {
    const q = (el('lb-q').value || '').trim().toLowerCase();
    const f = el('lb-f').value;
    let rows = _liab.recs.filter(r => {
      const held = Number(r.amount_rupees) - Number(r.remitted || 0);
      if (q && !((r.student_name || '') + ' ' + (r.purpose_note || '')).toLowerCase().includes(q)) return false;
      if (f === 'owed'  && !(r.purpose === 'tuition' && held > 0.01)) return false;
      if (f === 'cash'  && !(r.mode === 'Cash' && !r.deposited_on)) return false;
      if (f === 'other' && r.purpose === 'tuition') return false;
      if (f === 'done'  && !(r.purpose === 'tuition' && held <= 0.01)) return false;
      return true;
    });
    el('lb-h').textContent = `${rows.length} receipt${rows.length === 1 ? '' : 's'}`;
    el('lb-rows').innerHTML = rows.map(r => {
      const held = Number(r.amount_rupees) - Number(r.remitted || 0);
      const isFee = r.purpose === 'tuition';
      return `<tr>
        <td><strong>${esc(r.student_name || '—')}</strong>${r.uin ? '' : ' <span class="chip c-mute">not on roll</span>'}
          ${r.receipt_sent_at ? '<br><span class="hint" style="font-size:10.5px">receipt emailed</span>' : ''}</td>
        <td>${isFee ? '<span class="chip c-good">Fees</span>'
                    : `<span class="chip c-mute">${esc(r.purpose_note || 'Other')}</span>`}</td>
        <td><span class="chip ${r.mode === 'Cash' ? 'c-warn' : 'c-mute'}">${esc(r.mode)}</span></td>
        <td class="r num" style="font-weight:600">${money(r.amount_rupees)}</td>
        <td class="r num">${isFee ? (held > 0.01
             ? `<span style="color:var(--crit);font-weight:600">${money(held)}</span>`
             : '<span class="chip c-good">posted</span>') : '—'}</td>
        <td class="hint">${r.received_on ? new Date(r.received_on+'T00:00:00Z').toLocaleDateString('en-IN',{day:'2-digit',month:'short',timeZone:'UTC'}) : '—'}</td>
        <td class="hint">${esc(r.received_by || '—')}</td>
        <td><input class="in" type="date" value="${r.deposited_on || ''}" style="padding:3px 6px;font-size:12px;width:auto"
              onchange="setDeposited(${r.id}, this.value)"></td>
        <td style="white-space:nowrap">
          ${r.uin ? `<a style="color:var(--accent);cursor:pointer" onclick="openStatement('${esc(r.uin)}')">Statement</a> · ` : ''}
          ${r.uin ? `<a style="color:var(--accent);cursor:pointer" onclick="sendReceipt(${r.id}, this)">Receipt</a> · ` : ''}
          <a style="color:var(--crit);cursor:pointer" onclick="delReceipt(${r.id})">Remove</a></td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--muted)">Nothing matches.</td></tr>`;
  };
  paintRows();
  el('lb-q').oninput = paintRows;
  el('lb-f').onchange = paintRows;

  // ── record ──────────────────────────────────────────────────────────────
  el('lb-add').onclick = async e => {
    const btn = e.currentTarget;
    const amt = Number(el('lb-amt').value) || 0;
    const say = (h, c='err') => el('lb-msg').innerHTML = `<div class="${c}">${h}</div>`;
    if (amt <= 0) return say('Enter an amount.');

    let uin = null, name = null, purpose = 'other', email = null, phone = null;
    if (_liab.who === 'child') {
      const k = _liab.byLabel[(el('lb-child').value || '').trim().toLowerCase()];
      if (!k) return say('Pick a child from the list — start typing and choose a suggestion.');
      uin = k.uin; name = k.student_name; purpose = el('lb-purpose').value;
    } else {
      name = (el('lb-name').value || '').trim();
      if (!name) return say('Whose money is this? Enter a name.');
      email = (el('lb-email').value || '').trim().toLowerCase() || null;
      phone = (el('lb-phone').value || '').trim() || null;
    }
    const note = (el('lb-purpose-note').value || '').trim();
    if (purpose === 'other' && !note) return say('Say what this payment is for.');

    btn.disabled = true; say('Saving…', 'hint');
    const { data, error } = await getSb().schema('eurokids').from('receipt_offline').insert({
      uin, student_name: name, purpose, purpose_note: purpose === 'other' ? note : null,
      mode: el('lb-mode').value, amount_rupees: amt,
      received_on: el('lb-on').value, received_by: el('lb-by').value || null,
      payer_email: email, payer_phone: phone,
    }).select('id').maybeSingle();
    if (error) {
      btn.disabled = false;
      // Surface the real reason — a silent failure here loses real money records.
      return say(`Could not save: ${esc(error.message)}${error.hint ? ' — ' + esc(error.hint) : ''}`);
    }

    lbDraftClear();
    const canEmail = el('lb-receipt').checked && data?.id && (uin || email);
    if (canEmail) {
      const r = await feesApi('/api/fees/payment-receipt', { receipt_id: data.id });
      say(r.ok ? `Recorded. Receipt emailed to ${esc((r.sent_to || []).join(', '))}.`
               : `Recorded, but the receipt did not send: ${esc(r.error || '')}`,
          r.ok ? 'ok' : 'err');
      setTimeout(tabLiability, 1600);
    } else {
      tabLiability();
    }
  };
}

async function sendReceipt(id, a){
  const was = a.textContent; a.textContent = 'sending…';
  const r = await feesApi('/api/fees/payment-receipt', { receipt_id: id });
  a.textContent = r.ok ? 'sent ✓' : 'failed';
  if (!r.ok) alert(r.error || 'Could not send the receipt.');
  setTimeout(() => { a.textContent = was; }, 2500);
}

async function openStatement(uin){
  const s = getSb();
  const [{ data: c }, { data: led }, { data: items }] = await Promise.all([
    s.schema('eurokids').from('v_schedule').select('*').eq('uin', uin).maybeSingle(),

  const epmsGot = Number(c.collected || 0);

    return `<tr><td class="hint">${d(l.on_date)}</td>
      <td>${esc(l.description)}${l.source === 'offline' ? ` <span class="chip c-mute">${esc(l.mode)}</span>` : ''}

  el('plan-editor') || document.body.insertAdjacentHTML('beforeend', '<div id="plan-editor"></div>');

    document.body.insertAdjacentHTML('beforeend', '<div id="stmt"></div>'); return el('stmt');
  })();
  box.innerHTML = `
  <div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow:auto;padding:28px"
       onclick="if(event.target===this)this.remove()">
    <div style="max-width:760px;margin:0 auto;background:var(--card);border-radius:14px;padding:26px">
      <div class="ph" style="margin-bottom:16px"><div>
        <h1 style="font-size:22px">${esc(c.student_name)}</h1>
        <div class="s">${esc(c.program_name || '')}${c.batch ? ' · ' + esc(c.batch) : ''} · ${esc(uin)}</div></div>
        <button class="btn sm line" onclick="el('stmt').remove()">Close</button></div>

      <table style="width:100%;border-collapse:collapse;font-size:14px">
        ${row('Fee for the year', money(c.total_fee || fee))}
        ${disc > 0 ? row('Our discount (out of our margin)', '<span style="color:var(--good)">− ' + money(disc) + '</span>') : ''}
        ${row('<strong>Final payable</strong>', '<strong>' + money(fee) + '</strong>', 'border-top:1px solid var(--line)')}
      </table>

      <div style="font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px">Payments received</div>
      <div class="tw"><table><thead><tr><th>Date</th><th>What</th><th class="r">Amount</th><th class="r">Balance</th></tr></thead>
        <tbody>${movement || `<tr><td colspan="4" style="padding:16px;text-align:center;color:var(--muted)">Nothing received yet.</td></tr>`}</tbody></table></div>

      <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:16px">
        ${row('Recorded by EuroKids', money(epmsGot))}
        ${held > 0 ? row('With us, not yet posted to EuroKids', '<span style="color:var(--warn)">' + money(held) + '</span>') : ''}
        <tr><td style="padding:11px 0;border-top:2px solid var(--ink);font-weight:700">Balance due</td>
            <td class="r num" style="padding:11px 0;border-top:2px solid var(--ink);font-weight:700;font-size:17px">${money(owed)}</td></tr>
        ${c.next_due_date && owed > 1 ? `<tr><td colspan="2" class="hint" style="padding-top:6px">Next instalment due ${d(c.next_due_date)}</td></tr>` : ''}
      </table>

      ${held > 0 ? `<div class="hint" style="background:var(--warn-wash);color:var(--warn);padding:10px 13px;border-radius:9px;margin-top:12px">
        EuroKids still shows ${money(c.epms_due)} outstanding because ${money(held)} of this family's money has not been posted to them yet.
        The balance above is the honest one — do not chase them for it.</div>` : ''}

      ${other.length ? `<div style="font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px">Other collections — not fees</div>
        <div class="tw"><table><thead><tr><th>Date</th><th>What</th><th>Mode</th><th class="r">Amount</th></tr></thead><tbody>
        ${other.map(l => `<tr><td class="hint">${d(l.on_date)}</td><td>${esc(l.description)}</td>
          <td><span class="chip c-mute">${esc(l.mode)}</span></td>
          <td class="r num">${money(l.amount)}</td></tr>`).join('')}</tbody></table></div>` : ''}

      ${items && items.length ? `<div style="font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px">Agreed schedule</div>
        <div class="tw"><table><thead><tr><th>Instalment</th><th>Due on</th><th class="r">Amount</th></tr></thead><tbody>
        ${items.map(i => `<tr><td>${esc(i.label || 'Payment ' + i.seq)}</td><td class="hint">${d(i.due_date)}</td>
          <td class="r num">${money(i.amount)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>
  </div>`;
}

/* ── payment plans: agreed fee, our discount, instalments, welcome letter ── */
let _planUin = null;

async function tabPlans(){
  el('body').innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  // One view now carries the fee, both term dues and the schedule state, so the
  // list can answer "who owes what, and is their plan set up" in a single read.
  const { data: kids, error } = await s.schema('eurokids').from('v_schedule')
    .select('uin,student_name,program_name,admission_date,final_fee,total_fee,'
          + 'term1_due,term2_due,true_due,welcome_sent_at,has_schedule,schedule_flag,next_due_date')
    .order('admission_date', { ascending: false, nullsFirst: false })
    .limit(2000);
  if (error) return el('body').innerHTML = fail(error);

  const CLASS_ORDER = ['play', 'nur', 'jr', 'sr'];
  const classRank = n => {
    const t = (n || '').toLowerCase();
    const i = CLASS_ORDER.findIndex(c => t.includes(c));
    return i < 0 ? 9 : i;
  };
  const withPlan = (kids || []).filter(k => Number(k.final_fee || 0) > 0).length;
  const flagChip = k =>
    !k.has_schedule ? '<span class="chip c-warn">no schedule</span>'
    : k.schedule_flag === 'OVERDUE' ? '<span class="chip c-crit">overdue</span>'
    : k.schedule_flag === 'SETTLED' ? '<span class="chip c-good">paid up</span>'
    : k.schedule_flag === 'DUE SOON' ? '<span class="chip c-mute">due soon</span>' : '';

  el('body').innerHTML = head('Fees &amp; Plans',
      'Agree the fee, record any discount out of your margin, set the instalment dates, then send the letter.')
    + `<div class="panel" style="padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input class="in" id="plan-q" placeholder="Find a child…" style="max-width:280px">
        <select class="in" id="plan-class" style="max-width:180px">
          <option value="">All classes</option>
          <option>Play Group</option><option>Nursery</option>
          <option>Junior KG</option><option>Senior KG</option></select>
        <select class="in" id="plan-sort" style="max-width:210px">
          <option value="new">Newest admission first</option>
          <option value="class">Class, then name</option>
          <option value="due">Most owed first</option>
          <option value="missing">Needs a schedule first</option></select>
      </div>
      <div class="panel"><div class="ptop"><h2 id="plan-h">All children</h2>
        <span class="hint">${withPlan} of ${(kids||[]).length} have a fee agreed</span></div>
        <div class="tw"><table><thead><tr><th>Child</th><th>Class</th>
          <th class="r">Fee</th><th class="r">Term 1 due</th><th class="r">Term 2 due</th>
          <th class="r">Truly due</th><th>Status</th><th></th></tr></thead>
        <tbody id="plan-rows"></tbody></table></div></div>
      <div id="plan-editor"></div>`;

  const paint = () => {
    const q = (el('plan-q').value || '').trim().toLowerCase();
    const cls = el('plan-class').value.toLowerCase();
    const sort = el('plan-sort').value;
    let rows = (kids || []).filter(k =>
      (!q || (k.student_name || '').toLowerCase().includes(q) || (k.uin || '').toLowerCase().includes(q)) &&
      (!cls || classRank(k.program_name) === classRank(cls)));

    if (sort === 'class')        rows.sort((a,b) => classRank(a.program_name) - classRank(b.program_name) || (a.student_name||'').localeCompare(b.student_name||''));
    else if (sort === 'due')     rows.sort((a,b) => Number(b.true_due||0) - Number(a.true_due||0));
    else if (sort === 'missing') rows.sort((a,b) => (a.has_schedule?1:0) - (b.has_schedule?1:0) || Number(b.true_due||0) - Number(a.true_due||0));

    el('plan-h').textContent = `${rows.length} ${rows.length === 1 ? 'child' : 'children'}`;
    el('plan-rows').innerHTML = rows.map(k => {
      const fee = Number(k.final_fee || 0);
      return `<tr><td><strong>${esc(k.student_name)}</strong><br>
          <span class="num" style="color:var(--muted);font-size:11px">${esc(k.uin)}</span></td>
        <td>${esc(k.program_name || '')}</td>
        <td class="r num">${fee > 0 ? money(fee) : '<span class="chip c-warn">not set</span>'}</td>
        <td class="r num">${Number(k.term1_due) > 0 ? money(k.term1_due) : '—'}</td>
        <td class="r num">${Number(k.term2_due) > 0 ? money(k.term2_due) : '—'}</td>
        <td class="r num" style="font-weight:600">${Number(k.true_due) > 0 ? money(k.true_due) : '—'}</td>
        <td>${flagChip(k)}${k.welcome_sent_at ? ' <span class="chip c-mute">letter sent</span>' : ''}</td>
        <td><a style="color:var(--accent);cursor:pointer" onclick="openPlan('${esc(k.uin)}')">${fee > 0 ? 'Open' : 'Set up'} →</a></td></tr>`;
    }).join('') || `<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--muted)">No match.</td></tr>`;
  };
  paint();
  ['plan-q','plan-class','plan-sort'].forEach(id => {
    el(id).oninput = paint; el(id).onchange = paint;
  });
}

async function openPlan(uin){
  _planUin = uin;
  const s = getSb();
  const [{ data: kid }, { data: plan }, { data: items }, { data: contact }] = await Promise.all([
    s.schema('eurokids').from('v_schedule')
      .select('student_name,father_name,program_name,epms_invoiced,term1_due,term2_due,true_due,collected,schedule_flag')
      .eq('uin', uin).maybeSingle(),
    s.schema('eurokids').from('payment_plan').select('*').eq('uin', uin).maybeSingle(),
    s.schema('eurokids').from('payment_plan_item').select('seq,amount,due_date,label').eq('uin', uin).order('seq'),
    s.schema('eurokids').from('child_contact').select('*').eq('uin', uin).maybeSingle(),
  ]);
  const it = items && items.length ? items : [{ seq:1, amount:'', due_date:'' }];
  const total = plan?.total_fee ?? kid?.epms_invoiced ?? 0;

  el('plan-editor').innerHTML = `
    <div class="panel" style="padding:20px;margin-top:16px">
      <div class="ptop" style="padding:0 0 12px"><h2>${esc(kid?.student_name||uin)}</h2>
        <span class="hint">${esc(kid?.program_name||'')} · ${esc(uin)}</span></div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px">
        <div class="fld"><label>Total fee (EPMS)</label><input class="in num" id="pf-total" type="number" value="${total}"></div>
        <div class="fld"><label>Our discount</label><input class="in num" id="pf-disc" type="number" value="${plan?.our_discount ?? 0}"></div>
        <div class="fld"><label>Final payable</label><input class="in num" id="pf-final" type="number" value="${plan?.final_fee ?? total}" readonly style="background:var(--bone);font-weight:700"></div>
      </div>

      <div class="hint" style="margin:16px 0 6px">Instalments — fill the earlier ones and the last is worked out for you.</div>
      <div id="pf-items"></div>
      <button class="btn line sm" id="pf-add" style="margin-top:8px">+ Add instalment</button>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin-top:16px">
        <div class="fld"><label>Parent email 1</label><input class="in" id="pf-em1" type="email" value="${esc(contact?.parent_email1||'')}"></div>
        <div class="fld"><label>Parent email 2</label><input class="in" id="pf-em2" type="email" value="${esc(contact?.parent_email2||'')}"></div>
      </div>
      <div class="fld" style="max-width:640px"><label>Note for the letter (optional)</label>
        <input class="in" id="pf-note" value="${esc(plan?.note||'')}" placeholder="e.g. Booking amount covers the welcome kit."></div>

      <div id="pf-msg"></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn" id="pf-save">Save plan</button>
        <button class="btn line" id="pf-send" data-kind="welcome">Save &amp; send welcome letter</button>
        <button class="btn line" id="pf-send2" data-kind="schedule">Send schedule only</button>
        <button class="btn line" id="pf-send3" data-kind="receipt">Send paid-in-full receipt</button>
        <button class="btn line" onclick="el('plan-editor').innerHTML=''">Close</button>
      </div>
      <div class="hint" style="margin-top:6px">The welcome letter is the warm first email. “Schedule only” is the plainer re-send when a parent asks for the terms again. Both cc admin@eurokidsjmdenclave.org.</div>
      ${plan?.welcome_sent_at ? `<div class="hint" style="margin-top:8px">Letter last sent ${new Date(plan.welcome_sent_at).toLocaleString('en-IN')}</div>` : ''}
    </div>`;

  let rows = it.map(x => ({ amount: x.amount ?? '', due_date: x.due_date ?? '' }));

  const drawItems = () => {
    el('pf-items').innerHTML = rows.map((r,i) => `
      <div style="display:grid;grid-template-columns:90px 1fr 1fr 40px;gap:10px;align-items:end;margin-bottom:8px;max-width:640px">
        <div class="hint" style="padding-bottom:9px">Payment ${i+1}</div>
        <div class="fld" style="margin:0"><label>Amount</label>
          <input class="in num pf-amt" data-i="${i}" type="number" value="${r.amount}"></div>
        <div class="fld" style="margin:0"><label>Due date</label>
          <input class="in pf-due" data-i="${i}" type="date" value="${r.due_date}"></div>
        <div>${rows.length>1 ? `<button class="btn line sm pf-del" data-i="${i}" style="padding:6px 9px">✕</button>` : ''}</div>
      </div>`).join('');
    document.querySelectorAll('.pf-amt').forEach(x => x.oninput = e => { rows[+e.target.dataset.i].amount = e.target.value; autoLast(); });
    document.querySelectorAll('.pf-due').forEach(x => x.onchange = e => { rows[+e.target.dataset.i].due_date = e.target.value; });
    document.querySelectorAll('.pf-del').forEach(x => x.onclick = e => { rows.splice(+e.target.dataset.i,1); drawItems(); autoLast(); });
  };

  // final = total − discount; last instalment = final − everything before it
  const recalcFinal = () => {
    const t = Number(el('pf-total').value)||0, d = Number(el('pf-disc').value)||0;
    el('pf-final').value = Math.max(0, t - d);
  };
  const autoLast = () => {
    recalcFinal();
    const final = Number(el('pf-final').value)||0;
    if (rows.length < 2) { if (rows.length===1 && !rows[0].amount) { rows[0].amount = final;
      const f = document.querySelector('.pf-amt[data-i="0"]'); if (f) f.value = final; } return; }
    const head = rows.slice(0,-1).reduce((a,r)=>a + (Number(r.amount)||0), 0);
    const last = Math.max(0, final - head);
    rows[rows.length-1].amount = last;
    const lastEl = document.querySelector(`.pf-amt[data-i="${rows.length-1}"]`);
    if (lastEl) lastEl.value = last;
  };

  drawItems(); autoLast();
  el('pf-total').oninput = autoLast;
  el('pf-disc').oninput  = autoLast;
  el('pf-add').onclick = () => { if (rows.length >= 5) return alert('Five instalments is the maximum.');
    rows.push({ amount:'', due_date:'' }); drawItems(); autoLast(); };

  const savePlan = async () => {
    const total = Number(el('pf-total').value)||0, disc = Number(el('pf-disc').value)||0;
    const final = Math.max(0, total - disc);
    const clean = rows.filter(r => Number(r.amount) > 0 && r.due_date);
    if (!clean.length) { el('pf-msg').innerHTML = '<div class="err">Add at least one instalment with an amount and a date.</div>'; return false; }
    const sum = clean.reduce((a,r)=>a+Number(r.amount),0);
    if (Math.abs(sum - final) > 1) { el('pf-msg').innerHTML = `<div class="err">Instalments add to ${money(sum)} but the final fee is ${money(final)}.</div>`; return false; }

    const s = getSb();
    const p = await s.schema('eurokids').from('payment_plan').upsert({
      uin: _planUin, total_fee: total, our_discount: disc, final_fee: final,
      note: el('pf-note').value || null, updated_at: new Date().toISOString() }, { onConflict: 'uin' });
    if (p.error) { el('pf-msg').innerHTML = `<div class="err">${esc(p.error.message)}</div>`; return false; }

    await s.schema('eurokids').from('payment_plan_item').delete().eq('uin', _planUin);
    const ins = await s.schema('eurokids').from('payment_plan_item')
      .insert(clean.map((r,i) => ({ uin: _planUin, seq: i+1, amount: Number(r.amount), due_date: r.due_date })));
    if (ins.error) { el('pf-msg').innerHTML = `<div class="err">${esc(ins.error.message)}</div>`; return false; }

    // keep the discount tab in step
    if (disc > 0) await s.schema('eurokids').from('child_discount')
      .upsert({ uin: _planUin, amount_rupees: disc, reason: 'Payment plan' }, { onConflict: 'uin' });

    await s.schema('eurokids').from('child_contact').upsert({
      uin: _planUin, parent_email1: el('pf-em1').value.trim() || null,
      parent_email2: el('pf-em2').value.trim() || null, updated_at: new Date().toISOString() }, { onConflict: 'uin' });
    return true;
  };

  el('pf-save').onclick = async () => {
    el('pf-msg').innerHTML = '';
    if (await savePlan()) { el('pf-msg').innerHTML = '<div class="ok-msg" style="background:var(--good-wash);color:var(--good);padding:9px 12px;border-radius:8px;margin-top:10px">Plan saved.</div>'; tabPlans(); }
  };

  const sendLetter = async (btn) => {
    el('pf-msg').innerHTML = '';
    if (!(await savePlan())) return;
    const kind = btn.dataset.kind, label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const { data: { session: sess } } = await getSb().auth.getSession();
      const r = await fetch('/api/fees/welcome-email', { method:'POST',
        headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${sess.access_token}` },
        body: JSON.stringify({ uin: _planUin, kind }) });
      const j = await r.json();
      el('pf-msg').innerHTML = j.ok
        ? `<div style="background:var(--good-wash);color:var(--good);padding:9px 12px;border-radius:8px;margin-top:10px">Sent to ${j.sent_to.join(', ')} (cc ${j.cc}).</div>`
        : `<div class="err">${esc(j.error||'Could not send')}</div>`;
    } catch(e) { el('pf-msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    btn.disabled = false; btn.textContent = label;
  };
  el('pf-send').onclick  = e => sendLetter(e.currentTarget);
  el('pf-send2').onclick = e => sendLetter(e.currentTarget);
  el('pf-send3').onclick = e => sendLetter(e.currentTarget);

  el('plan-editor').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ── discounts: where the phantom dues get corrected ──── */

  el('body').innerHTML = head('Discounts', 'Money you took off your own margin. EPMS never sees these, so it keeps showing them as due.')
    + `<div class="panel"><div class="ptop"><h2>Per-child discount</h2>
        <span class="hint">Type an amount and press Enter. Everything recalculates.</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th>
        <th class="r">EPMS says due</th><th style="width:150px">Our discount</th>
        <th class="r">Truly due</th><th>Reason</th></tr></thead><tbody>
        ${(rows || []).map(r => `<tr data-uin="${esc(r.uin)}">
          <td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
          <td class="r num" style="color:var(--faint)">${money(r.epms_due)}</td>
          <td><input class="in num disc" type="number" min="0" value="${Number(r.our_discount) || ''}" placeholder="0"></td>
          <td class="r num truedue" style="font-weight:600">${money(r.true_due)}</td>
          <td><input class="in reason" value="${esc(byUin[r.uin]?.reason || '')}" placeholder="optional"></td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  document.querySelectorAll('tr[data-uin]').forEach(tr => {
    const uin = tr.dataset.uin;
    const amt = tr.querySelector('.disc'), reason = tr.querySelector('.reason');
    const save = async () => {
      const v = Number(amt.value) || 0;
      const { error } = await getSb().schema('eurokids').from('child_discount')
        .upsert({ uin, amount_rupees: v, reason: reason.value || null }, { onConflict: 'uin' });
      amt.style.borderColor = error ? 'var(--crit)' : 'var(--good)';
      if (!error) { tab = 'discounts'; setTimeout(() => renderApp(), 350); }
    };
    amt.onkeydown = e => { if (e.key === 'Enter') save(); };
    amt.onblur = save;
    reason.onkeydown = e => { if (e.key === 'Enter') save(); };
  });
}

/* ── kits: eligibility, never amounts ─────────────────── */
async function tabKits(){
  const { data, error } = await getSb().schema('eurokids').from('v_kit_worklist')
    .select('uin,student_name,program_name,paid_enough_for_kit,dispatched_on,lr_number,handed_over_on,state')
    .order('state');
  if (error) return el('body').innerHTML = fail(error);
  const label = { handed_over:['c-good','Handed over'], ready_to_hand_over:['c-warn','Ready to hand over'],
                  awaiting_dispatch:['c-mute','Awaiting dispatch'], payment_short:['c-crit','Payment short'] };
  const ready = (data || []).filter(r => r.state === 'ready_to_hand_over').length;
  el('body').innerHTML = head('Kits', 'EPMS knows the kit was dispatched. Only we know it reached the parent.')
    + `<div class="panel"><div class="ptop"><h2>Handover worklist</h2>
        <span class="chip ${ready ? 'c-warn' : 'c-mute'}">${ready} ready</span></div>
      <div class="tw"><table><thead><tr><th>Child</th><th>Program</th><th>Consignment</th>
        <th>Dispatched</th><th>State</th></tr></thead><tbody>
        ${(data || []).slice(0, 60).map(r => {
          const [cls, txt] = label[r.state] || ['c-mute', r.state];
          return `<tr><td>${esc(r.student_name)}</td><td>${esc(r.program_name)}</td>
            <td class="num" style="color:var(--muted)">${esc(r.lr_number || '—')}</td>
            <td>${esc(r.dispatched_on || '—')}</td>
            <td><span class="chip ${cls}">${txt}</span></td></tr>`;
        }).join('')}
      </tbody></table></div></div>`;
}

/* ── fee reference ────────────────────────────────────── */
async function tabFees(){
  const { data, error } = await getSb().schema('eurokids').from('fee_grid')
    .select('epms_program_id,joining_month,discount_code,total_fee')
    .eq('discount_code', 'none').order('epms_program_id').order('joining_month');
  if (error) return el('body').innerHTML = fail(error);
  const PROG = { 24:'Play Group', 25:'Nursery', 26:'Euro Junior', 27:'Euro Senior' };
  const months = [...new Set((data || []).map(r => r.joining_month))];
  const grid = {};
  (data || []).forEach(r => { (grid[r.epms_program_id] ||= {})[r.joining_month] = r.total_fee; });
  const fmt = m => new Date(m + 'T00:00:00').toLocaleDateString('en-GB', { month:'short', year:'2-digit' });
  el('body').innerHTML = head('Fee Reference', 'All 288 combinations, read out of the EPMS Fee Calculator.')
    + `<div class="panel"><div class="ptop"><h2>Full-year fee by joining month</h2>
        <span class="chip c-good">exact, not modelled</span></div>
      <div class="tw"><table><thead><tr><th>Program</th>
        ${months.map(m => `<th class="r">${fmt(m)}</th>`).join('')}</tr></thead><tbody>
        ${Object.keys(grid).map(p => `<tr><td style="font-weight:500">${PROG[p] || p}</td>
          ${months.map(m => `<td class="r num">${Number(grid[p][m]).toLocaleString('en-IN')}</td>`).join('')}
        </tr>`).join('')}
      </tbody></table></div>
      <div class="pbody hint">No discount applied. The fee steps down in six bands because Term 2 falls away
        from October and tuition pro-rates after that.</div></div>`;
}

boot();
</script>
</body>
</html>

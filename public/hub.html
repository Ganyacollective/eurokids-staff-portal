<style>
:root{
  --bone:#FFFFFF; --card:#FFF; --ink:#1A1A1A; --muted:#6B6B6B; --faint:#9A968F;
  --line:#E8EAED; --line-2:#CBD0D6; --brand:#FF2217; --accent:#1F4FD8; --accent-wash:#EAF0FF; --bar:#000;
  --good:#1E7A4B; --good-wash:#E8F3ED; --warn:#9A6410; --warn-wash:#FAF0DF;
  --crit:#B32519; --crit-wash:#FBEBE9; --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:Inter,-apple-system,"Helvetica Neue",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{height:26px;background:var(--bar)}
.chrome{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;gap:16px;flex-wrap:wrap}
@media(max-width:560px){.chrome{padding:14px 18px}}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px}
.dot{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#FF7A5C,var(--brand) 62%,#A81E12);filter:blur(.4px)}
.chromeR{display:flex;align-items:center;gap:20px;font-size:13.5px;color:var(--muted)}
.chromeR a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stage{max-width:1180px;margin:0 auto;padding:0 34px 90px}
@media(max-width:560px){.stage{padding:0 18px 60px}}
.chooser{min-height:60vh;display:flex;flex-direction:column;justify-content:center;max-width:940px}
.hello{font-size:46px;font-weight:700;letter-spacing:-.035em}
.askline{color:var(--muted);font-size:16px;margin-top:6px}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:22px;margin-top:38px}
.door{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(26,26,26,.06),0 4px 14px -6px rgba(26,26,26,.08);transition:box-shadow .18s,transform .18s,border-color .18s;width:100%}
.door:hover:not(.shut){box-shadow:0 6px 22px rgba(26,26,26,.09);transform:translateY(-2px);border-color:var(--line-2)}
.door h3{font-size:19px;font-weight:600}
.door p{margin:0;color:var(--muted);font-size:14px}
.door .open{color:var(--accent);font-weight:500;margin-top:8px}
.door.shut{background:transparent;cursor:not-allowed;box-shadow:none}
.door.shut h3,.door.shut p,.door.shut .open{color:var(--faint)}
.doorwrap{position:relative;display:flex}
.soon{position:absolute;top:22px;right:22px;font-size:11.5px;color:var(--faint);background:var(--bone);border-radius:999px;padding:3px 11px}
.crumb{display:flex;align-items:center;gap:9px;padding:22px 0 6px;font-size:13.5px;color:var(--muted)}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;font-weight:700}
.ph .s{color:var(--muted);font-size:14px;margin-top:4px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:7px}
.stat .m{font-size:12px;color:var(--muted);margin-top:4px}
.stat.acc .v{color:var(--accent)} .stat.good .v{color:var(--good)}
.stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--crit)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.ptop{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ptop h2{font-size:15px;font-weight:600}
.pbody{padding:18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bone)}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px}
.c-good{background:var(--good-wash);color:var(--good)} .c-warn{background:var(--warn-wash);color:var(--warn)}
.c-crit{background:var(--crit-wash);color:var(--crit)} .c-mute{background:var(--bone);color:var(--faint)}
.c-acc{background:var(--accent-wash);color:var(--accent)}
.btn{background:var(--ink);color:var(--bone);border:0;border-radius:9px;padding:11px 18px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.87} .btn:disabled{opacity:.5;cursor:default}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.in{background:var(--bone);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.err{background:var(--crit-wash);color:var(--crit);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.ok{background:var(--good-wash);color:var(--good);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{cursor:pointer;border:1px solid var(--line-2);background:var(--bone);user-select:none;padding:5px 10px;font-size:12.5px;transition:.12s}
.chips .chip:hover{border-color:var(--ink)}
.chips .chip.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.chips .chip b{opacity:.55;font-weight:600;margin-left:2px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--line);font-size:12.5px;font-weight:500}
.pill.big{background:var(--ink);color:var(--bone);font-weight:600;font-size:13.5px}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--crit)}
code{background:var(--line);padding:1px 5px;border-radius:4px;font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.loading{color:var(--faint);padding:26px 0;font-size:13.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══════════════════════════════════════════════════════════════════
   Design system pass — Sept 2026
   Rules adopted (Apple HIG, WCAG 2.2, Stripe/Linear dashboards):
   · one primary action per view; secondary actions visibly bordered;
     destructive actions red and never in the primary slot
   · 44px minimum touch target on phones, 40px row rhythm on desktop
   · text ≥ 4.5:1 contrast, controls ≥ 3:1 — no grey-on-white hints
     for anything the user must read to act
   · tables: tabular numerals, sticky header, status as chips
   · tabs scroll horizontally on phones instead of wrapping into a cloud
   ═══════════════════════════════════════════════════════════════════ */
:root{ --muted:#5B5B5B; --faint:#8A8680; --line-2:#C9CDD3; }

/* buttons — secondary actions were transparent on white and disappeared */
.btn{min-height:44px;padding:10px 18px;font-weight:600;font-size:14px;line-height:1.2;
     display:inline-flex;align-items:center;justify-content:center;gap:6px;
     transition:background .12s,box-shadow .12s,transform .06s}
.btn:active{transform:translateY(1px)}
.btn.line{background:#F6F6F7;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.line:hover{background:#ECECEE;border-color:var(--ink);opacity:1}
.btn.ghost{background:#F6F6F7;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.danger{background:#FFFFFF;color:var(--crit);border:1.5px solid var(--crit)}
.btn.danger:hover{background:var(--crit);color:#fff;opacity:1}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* inputs — same height as buttons so rows line up */
.in{min-height:44px;font-size:15px}
select.in{padding-right:32px}

/* tabs — a scrolling strip on phones, underline on desktop */
.tabs{flex-wrap:wrap;overflow:visible;gap:2px;position:sticky;top:0;background:var(--bone);z-index:5;padding-top:4px}
.tab{white-space:nowrap;min-height:44px;padding:10px 14px;font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

/* chips that are controls must look pressable; status chips must not */
.chips .chip{min-height:36px;display:inline-flex;align-items:center;font-size:13px;padding:6px 12px}
.chips .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* tables */
table{font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--card);z-index:1}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
td,th{white-space:nowrap}
td:first-child{white-space:normal;min-width:160px}

/* readable hints — the old #9A968F was ~2.6:1 on white */
.hint{color:var(--muted)}
.err,.ok{font-size:14px;line-height:1.45}

/* links that act like buttons get a real hit area */
a[onclick]{display:inline-block;padding:6px 2px;min-height:32px;font-weight:600}

/* ─────────────────────────────────────────────────────────────────
   Visual pass 2 — quieter, denser, one voice.
   · numbers in the UI face with tabular figures; mono only for codes
   · red means brand or danger, never "click here"
   · rows are the target: hover, chevron, no red CTA on every line
   · headers stop shouting; panels stop nesting borders
   ───────────────────────────────────────────────────────────────── */
body{font-size:14px;letter-spacing:-.005em}
.num{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:0}
.code,.uin{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--faint);letter-spacing:.01em}

/* header */
.chrome{padding:14px 34px;border-bottom:1px solid var(--line)}
.crumb{margin:18px 0 6px;font-size:13px}
.crumb button{color:var(--muted);background:none;border:0;padding:0;cursor:pointer;font-weight:500}
.crumb button:hover{color:var(--ink)}
.ph{margin:22px 0 16px;align-items:center}
.ph h1{font-size:20px;font-weight:650;letter-spacing:-.01em}
.ph .s{font-size:13.5px;margin-top:2px;max-width:70ch}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* tabs */
.tabs{gap:0;border-bottom:1px solid var(--line);margin-bottom:0}
.tab{padding:12px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink);background:#FAFAFA}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.more{position:relative;margin-left:auto}
.menu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line-2);
      border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);min-width:200px;padding:6px;z-index:20}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button.on{background:#F3F4F6}

/* cards & panels — one border, no nesting */
.card,.panel,.stat{border:1px solid var(--line);box-shadow:none;border-radius:12px}
.panel{margin-bottom:16px}
.ptop{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptop h2{font-size:15px;font-weight:600}
.stats{gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em;color:var(--ink);margin-top:6px;font-family:inherit;font-variant-numeric:tabular-nums}
.stat .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.crit .v{color:var(--crit)}
.stat.good .v,.stat.warn .v,.stat.acc .v{color:var(--ink)}   /* only the critical number gets colour */

/* tables — the row is the control */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;
         padding:10px 14px;background:#FAFAFA;border-bottom:1px solid var(--line)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFBFC}
td strong{font-weight:600}
td .num,td.num{font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}

/* in-row actions: quiet by default, clear on hover */
a[onclick]{color:var(--ink);font-weight:500;text-decoration:none;padding:6px 0;border-radius:6px}
a[onclick]:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
td:last-child a[onclick]{color:var(--muted);font-weight:500}
td:last-child a[onclick]:hover{color:var(--accent)}
tbody tr:hover td:last-child a[onclick]{color:var(--ink)}

/* status chips: soft fills, no borders, one size */
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.01em}
.c-good{background:#E6F4EC;color:#146C3A} .c-warn{background:#FCF1DA;color:#8A5A00}
.c-crit{background:#FDE8E6;color:#A3231A} .c-mute{background:#F1F2F4;color:#4B5563}

/* buttons */
.btn{border-radius:10px;font-size:14px}
.btn.line,.btn.ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink);font-weight:500}
.btn.line:hover,.btn.ghost:hover{background:#F6F7F8;border-color:#9CA3AF}
.btn.sm{border-radius:8px}

/* inputs */
.in{border-color:var(--line-2);border-radius:10px;font-size:14px}
.in::placeholder{color:#9CA3AF}

/* hints & messages */
.hint{font-size:12.5px}
.err{background:#FDE8E6;color:#A3231A;border:0}
.ok{background:#E6F4EC;color:#146C3A;border:0}
.pill{background:#F1F2F4;font-weight:500}
.pill.big{background:var(--ink);color:#fff}

/* the sync line on the overview */
#sync-info{font-size:12.5px}

/* Users & access — chips wrapped into the next column and overlapped the date */
#users-table td:nth-child(2){white-space:normal;max-width:520px}
#users-table td:nth-child(2) .chip{margin:2px 4px 2px 0;display:inline-block}
#users-table td:nth-child(3){white-space:nowrap;color:var(--muted)}
#users-table td:last-child{white-space:nowrap}
.user-edit{background:#FAFBFC;border-top:1px solid var(--line);padding:14px 18px}
.user-edit label{margin-right:14px;font-size:14px}

/* phones */
@media(max-width:640px){
  .stage{padding:0 14px 40px}
  .ph h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px 13px}
  .stat .v{font-size:20px}
  .btn{width:100%}
  .btn.sm{width:auto}
  .card,.panel{border-radius:12px}
  [style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .pill-row{gap:6px}
  .pill{font-size:12px;padding:6px 10px}
  td:first-child{min-width:130px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Eurokids JMD — Hub
   The front door. Signs the user in once, then hands them to the
   app they are entitled to. Shares its auth storageKey with
   portal.html so one sign-in covers every page on this domain.

   What a person can see is decided by public.module_access, and
   enforced in Postgres by RLS — never here. This file only
   decides what to *draw*; the database decides what to *return*.
   ============================================================ */
const SUPABASE_URL = 'https://saqefzgnvznuurupqpsw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_u8v_dh1zMGdbrIQPMcxrFg_HCPJeUP9';

let sb = null, session = null, modules = [], profile = null;
let app = null, tab = 'overview', _loadMeFailed = false;

function getSb(){
  if (sb) return sb;
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'eurokids-portal-auth' }
  });
  return sb;
}
const money = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');

// Building an Intl formatter is expensive; doing it per row of a 2000-row table
// is most of the cost of drawing that table. Build each one once.
const _DF = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', timeZone:'UTC' });
const _DFY = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
const shortDate = d => d ? _DFY.format(new Date(d + 'T00:00:00Z')) : '—';
const longDate  = d => d ? _DFY.format(new Date(d + 'T00:00:00Z')) : '—';

// Typing in a search box should filter, not fire a render per keystroke.
function debounce(fn, ms = 160){
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// Tab payloads are reused for a short window, so bouncing between tabs stops
// re-issuing the same queries. Any write clears the cache for correctness.
const _cache = new Map();
const CACHE_TTL = 45000;
async function cached(key, loader){
  const hit = _cache.get(key);
  if (hit && Date.now() - hit.at < CACHE_TTL) return hit.val;
  const val = await loader();
  _cache.set(key, { at: Date.now(), val });
  return val;
}
const invalidate = (prefix) => {
  if (!prefix) return _cache.clear();
  [..._cache.keys()].filter(k => k.startsWith(prefix)).forEach(k => _cache.delete(k));
};
// Also escapes quotes: esc() is used inside double-quoted HTML attributes, so a
// child or parent name containing " would otherwise break out of the attribute.
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const has = m => modules.includes(m);
const el = id => document.getElementById(id);

const TABS = {
  overview:   { label: 'Overview', need: () => has('admission') || has('finance') },
  children:   { label: 'Children', need: () => has('finance') || has('admission') },
  views:      { label: 'Views', need: () => has('finance') || has('admission') },
  plans:      { label: 'Fees & Plans', need: () => has('finance') || has('admission') },
  compose:    { label: 'Send email', need: () => has('finance') || has('admission') },
  reminders:  { label: 'Reminders', need: () => has('finance') },
  liability:  { label: 'Liabilities', need: () => has('finance') },

/* ── boot ─────────────────────────────────────────────── */
async function boot(){
 try {
  // Home-screen shortcuts land here with ?open=liability / ?open=compose.
  const want = new URLSearchParams(location.search).get('open');
  if (want && TABS[want]) { app = 'admissions'; tab = want; }
  const { data } = await getSb().auth.getSession();
  session = data.session;
  if (session) await loadMe();
  paint();
  // Supabase fires this on TOKEN_REFRESHED too, which happens every time the
  // tab regains focus after being in the background. Repainting on that wiped
  // whatever the user was in the middle of. Only react when the identity
  // genuinely changes — a signed-in user is still the same user after their
  // token quietly renews.
 } catch (e) {
    el('stage').innerHTML = `<div class="err" style="margin:40px auto;max-width:520px">
      Could not start the app: ${esc(e.message)}
      <div style="margin-top:10px"><button class="btn sm" onclick="location.reload()">Try again</button></div></div>`;
    return;
 }

  getSb().auth.onAuthStateChange(async (event, s) => {
    const was = session?.user?.id;
    session = s;
    const now = s?.user?.id;
    if (was === now) return;                       // token refresh, nothing to redraw
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
    if (now) await loadMe();
    else { modules = []; profile = null; app = null; }
    paint();
  });
}

async function loadMe(){
  const s = getSb();
  const [{ data: mods, error: modErr }, { data: prof }] = await Promise.all([
    s.from('module_access').select('module').eq('user_id', session.user.id),
    s.from('profiles').select('role, full_name').eq('id', session.user.id).maybeSingle()
  ]);
  // A network blip used to render as "no modules granted", sending the owner to
  // an administrator to fix a problem that did not exist.
  _loadMeFailed = !!modErr;
  modules = (mods || []).map(r => r.module);
  profile = prof || null;
}

/* ── views: stack conditions like a Coda filter, save them, act on them ──
   Everything evaluates in the browser against the live roster, so a view is
   instant and can be tweaked while you look at it. A saved view is shared
   with everyone who can see fees.                                            */
const VIEW_FIELDS = [
  { k:'student_name',  l:'Child',                     t:'text' },
  { k:'program_name',  l:'Class',                     t:'enum' },
  { k:'batch',         l:'Batch',                     t:'enum' },
  { k:'schedule_flag', l:'Status',                    t:'enum' },
  { k:'agreed_fee',    l:'Agreed fee',                t:'num' },
  { k:'our_discount',  l:'Our discount',              t:'num' },
  { k:'term1_due',     l:'Term 1 due (EPMS)',         t:'num' },
  { k:'term2_due',     l:'Term 2 due (EPMS)',         t:'num' },
  { k:'epms_due',      l:'EPMS total due',            t:'num' },
  { k:'true_due',      l:'Truly due',                 t:'num' },
  { k:'collected',     l:'Collected by EPMS',         t:'num' },
  { k:'uncredited_cash', l:'Cash with us, not posted', t:'num' },
  { k:'paid_so_far',   l:'Paid so far',               t:'num' },
  { k:'next_amount',   l:'Next instalment amount',    t:'num' },
  { k:'next_due_date', l:'Next due date',             t:'date' },
  { k:'admission_date',l:'Admitted on',               t:'date' },
  { k:'days_overdue',  l:'Days overdue',              t:'num' },
  { k:'instalments',   l:'No. of instalments',        t:'num' },
  { k:'has_schedule',  l:'Has a schedule',            t:'bool' },
  { k:'schedule_mismatch', l:'Schedule does not add up', t:'bool' },
  { k:'welcome_sent_at', l:'Welcome letter sent',     t:'exists' },
  { k:'parent_email1', l:'Has parent email',          t:'exists' },
  { k:'eurokids_discount', l:'EuroKids discount label', t:'text' },
  { k:'father_name',   l:'Father',                    t:'text' },
];
const OPS = {
  num:   [['=','is'],['!=','is not'],['<','less than'],['<=','at most'],['>','more than'],['>=','at least'],['between','between']],
  date:  [['=','on'],['<','before'],['>','after'],['between','between'],['empty','is blank'],['notempty','is set']],
  text:  [['contains','contains'],['=','is'],['!=','is not'],['startswith','starts with'],['empty','is blank'],['notempty','is set']],
  enum:  [['=','is'],['!=','is not']],
  bool:  [['true','is yes'],['false','is no']],
  exists:[['notempty','yes'],['empty','no']],
};
let _views = { rows:[], list:[], conds:[], sort:{ field:'student_name', dir:'asc' }, current:null };

function evalCond(r, c){
  const f = VIEW_FIELDS.find(x => x.k === c.field); if (!f) return true;
  const raw = r[c.field];
  const isEmpty = raw == null || raw === '' || raw === false;
  switch (c.op) {
    case 'empty':     return isEmpty;
    case 'notempty':  return !isEmpty;
    case 'true':      return raw === true;
    case 'false':     return !raw;
  }
  if (f.t === 'num') {
    const v = Number(raw || 0), a = Number(c.value), b = Number(c.value2);
    switch (c.op) {
      case '=': return v === a; case '!=': return v !== a;
      case '<': return v < a;   case '<=': return v <= a;
      case '>': return v > a;   case '>=': return v >= a;
      case 'between': return v >= Math.min(a,b) && v <= Math.max(a,b);
    }
  }
  if (f.t === 'date') {
    const v = String(raw || ''), a = String(c.value || ''), b = String(c.value2 || '');
    if (!v) return false;
    switch (c.op) {
      case '=': return v === a; case '<': return v < a; case '>': return v > a;
      case 'between': return v >= a && v <= b;
    }
  }
  const v = String(raw ?? '').toLowerCase(), a = String(c.value ?? '').toLowerCase();
  switch (c.op) {
    case '=': return v === a; case '!=': return v !== a;
    case 'contains': return v.includes(a); case 'startswith': return v.startsWith(a);
  }
  return true;
}
const describeCond = c => {
  const f = VIEW_FIELDS.find(x => x.k === c.field); if (!f) return '';
  const op = (OPS[f.t] || []).find(o => o[0] === c.op)?.[1] || c.op;
  const fmt = v => f.t === 'num' ? money(v) : f.t === 'date' ? longDate(v) : v;
  const val = ['empty','notempty','true','false'].includes(c.op) ? ''
    : c.op === 'between' ? ` ${fmt(c.value)} and ${fmt(c.value2)}` : ` ${fmt(c.value)}`;
  return `${f.l} ${op}${val}`;
};

  _views.rows = rows || []; _views.list = list || [];
  const enumVals = k => [...new Set(_views.rows.map(r => r[k]).filter(v => v != null && v !== ''))].sort();

  b.innerHTML = head('Views',
      'Stack any conditions — every one must be true — then sort, save, export, or email the result. Like a Coda filter, on live data.')

            <input class="in" id="vw-name" placeholder="Name this view…" style="flex:1;min-width:200px">
            <button class="btn" id="vw-save">Save view</button>
            <button class="btn danger sm" id="vw-del" style="display:none">Delete</button>
          </div>
          <div class="chips" id="vw-quick" style="margin-top:14px"></div>
          <div id="vw-conds" style="margin-top:14px"></div>
          <button class="btn line sm" id="vw-add" style="margin-top:10px">+ Add condition</button>
        </div>
        <div class="card" style="padding:16px;margin-top:14px">
          <div class="pill-row" id="vw-summary"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center">
            <label class="lb" style="margin:0">Sort by</label>
            <select class="in" id="vw-sort" style="max-width:220px">${VIEW_FIELDS.map(f => `<option value="${f.k}">${f.l}</option>`).join('')}</select>
            <select class="in" id="vw-dir" style="max-width:130px"><option value="asc">ascending</option><option value="desc">descending</option></select>
            <span style="flex:1"></span>
            <button class="btn line sm" id="vw-print">Print list</button>
            <button class="btn line sm" id="vw-csv">Download CSV</button>
            <button class="btn sm" id="vw-mail">Email these families →</button>
          </div>
        </div>
        <div class="panel" style="margin-top:14px"><div class="tw"><table><thead><tr>
          <th>Child</th><th>Class</th><th class="r">Term 1 due</th><th class="r">Term 2 due</th>
          <th class="r">Discount</th><th class="r">Truly due</th><th>Status</th><th>Next due</th></tr></thead>
          <tbody id="vw-rows"></tbody></table></div></div>
      </div>
    </div>`;
  if (window.innerWidth < 720) el('vw-grid').style.gridTemplateColumns = '1fr';

  // ── saved views list
  const drawList = () => {
    el('vw-list').innerHTML = _views.list.map(v =>
      `<div class="chip ${_views.current?.id === v.id ? 'on' : ''}" data-id="${v.id}"
            style="display:block;margin:4px 0;cursor:pointer;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;white-space:normal">
         ${esc(v.name)}<div class="hint" style="font-size:11px;margin-top:2px">${(v.conditions||[]).length} condition${(v.conditions||[]).length===1?'':'s'}</div></div>`
    ).join('') || '<div class="hint">No saved views yet.</div>';
    document.querySelectorAll('#vw-list .chip').forEach(c => c.onclick = () => loadView(_views.list.find(v => v.id === Number(c.dataset.id))));
  };
  const loadView = v => {
    _views.current = v || null;
    _views.conds = JSON.parse(JSON.stringify(v?.conditions || []));
    _views.sort = { field: v?.sort_field || 'student_name', dir: v?.sort_dir || 'asc' };
    el('vw-name').value = v?.name || '';
    el('vw-sort').value = _views.sort.field; el('vw-dir').value = _views.sort.dir;
    el('vw-del').style.display = v ? '' : 'none';
    drawList(); drawConds(); run();
  };

  // ── condition rows
  const drawConds = () => {
    el('vw-conds').innerHTML = _views.conds.map((c, i) => {
      const f = VIEW_FIELDS.find(x => x.k === c.field) || VIEW_FIELDS[0];
      const ops = OPS[f.t];
      if (!ops.some(o => o[0] === c.op)) c.op = ops[0][0];
      const needsVal = !['empty','notempty','true','false'].includes(c.op);
      const valInput = !needsVal ? '' : f.t === 'enum'
        ? `<select class="in vw-val" data-i="${i}">${enumVals(f.k).map(v => `<option ${String(c.value)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`
        : `<input class="in vw-val" data-i="${i}" type="${f.t==='num'?'number':f.t==='date'?'date':'text'}" value="${esc(c.value ?? '')}" placeholder="${f.t==='num'?'amount':''}">`;
      const val2 = c.op === 'between' ? `<span class="hint">and</span><input class="in vw-val2" data-i="${i}" type="${f.t==='num'?'number':'date'}" value="${esc(c.value2 ?? '')}">` : '';
      return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <span class="hint" style="width:34px">${i === 0 ? 'Where' : 'and'}</span>
        <select class="in vw-field" data-i="${i}" style="max-width:230px">${VIEW_FIELDS.map(x => `<option value="${x.k}" ${x.k===c.field?'selected':''}>${x.l}</option>`).join('')}</select>
        <select class="in vw-op" data-i="${i}" style="max-width:150px">${ops.map(o => `<option value="${o[0]}" ${o[0]===c.op?'selected':''}>${o[1]}</option>`).join('')}</select>
        ${valInput}${val2}
        <button class="btn line sm vw-rm" data-i="${i}" title="Remove">✕</button>
      </div>`;
    }).join('') || '<div class="hint">No conditions — showing every child. Add one to narrow it down.</div>';
    const bind = (cls, fn) => document.querySelectorAll(cls).forEach(e => { e.onchange = ev => { fn(Number(ev.target.dataset.i), ev.target.value); }; if (e.tagName === 'INPUT') e.oninput = e.onchange; });
    bind('.vw-field', (i, v) => { _views.conds[i] = { field: v, op: OPS[VIEW_FIELDS.find(x=>x.k===v).t][0][0], value: '' }; drawConds(); run(); });
    bind('.vw-op',    (i, v) => { _views.conds[i].op = v; drawConds(); run(); });
    bind('.vw-val',   (i, v) => { _views.conds[i].value = v; run(); });
    bind('.vw-val2',  (i, v) => { _views.conds[i].value2 = v; run(); });
    document.querySelectorAll('.vw-rm').forEach(e => e.onclick = () => { _views.conds.splice(Number(e.dataset.i), 1); drawConds(); run(); });
  };
  el('vw-add').onclick = () => { _views.conds.push({ field:'true_due', op:'>', value:0 }); drawConds(); run(); };

  // One click for the questions asked every day. Each replaces the conditions.
  const QUICK = [
    ['Paid up',      [{ field:'schedule_flag', op:'=', value:'SETTLED' }]],
    ['Still owing',  [{ field:'true_due', op:'>', value:0 }]],
    ['Overdue',      [{ field:'schedule_flag', op:'=', value:'OVERDUE' }]],
    ['Due soon',     [{ field:'schedule_flag', op:'=', value:'DUE SOON' }]],
    ['No schedule',  [{ field:'has_schedule', op:'false', value:'' }]],
    ['Everyone',     []],
  ];
  const drawQuick = () => {
    el('vw-quick').innerHTML = QUICK.map(([l, c], i) => {
      const count = _views.rows.filter(r => c.every(x => evalCond(r, x))).length;
      const on = JSON.stringify(c) === JSON.stringify(_views.conds);
      return `<span class="chip ${on?'on':''}" data-i="${i}">${l} <b>${count}</b></span>`;
    }).join('');
    document.querySelectorAll('#vw-quick .chip').forEach(ch => ch.onclick = () => {
      _views.conds = JSON.parse(JSON.stringify(QUICK[Number(ch.dataset.i)][1]));
      _views.current = null; el('vw-name').value = ''; el('vw-del').style.display = 'none';
      drawList(); drawConds(); run();
    });
  };

  // ── evaluate + draw
  const matched = () => {
    let rows = _views.rows.filter(r => _views.conds.every(c => evalCond(r, c)));
    const { field, dir } = _views.sort;
    const f = VIEW_FIELDS.find(x => x.k === field);
    rows.sort((a, b) => {
      let x = a[field], y = b[field];
      if (f?.t === 'num') { x = Number(x||0); y = Number(y||0); }
      else { x = String(x ?? ''); y = String(y ?? ''); }
      return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1);
    });
    return rows;
  };
  const run = () => {
    const rows = matched();
    _views.lastRows = rows;
    drawQuick();
    const owed = rows.reduce((a, r) => a + Number(r.true_due||0), 0);
    const t2 = rows.reduce((a, r) => a + Number(r.term2_due||0), 0);
    el('vw-summary').innerHTML =
      `<span class="pill big">${rows.length} ${rows.length===1?'child':'children'}</span>` +
      (has('finance') ? `<span class="pill">${money(owed)} truly due</span>` +
                        `<span class="pill">${money(t2)} term 2 due</span>` : '') +
      (_views.conds.length ? `<span class="hint" style="width:100%;margin-top:4px">${_views.conds.map(describeCond).join(' · and · ')}</span>` : '');
    el('vw-rows').innerHTML = rows.map(r => `<tr>
      <td><a style="cursor:pointer" onclick="openStatement('${esc(r.uin)}')"><strong>${esc(r.student_name)}</strong></a>
        <br><span class="uin">${esc(r.uin)}</span></td>
      <td>${esc(r.program_name||'')}</td>
      <td class="r num">${Number(r.term1_due)>0?money(r.term1_due):'—'}</td>
      <td class="r num">${Number(r.term2_due)>0?money(r.term2_due):'—'}</td>
      <td class="r num">${Number(r.our_discount)>0?money(r.our_discount):'—'}</td>
      <td class="r num" style="font-weight:600">${Number(r.true_due)>0?money(r.true_due):'<span class="chip c-good">paid</span>'}</td>
      <td><span class="chip ${r.schedule_flag==='OVERDUE'?'c-crit':r.schedule_flag==='SETTLED'?'c-good':r.schedule_flag==='NO SCHEDULE'?'c-warn':'c-mute'}">${esc((r.schedule_flag||'').toLowerCase())}</span></td>
      <td class="hint">${r.next_due_date ? longDate(r.next_due_date) : '—'}</td>
    </tr>`).join('') || `<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--muted)">No child matches these conditions.</td></tr>`;
  };
  el('vw-sort').onchange = e => { _views.sort.field = e.target.value; run(); };
  el('vw-dir').onchange  = e => { _views.sort.dir = e.target.value; run(); };

  // ── save / delete / new
  el('vw-save').onclick = async e => {
    const name = el('vw-name').value.trim();
    if (!name) return alert('Give the view a name first.');
    const btn = e.currentTarget; btn.disabled = true;
    const rec = { name, conditions: _views.conds, sort_field: _views.sort.field, sort_dir: _views.sort.dir, updated_at: new Date().toISOString() };
    const q = _views.current
      ? s.schema('eurokids').from('saved_view').update(rec).eq('id', _views.current.id).select().maybeSingle()
      : s.schema('eurokids').from('saved_view').insert({ ...rec, created_by: session?.user?.id || null }).select().maybeSingle();
    const { data, error: e2 } = await q;
    btn.disabled = false;
    if (e2) return alert('Could not save: ' + e2.message);
    const { data: list2 } = await s.schema('eurokids').from('saved_view').select('*').order('name');
    _views.list = list2 || []; _views.current = data; drawList();
  };
  el('vw-del').onclick = async () => {
    if (!_views.current || !confirm(`Delete the view “${_views.current.name}”?`)) return;
    const { error: e3 } = await s.schema('eurokids').from('saved_view').delete().eq('id', _views.current.id);
    if (e3) return alert('Could not delete: ' + e3.message);
    _views.list = _views.list.filter(v => v.id !== _views.current.id); loadView(null);
  };
  el('vw-new').onclick = () => loadView(null);

  // ── act on the result
  el('vw-csv').onclick = () => {
    const rows = _views.lastRows || [];
    const cols = ['student_name','uin','program_name','batch','father_name','mobile1','parent_email1','agreed_fee','our_discount','term1_due','term2_due','collected','uncredited_cash','true_due','schedule_flag','next_due_date','next_amount'];
    const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
    a.download = `${(el('vw-name').value || 'view').replace(/[^\w]+/g,'-')}.csv`; a.click();
  };
  // A clean sheet for the coordinator: who to call today, with room to tick
  // and scribble. Opens in a new tab and goes straight to the print dialog.
  el('vw-print').onclick = () => {
    const rows = _views.lastRows || [];
    if (!rows.length) return alert('Nothing to print — the view is empty.');
    const title = el('vw-name').value.trim() || 'Follow-up list';
    const today = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
    const owed = rows.reduce((a, r) => a + Number(r.true_due||0), 0);
    const w = window.open('', '_blank');
    if (!w) return alert('Your browser blocked the print window. Allow pop-ups for this site and try again.');
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)} — ${esc(today)}</title>
    <style>
      @page { size: A4; margin: 14mm 12mm; }
      body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;margin:0;font-size:12px}
      .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #FF2217;padding-bottom:8px;margin-bottom:10px}
      .hd h1{margin:0;font-size:18px} .hd .sub{color:#555;font-size:12px;margin-top:2px}
      .meta{color:#444;font-size:11.5px;margin:6px 0 12px}
      table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
      th{background:#F3F4F6;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:7px 6px;border-bottom:1.5px solid #999}
      td{padding:8px 6px;border-bottom:1px solid #DDD;vertical-align:top}
      td.r,th.r{text-align:right} .num{font-weight:600}
      .box{display:inline-block;width:13px;height:13px;border:1.5px solid #333;border-radius:3px;vertical-align:middle}
      .rem{min-width:150px;border-bottom:1px dotted #BBB}
      tfoot td{font-weight:700;border-top:2px solid #333;border-bottom:none}
      .ft{margin-top:22px;display:flex;justify-content:space-between;color:#555;font-size:11px}
      .sig{margin-top:34px;display:flex;gap:40px}
      .sig div{flex:1;border-top:1px solid #333;padding-top:4px;font-size:11px;color:#555}
      tr{page-break-inside:avoid}
    </style></head><body>
    <div class="hd"><div><h1>EuroKids JMD Enclave</h1><div class="sub">${esc(title)}</div></div>
      <div style="text-align:right"><div style="font-weight:700">${esc(today)}</div><div class="sub">${rows.length} famil${rows.length===1?'y':'ies'} · ${money(owed)} outstanding</div></div></div>
    ${_views.conds.length ? `<div class="meta">Showing children where ${esc(_views.conds.map(describeCond).join(', and '))}.</div>` : ''}
    <table><thead><tr><th style="width:24px"></th><th>Child</th><th>Class</th><th>Parent</th><th>Phone</th>
      <th class="r">Truly due</th><th>Next due</th><th>Called / remarks</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td><span class="box"></span></td>
      <td><strong>${esc(r.student_name)}</strong></td>
      <td>${esc(r.program_name||'')}</td>
      <td>${esc(r.father_name||'')}</td>
      <td>${esc(r.mobile1||r.mobile2||'')}</td>
      <td class="r num">${Number(r.true_due)>0?money(r.true_due):'paid'}</td>
      <td>${r.next_due_date ? longDate(r.next_due_date) : ''}</td>
      <td class="rem"></td></tr>`).join('')}
    </tbody><tfoot><tr><td></td><td colspan="4">Total</td><td class="r">${money(owed)}</td><td colspan="2"></td></tr></tfoot></table>
    <div class="sig"><div>Prepared by</div><div>Coordinator</div><div>Reviewed by</div></div>
    <div class="ft"><span>Printed from the EuroKids JMD Enclave hub</span><span>Internal — do not share with parents</span></div>
    <script>window.onload = () => { window.print(); };<\/script>
    </body></html>`);
    w.document.close();
  };

  el('vw-mail').onclick = () => {
    const rows = _views.lastRows || [];
    if (!rows.length) return alert('Nothing to email — the view is empty.');
    _cmp.picked = rows.map(r => ({ uin: r.uin, student_name: r.student_name, program_name: r.program_name }));
    tab = 'compose'; renderApp();
  };

  loadView(_views.list[0] || null);
}

/* ── reminders: the automatic fee ladder ─────────────────────
   Off until the owner switches it on. Every step for every instalment is
   logged once, so the job can run twice a day and nobody hears twice.     */
async function tabReminders(){
  const b = el('body');
  b.innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  const [{ data: st, error }, { data: log }] = await Promise.all([
    s.schema('eurokids').from('reminder_settings').select('*').eq('id', true).maybeSingle(),
    s.schema('eurokids').from('reminder_log').select('uin,due_date,step,sent_at,sent_to,amount_due,result')
      .order('sent_at', { ascending: false }).limit(300),
  ]);
  if (error) return b.innerHTML = fail(error);
  const steps = (st?.steps || [-15, -5, 3]);
  const label = d => d < 0 ? `${-d} days before` : d === 0 ? 'on the day' : `${d} days after`;
  const nameOf = {};
  (await s.schema('eurokids').from('v_schedule').select('uin,student_name').limit(2000)).data?.forEach(r => nameOf[r.uin] = r.student_name);

  b.innerHTML = head('Automatic fee reminders',
      'Runs every morning at 9. Only families who still owe are contacted, using their true balance after discount and after any cash you hold.')
    + `<div class="card" style="padding:20px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;cursor:pointer">
          <input type="checkbox" id="rm-on" ${st?.enabled ? 'checked' : ''} style="width:22px;height:22px">
          ${st?.enabled ? 'Reminders are ON' : 'Reminders are OFF'}
        </label>
        <span class="hint">${st?.enabled ? 'Tomorrow morning’s run will go out.' : 'Nothing is sent until you switch this on.'}</span>
      </div>
      <div style="margin-top:18px">
        <label class="lb">When to remind, relative to each instalment’s due date</label>
        <div class="chips" id="rm-steps">${[-15,-10,-7,-5,-3,-1,0,1,3,5,7,10,14].map(d =>
          `<span class="chip ${steps.includes(d)?'on':''}" data-v="${d}">${label(d)}</span>`).join('')}</div>
        <div class="hint" style="margin-top:6px">Pick as many as you like. A family gets each step once per instalment, and never once they have paid.</div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px">
        <input type="checkbox" id="rm-cc" ${st?.cc_office !== false ? 'checked' : ''}> cc the office on every reminder
      </label>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn" id="rm-save">Save settings</button>
        <button class="btn line" id="rm-preview">Show what would go tomorrow</button>
      </div>
      <div id="rm-msg" style="margin-top:12px"></div>
      <div id="rm-plan" style="margin-top:12px"></div>
    </div>

    <div class="panel" style="margin-top:16px"><div class="ptop"><h2>Sent so far</h2>
      <span class="hint">${(log||[]).length} entries</span></div>
      <div class="tw"><table><thead><tr><th>When</th><th>Child</th><th>Step</th><th>Due</th><th class="r">Owed</th><th>Result</th></tr></thead><tbody>
      ${(log||[]).map(l => `<tr>
        <td class="hint">${new Date(l.sent_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td><strong>${esc(nameOf[l.uin] || l.uin)}</strong></td>
        <td>${label(l.step)}</td><td class="hint">${longDate(l.due_date)}</td>
        <td class="r num">${money(l.amount_due)}</td>
        <td>${l.result === 'sent' ? '<span class="chip c-good">sent</span>' : `<span class="chip c-warn">${esc(l.result||'')}</span>`}</td>
      </tr>`).join('') || `<tr><td colspan="6" style="padding:22px;text-align:center;color:var(--muted)">Nothing sent yet.</td></tr>`}
      </tbody></table></div></div>`;

  document.querySelectorAll('#rm-steps .chip').forEach(c => c.onclick = () => c.classList.toggle('on'));
  const readSteps = () => [...document.querySelectorAll('#rm-steps .chip.on')].map(c => Number(c.dataset.v)).sort((a,b)=>a-b);

  el('rm-save').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    const enabled = el('rm-on').checked, picked = readSteps();
    if (enabled && !picked.length) { btn.disabled = false; return el('rm-msg').innerHTML = '<div class="err">Pick at least one step before switching reminders on.</div>'; }
    if (enabled && !st?.enabled && !confirm(`Switch automatic reminders ON?\n\nFrom tomorrow at 9 am, families who owe money will be emailed ${picked.map(label).join(', ')} each instalment.`)) { btn.disabled = false; return; }
    const { error: e2 } = await s.schema('eurokids').from('reminder_settings')
      .update({ enabled, steps: picked, cc_office: el('rm-cc').checked, updated_at: new Date().toISOString() }).eq('id', true);
    btn.disabled = false;
    if (e2) return el('rm-msg').innerHTML = `<div class="err">${esc(e2.message)}</div>`;
    tabReminders();
  };
  el('rm-preview').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    el('rm-plan').innerHTML = '<div class="hint">Working it out…</div>';
    // dry-run through the same code the cron uses, for tomorrow's date
    const tomorrow = new Date(Date.now() + 5.5*3600*1000 + 86400000).toISOString().slice(0,10);
    const j = await feesApi('/api/fees/reminder-preview', { on: tomorrow, steps: readSteps() });
    btn.disabled = false;
    if (!j.ok) return el('rm-plan').innerHTML = `<div class="err">${esc(j.error)}</div>`;
    el('rm-plan').innerHTML = `<div class="hint" style="margin-bottom:8px">On <strong>${longDate(j.on)}</strong>, with the steps selected above, <strong>${j.would_send}</strong> famil${j.would_send===1?'y':'ies'} would be reminded:</div>`
      + (j.plan.length ? `<div class="tw"><table><thead><tr><th>Child</th><th>Class</th><th>Step</th><th>Due</th><th class="r">Owed</th><th>To</th></tr></thead><tbody>
        ${j.plan.map(p => `<tr><td><strong>${esc(p.child)}</strong></td><td>${esc(p.class||'')}</td><td>${label(p.step)}</td>
          <td class="hint">${longDate(p.due)}</td><td class="r num">${money(p.amount_due)}</td>
          <td class="hint">${p.to.length ? esc(p.to.join(', ')) : '<span class="chip c-warn">no email</span>'}</td></tr>`).join('')}
        </tbody></table></div>` : '');
  };
}

/* ── send email: pick a group, write, preview, send ─────────
   Nothing leaves this screen without the sender first seeing exactly
   who it reaches. The default action is a preview, never a send.      */
let _cmp = { filters:{ money:'all' }, attachments:[], recipients:[], facets:null, picked:[], roll:[] };

async function feesApi(path, body){
  const { data:{ session:s } } = await getSb().auth.getSession();
  if (!s) return { ok:false, error:'Your session has expired — please sign in again.' };
  let r;
  try {
    r = await fetch(path, { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${s.access_token}` },
      body: JSON.stringify(body) });
  } catch (e) {
    return { ok:false, error:'Could not reach the server: ' + e.message };
  }
  // A gateway timeout or a body-too-large returns HTML, not JSON. Left
  // unhandled this rejected mid-send and stranded the button, which invited a
  // second click and a second email to every parent.
  const text = await r.text();
  try { return JSON.parse(text); }
  catch {
    return { ok:false, error: r.status === 413
      ? 'Those attachments are too large for one request. Send a link instead.'
      : `The server returned ${r.status}. If this was a send, check Resend before retrying — some emails may already have gone out.` };
  }
}

        <label class="lb">Or send to any address</label>
        <textarea class="in" id="cmp-extra" rows="3" placeholder="someone@example.com, another@example.com"></textarea>

          but no fee details, since there is no child attached.</div>
      </div>
    </div>

    <div id="cmp-count" class="pill-row" style="margin-top:14px">Counting…</div>
    <div id="cmp-flags" class="hint" style="margin-top:6px"></div>
  </div>

  <div class="card" style="padding:18px;margin-top:14px">
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">
      <div><label class="lb">Subject</label><input id="cmp-subject" class="in" placeholder="e.g. Janmashtami celebration on 6 September"></div>

        <option value="celebration">Celebration red</option>
        <option value="festive">Festive saffron</option>
        <option value="warm">Warm rose</option>

    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px">

  <div class="card" style="padding:18px;margin-top:14px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="cmp-preview">Preview</button>
      <button class="btn ghost" id="cmp-test">Send one test to me</button>
      <button class="btn danger" id="cmp-send">Send to everyone selected</button>

  </div>`;

  const readFilters = () => {
    const on = sel => [...document.querySelectorAll(sel + ' .chip.on')].map(c => c.dataset.v);
    // A hand-picked list is an instruction, not a hint: honour it exactly and
    // ignore the filters, so nobody named here is silently dropped.
    if (_cmp.picked.length) return { uins: _cmp.picked.map(p => p.uin) };
    return {
      classes: on('#cmp-classes'), batches: on('#cmp-batches'),
      money: el('cmp-money').value,
      dueOnOrBefore: el('cmp-cutoff').value || null,
      missingSchedule: el('cmp-nosched').checked,
    };
  };
  const readExtras = () => (el('cmp-extra').value || '')
    .split(/[,;\s]+/).map(x => x.trim()).filter(x => x.includes('@'));

  async function refresh(){
    _cmp.filters = readFilters();
    el('cmp-count').innerHTML = '<span class="pill">Counting…</span>';
    const j = await feesApi('/api/fees/recipients', { filters: _cmp.filters });
    if (!j.ok) { el('cmp-count').innerHTML = `<span class="err">${esc(j.error)}</span>`; return; }
    _cmp.recipients = j.recipients;
    const freeCount = readExtras().length;
    // The markup is rebuilt on every visit, so the chips must be too —
    // otherwise the second visit showed a literal "…" that never recovered.
    if (!_cmp.chipsDrawn) {
      _cmp.facets = j.facets;
      const chips = (list, id) => el(id).innerHTML = list.map(f =>
        `<span class="chip" data-v="${esc(f.value)}">${esc(f.value)} <b>${f.count}</b></span>`).join('') || '<span class="hint">none</span>';
      chips(j.facets.classes, 'cmp-classes');
      chips(j.facets.batches, 'cmp-batches');
      document.querySelectorAll('#cmp-classes .chip, #cmp-batches .chip').forEach(c =>
        c.onclick = () => { c.classList.toggle('on'); refreshSoon(); });
      _cmp.chipsDrawn = true;
    }
    if (!_cmp.roll.length) {
      const { data: roll } = await getSb().schema('eurokids').from('v_schedule')
        .select('uin,student_name,program_name').order('student_name').limit(2000);
      _cmp.roll = roll || [];
    }
    // Always repaint the datalist: without it the "name specific children" box
    // could never match anything on a second visit.
    el('cmp-kids').innerHTML = _cmp.roll
      .map(k => `<option value="${esc(k.student_name)} — ${esc(k.program_name || 'class ?')}">`).join('');
    drawPicked();
    const s = j.summary;
    _cmp.lastSummary = { reachable: s.reachable + freeCount };
    el('cmp-count').innerHTML =
      `<span class="pill big">${s.reachable + freeCount} will receive this</span>` +
      (freeCount ? `<span class="pill">${freeCount} typed address${freeCount === 1 ? '' : 'es'}</span>` : '') +
      `<span class="pill">${s.addresses} email addresses</span>` +
      (s.unreachable ? `<span class="pill warn">${s.unreachable} have no email on file</span>` : '') +
      (s.owed ? `<span class="pill">${money(s.owed)} outstanding across them</span>` : '');
    el('cmp-flags').textContent = 'Across the school: ' +
      Object.entries(j.flags).map(([k,v]) => `${v} ${k.toLowerCase()}`).join(' · ');
  }

  const drawPicked = () => {
    el('cmp-picked').innerHTML = _cmp.picked.map((p, i) =>
      `<span class="chip on" data-i="${i}" style="cursor:pointer">${esc(p.student_name)} ✕</span>`).join('');
    document.querySelectorAll('#cmp-picked .chip').forEach(c => c.onclick = () => {
      _cmp.picked.splice(Number(c.dataset.i), 1); drawPicked(); refresh();
    });
  };
  el('cmp-pick').onchange = () => {
    const v = (el('cmp-pick').value || '').trim().toLowerCase();
    const k = _cmp.roll.find(x => `${x.student_name} — ${x.program_name || 'class ?'}`.toLowerCase() === v);
    if (k && !_cmp.picked.some(p => p.uin === k.uin)) { _cmp.picked.push(k); drawPicked(); refresh(); }
    el('cmp-pick').value = '';
  };
  el('cmp-extra').oninput = debounce(() => refresh(), 300);

  const refreshSoon = debounce(refresh, 250);
  ['cmp-money','cmp-cutoff','cmp-nosched'].forEach(id => el(id).onchange = refreshSoon);

  el('cmp-files').onchange = async e => {
    _cmp.attachments = [];
    for (const f of e.target.files) {
      const buf = await f.arrayBuffer();
      let bin = ''; new Uint8Array(buf).forEach(x => bin += String.fromCharCode(x));
      _cmp.attachments.push({ filename: f.name, content: btoa(bin) });
    }
    const kb = _cmp.attachments.reduce((n,a) => n + a.content.length*0.75, 0)/1024;
    el('cmp-filelist').textContent = _cmp.attachments.length
      ? `${_cmp.attachments.length} file(s), ${kb.toFixed(0)} KB total` + (kb > 8000 ? ' — too big, keep under 8 MB' : '') : '';
  };

  const payload = extra => ({
    filters: readFilters(),
    subject: el('cmp-subject').value.trim(),
    message: el('cmp-message').value.trim(),
    theme: el('cmp-theme').value,
    includeFees: el('cmp-fees').checked,
    ccOffice: el('cmp-cc').checked,
    attachments: _cmp.attachments,
    extraEmails: readExtras(),
    sendId: _cmp.sendId,
    ...extra,
  });
  const say = (h, cls='') => el('cmp-msg').innerHTML = cls ? `<div class="${cls}">${h}</div>` : h;

  el('cmp-preview').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true; say('Building preview…');
    let j;
    try { j = await feesApi('/api/fees/bulk-send', payload({})); }
    finally { btn.disabled = false; }
    if (!j.ok) return say(esc(j.error), 'err');
    say(`This is how it will look for <strong>${esc(j.preview_for||'')}</strong>. ${j.summary.reachable} families would receive it.`);
    el('cmp-preview-box').innerHTML =
      `<iframe style="width:100%;height:620px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>`;
    el('cmp-preview-box').querySelector('iframe').srcdoc = j.preview_html || '';
  };

  el('cmp-test').onclick = async e => {
    const to = prompt('Send one test copy to which address?', session?.user?.email || '');
    if (!to) return;
    const btn = e.currentTarget; btn.disabled = true; say('Sending test…');
    let j;
    try { j = await feesApi('/api/fees/bulk-send', payload({ testTo: to })); }
    finally { btn.disabled = false; }
    say(j.ok ? `Test sent to ${esc(to)} using ${esc(j.sample)}’s details.` : esc(j.error), j.ok ? 'ok' : 'err');
  };

  el('cmp-send').onclick = async e => {
    // One id per attempt: if the connection drops and the operator retries,
    // Resend recognises the key and will not deliver a second copy.
    _cmp.sendId = _cmp.sendId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    // Count what the server will actually send to, not the on-screen page of
    // children — those differ once anyone lacks an email or types an address.
    const n = (_cmp.lastSummary?.reachable ?? _cmp.recipients.length);
    const subj = el('cmp-subject').value.trim();
    if (!n) return say('Nobody is selected.', 'err');
    if (!confirm(`Send “${subj}” to ${n} recipient${n === 1 ? '' : 's'} now?\n\nThis cannot be undone.`)) return;

    const btn = e.currentTarget;
    btn.disabled = true;
    say(`Sending to ${n} recipients — this can take a couple of minutes for a large group. Do not close this tab.`);
    let j;
    try {
      j = await feesApi('/api/fees/bulk-send', payload({ confirm:true }));
    } finally {
      // Deliberately left disabled on success: re-enabling it here is what
      // tempts a second click and a second copy to every parent.
      if (!j || !j.ok) btn.disabled = false;
    }
    if (!j.ok) return say(esc(j.error), 'err');
    _cmp.attachments = []; _cmp.picked = [];
    btn.textContent = 'Sent';
    say(`Sent to ${j.sent} recipient${j.sent === 1 ? '' : 's'}.`
      + (j.failed ? `<br><strong>${j.failed} failed.</strong> ` +
          j.failures.map(f => `${esc(f.name)} — ${esc(f.error || 'unknown')}`).join('<br>')
          + '<br>Fix the cause, then send again to just those families.' : '')
      + '<br><span class="hint">Change the subject or reload the tab before sending anything else.</span>',
      j.failed ? 'err' : 'ok');
  };

  refresh();
}

  return `<div class="ph"><div><h1>${t}</h1>${s ? `<div class="s">${s}</div>` : ''}</div><div class="ph-r">${right || ''}</div></div>`;
}

  return `<div class="err">Could not load: ${esc(e?.message || e)}</div>`;
}

/* ── the EPMS sync button — shared by the finance overview and the coordinator's worklist ── */
function wireSync(s, afterSync){
    // When did data last arrive from EPMS?
    const showLastSync = async () => {
      const info = el('sync-info'); if (!info) return;
      try {
        const { data: runs } = await s.schema('epms').from('sync_runs')
          .select('finished_at,status,rows_fetched').not('finished_at','is',null)
          .order('finished_at', { ascending: false }).limit(1);
        const last = runs && runs[0];
        info.textContent = last
          ? `Last synced ${new Date(last.finished_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${last.status==='ok' ? '' : ' (failed)'}`
          : 'Never synced';
      } catch (_) { info.textContent = ''; }
    };
    showLastSync();

    // Manual sync — logs into EPMS server-side, re-pulls the Payment Due report,
    // then re-renders this tab with the fresh figures.
    const b = el('sync');
    if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = 'Syncing…';
      el('sync-info').textContent = 'Fetching from EPMS…';
      try {
        const { data: { session: sess } } = await getSb().auth.getSession();
        const r = await fetch(`${SUPABASE_URL}/functions/v1/epms-pull`, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${sess.access_token}`, apikey: SUPABASE_ANON_KEY },
        });
        const j = await r.json();
        if (j.ok) {
          // Second pass: the Admission report carries parent emails, batch, kit dispatch.
          el('sync-info').textContent = 'Fetching parent details…';
          let extra = '';
          try {
            const r2 = await fetch(`${SUPABASE_URL}/functions/v1/epms-admission-pull`, {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${sess.access_token}`, apikey: SUPABASE_ANON_KEY },
            });
            const j2 = await r2.json();
            if (j2.ok) extra = ` · ${j2.with_email} parent emails`;
          } catch (_) { /* the main sync already succeeded */ }

          // Third pass: money EPMS has just recognised for a family whose cash
          // we are holding is us posting it onward. Consume the held amount by
          // exactly that much, so the payment is counted once rather than twice.
          let matched = '';
          try {
            const { data: m } = await getSb().schema('eurokids').rpc('auto_match_remittances');
            const row = Array.isArray(m) ? m[0] : m;
            if (row && Number(row.matched_amount) > 0) {
              matched = ` · ₹${Number(row.matched_amount).toLocaleString('en-IN')} of held cash settled`;
            }
          } catch (_) { /* matching is a convenience, never a blocker */ }

          el('sync-info').textContent = (j.new_payments
            ? `${j.new_payments} new payment${j.new_payments===1?'':'s'} · ₹${j.new_payments_rupees.toLocaleString('en-IN')} received`
            : `Synced ${j.invoices} records · ${j.active} active`) + extra + matched;
          b.textContent = 'Synced ✓';
          setTimeout(afterSync, 900);
        } else {
          el('sync-info').textContent = '';
          alert('Sync failed:\n\n' + (j.error || 'unknown error'));
          b.disabled = false; b.textContent = 'Sync from EPMS';
        }
      } catch (e) {
        el('sync-info').textContent = '';
        alert('Sync failed: ' + e.message);
        b.disabled = false; b.textContent = 'Sync from EPMS';
      }
    };
}

// Roster state — kept module-level so filters don't refetch.
let _kids = [], _kidQ = '', _kidProg = 'all', _kidBatch = 'all', _kidSort = 'newest';

async function tabChildren(){
  el('body').innerHTML = '<div class="loading">Loading roster…</div>';

  const { data, error } = await getSb().schema('eurokids').from('v_dues')

    .order('admission_date', { ascending: false })
    .order('student_name', { ascending: true });

  _kids = data || [];
  renderChildren();
}

// Extracted so the roster table can be redrawn on its own. Rebuilding the whole
// panel per keystroke also destroyed the search box being typed into.
function kidRowHtml(r){
  const fmtDate = d => d ? _DFY2.format(new Date(d + 'T00:00:00Z')) : '—';

          const paid = Number(r.true_due) <= 0;

          const tint = paid ? 'background:var(--good-wash)' : (part ? 'background:var(--warn-wash)' : 'background:var(--crit-wash)');

          const contacts = [r.parent_email1, r.parent_email2].filter(Boolean);
          const phones   = [r.mobile1, r.mobile2].filter(Boolean);

          <td style="border-left:3px solid ${bar}">

            ${Number(r.uncredited_cash) ? `<span class="chip c-warn" style="margin-left:4px">${money(r.uncredited_cash)} in hand</span>`:''}
            <br><span class="uin">${esc(r.uin)}</span></td>
          <td style="font-size:12px;color:var(--muted)">${esc(r.father_name || '—')}
            ${phones.length?`<br>${phones.map(p=>`<a href="tel:${esc(p)}" style="color:var(--muted)">${esc(p)}</a>`).join(' · ')}`:''}
            ${contacts.length?`<br>${contacts.map(e2=>`<a href="mailto:${esc(e2)}" style="color:var(--accent)">${esc(e2)}</a>`).join(' · ')}`
                             :'<br><span style="color:var(--faint)">no email on file</span>'}</td>
          <td>${esc(r.program_name)}</td>
          <td>${r.batch ? esc(r.batch) : `<select class="in" style="padding:2px 6px;font-size:12px;width:auto" onchange="setBatch('${esc(r.uin)}', this.value)">
                <option value="">—</option><option value="Morning">Morning</option><option value="Afternoon">Afternoon</option></select>`}</td>
          <td class="hint">${fmtDate(r.admission_date)}</td>
          <td class="r num">${money(r.total_invoiced)}</td>
          <td class="r num">${money(r.total_collected)}</td>
          <td class="r num" style="font-weight:700;color:${bar}">${paid ? 'Paid' : money(r.true_due)}</td>
          <td class="r"><a onclick="openPlanFrom('${esc(r.uin)}')">Plan ›</a></td>
        </tr>`;
}
const _DFY2 = new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', year:'2-digit', timeZone:'UTC' });

function filteredKids(){
  const q = _kidQ.trim().toLowerCase();
  let rows = _kids.filter(r => {
    if (_kidProg !== 'all' && (r.program_name || '') !== _kidProg) return false;
    if (_kidBatch !== 'all' && (r.batch || 'Unset') !== _kidBatch) return false;
    if (!q) return true;
    return (r.student_name || '').toLowerCase().includes(q)
        || (r.father_name || '').toLowerCase().includes(q)
        || (r.uin || '').toLowerCase().includes(q);
  });
  if (_kidSort === 'newest') rows.sort((a,b) => (b.admission_date||'').localeCompare(a.admission_date||''));
  else if (_kidSort === 'oldest') rows.sort((a,b) => (a.admission_date||'').localeCompare(b.admission_date||''));
  else if (_kidSort === 'name')   rows.sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''));
  else if (_kidSort === 'due')    rows.sort((a,b) => Number(b.true_due) - Number(a.true_due));
  return rows;
}

function repaintKidRows(){
  const rows = filteredKids();
  const body = el('kid-rows'); if (!body) return;
  body.innerHTML = rows.length ? rows.map(kidRowHtml).join('')
    : `<tr><td colspan="9" style="padding:26px;text-align:center;color:var(--muted)">No child matches that search.</td></tr>`;
  const owing = rows.filter(r => Number(r.true_due) > 0).length;
  const hint = el('kid-count');
  if (hint) hint.innerHTML = `<strong>${rows.length}</strong> shown of ${_kids.length} active ·
      <span style="color:var(--good)">${rows.length-owing} fully paid</span> ·
      <span style="color:var(--crit)">${owing} still owe</span>`;
}

function renderChildren(){
  const PROGRAMS = ['Play Group','Nursery','Euro Junior','Euro Senior','Eurotots'];
  const q = _kidQ.trim().toLowerCase();
  let rows = _kids.filter(r => {
    if (_kidProg !== 'all' && (r.program_name || '') !== _kidProg) return false;
    if (_kidBatch !== 'all' && (r.batch || 'Unset') !== _kidBatch) return false;
    if (!q) return true;
    return (r.student_name || '').toLowerCase().includes(q)
        || (r.father_name || '').toLowerCase().includes(q)
        || (r.uin || '').toLowerCase().includes(q);
  });
  if (_kidSort === 'newest') rows.sort((a,b) => (b.admission_date||'').localeCompare(a.admission_date||''));
  else if (_kidSort === 'oldest') rows.sort((a,b) => (a.admission_date||'').localeCompare(b.admission_date||''));
  else if (_kidSort === 'name')   rows.sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''));
  else if (_kidSort === 'due')    rows.sort((a,b) => Number(b.true_due) - Number(a.true_due));

  // Counts per program for the filter chips
  const countFor = p => _kids.filter(r => (r.program_name||'') === p).length;
  const fmtDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'}) : '—';
  const owing = rows.filter(r => Number(r.true_due) > 0).length;

  // Per-class strip: headcount and what the class is worth
  const classStrip = PROGRAMS.filter(p => countFor(p)).map(p => {
    const set = _kids.filter(r => r.program_name === p);
    const due = set.reduce((a,r) => a + Number(r.true_due), 0);
    return `<div class="stat" style="padding:11px 13px">
      <div class="k">${p}</div><div class="v" style="font-size:19px">${set.length}</div>
      <div class="m">${!has('finance') ? '' : due > 0 ? money(due) + ' outstanding' : 'all paid'}</div></div>`;
  }).join('');

  el('body').innerHTML = head('Children', has('finance') ? 'Active roster. Quit and Transfer Out are excluded everywhere.' : 'Active roster — set batches and find contact details here.')
    + `<div class="stats" style="margin-bottom:14px">${classStrip}</div>
      <div class="panel" style="padding:14px 16px;margin-bottom:14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input class="in" id="kid-q" placeholder="Search name, father or UIN…" value="${esc(_kidQ)}" style="flex:1;min-width:220px">
          <select class="in" id="kid-prog" style="width:auto">
            <option value="all">All classes (${_kids.length})</option>
            ${PROGRAMS.filter(p=>countFor(p)).map(p=>`<option value="${p}" ${_kidProg===p?'selected':''}>${p} (${countFor(p)})</option>`).join('')}
          </select>
          <select class="in" id="kid-batch" style="width:auto">
            <option value="all">Both batches</option>
            <option value="Morning"   ${_kidBatch==='Morning'?'selected':''}>Morning</option>
            <option value="Afternoon" ${_kidBatch==='Afternoon'?'selected':''}>Afternoon</option>
            <option value="Unset"     ${_kidBatch==='Unset'?'selected':''}>Batch not set</option>
          </select>
          <select class="in" id="kid-sort" style="width:auto">
            <option value="newest" ${_kidSort==='newest'?'selected':''}>Newest admission first</option>
            <option value="oldest" ${_kidSort==='oldest'?'selected':''}>Oldest first</option>
            <option value="name"   ${_kidSort==='name'?'selected':''}>Name A–Z</option>
            <option value="due"    ${_kidSort==='due'?'selected':''}>Biggest balance</option>
          </select>
        </div>
      </div>

      <div class="panel"><div class="ptop"><h2>Roster</h2>
        <span class="hint" id="kid-count"><strong>${rows.length}</strong> shown of ${_kids.length} active ·
          <span style="color:var(--good)">${rows.length-owing} fully paid</span> ·
          <span style="color:var(--crit)">${owing} still owe</span></span></div>
      <div class="tw"><table><thead><tr>
        <th>Child</th><th>Parents</th><th>Class</th><th>Batch</th><th>Admitted</th>
        <th class="r">Fee</th><th class="r">Collected</th><th class="r">Truly due</th><th></th></tr></thead><tbody id="kid-rows">
      </tbody></table></div></div>`;

  // Wire the controls (preserve caret position in the search box)
  // Typing used to destroy and rebuild the whole panel — including the input
  // being typed into, hence the caret-restoring dance. Now only the table body
  // is redrawn, so the input is never touched and focus takes care of itself.
  const qEl = el('kid-q');
  qEl.oninput = debounce(() => { _kidQ = qEl.value; repaintKidRows(); }, 160);
  repaintKidRows();
  el('kid-prog').onchange  = e => { _kidProg  = e.target.value; renderChildren(); };
  el('kid-batch').onchange = e => { _kidBatch = e.target.value; renderChildren(); };
  el('kid-sort').onchange  = e => { _kidSort  = e.target.value; renderChildren(); };
}

async function setBatch(uin, batch){
  if (!batch) return;
  const { error } = await getSb().schema('eurokids').from('child_batch')
    .upsert({ uin, batch, updated_at: new Date().toISOString() });
  if (error) return alert('Could not save batch: ' + error.message);
  const k = _kids.find(x => x.uin === uin); if (k) k.batch = batch;
  renderChildren();
}

/* ── cash in hand: money received but not yet posted into EPMS ─────────── */
/* ── liabilities: everything we have physically taken in ──────────
   Two obligations attach to money the moment it reaches us, and they move
   independently: cash has to reach the bank, and tuition has to reach
   EuroKids. Until tuition is posted onward, EPMS still shows it as due while
   we are the ones holding it — so only the un-posted part is netted off the
   parent's balance. Day care, uniform and event money never enters EPMS at
   all and never touches a fee.                                            */
let _liab = { recs: [], kids: [], byLabel: {} };

// A half-typed receipt must survive a trip to another tab. Kept in memory for
// the session and mirrored to localStorage so a stray refresh doesn't lose it.
const LB_FIELDS = ['lb-child','lb-name','lb-email','lb-phone','lb-purpose',
                   'lb-purpose-note','lb-mode','lb-amt','lb-on','lb-by'];
const lbDraftSave = () => {
  const d = { who: _liab.who };
  LB_FIELDS.forEach(id => { const e = el(id); if (e) d[id] = e.value; });
  _liab.draft = d;
  try { localStorage.setItem('ek-liab-draft', JSON.stringify(d)); } catch (_) {}
};
const lbDraftLoad = () => {
  if (_liab.draft) return _liab.draft;
  try { return JSON.parse(localStorage.getItem('ek-liab-draft') || 'null'); } catch (_) { return null; }
};
const lbDraftClear = () => {
  _liab.draft = null;
  try { localStorage.removeItem('ek-liab-draft'); } catch (_) {}
};

async function tabLiability(){
  el('body').innerHTML = '<div class="loading">Loading…</div>';
  const s = getSb();
  const [{ data: recs, error }, { data: kids }] = await Promise.all([
    s.schema('eurokids').from('receipt_offline').select('*').order('received_on', { ascending: false }).limit(2000),
    s.schema('eurokids').from('v_schedule').select('uin,student_name,program_name').order('student_name').limit(2000),
  ]);
  if (error) return el('body').innerHTML = fail(error);
  _liab.recs = recs || [];
  _liab.kids = kids || [];

  // "Name — Class" keeps two children of the same name apart.
  _liab.byLabel = {};
  const dupe = {};
  (kids || []).forEach(k => { dupe[k.student_name] = (dupe[k.student_name] || 0) + 1; });
  const options = (kids || []).map(k => {

  const heldForEuro = _liab.recs.filter(r => r.purpose === 'tuition')
    .reduce((a, r) => a + (Number(r.amount_rupees) - Number(r.remitted || 0)), 0);
  const notBanked = sum(r => r.mode === 'Cash' && !r.deposited_on);

          <div class="m">Fee money taken but not yet posted</div></div>
        <div class="stat warn"><div class="k">Cash not banked</div><div class="v">${money(notBanked)}</div>
          <div class="m">Physically with us</div></div>
        <div class="stat"><div class="k">Other collections</div><div class="v">${money(otherMoney)}</div>
          <div class="m">Day care, uniform, events — ours, not EuroKids’</div></div>
      </div>

      <div class="panel" style="padding:18px">

          <span class="chip" id="lb-t-other" data-who="other" style="cursor:pointer;border:1px solid var(--line-2);padding:5px 11px">Someone else (day care, guest)</span>
        </div>

        <div id="lb-child-row" style="display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:end">
          <div class="fld" style="margin:0"><label>Child — type to search</label>
            <input class="in" id="lb-child" list="lb-kids" placeholder="Start typing a name…" autocomplete="off">
            <datalist id="lb-kids">${options}</datalist>
            <div class="hint" id="lb-child-hint">${(kids || []).length} children on the roll</div></div>
          <div class="fld" style="margin:0"><label>What is this for?</label>
            <select class="in" id="lb-purpose">
              <option value="tuition">Tuition / term fees</option>
              <option value="other">Something else…</option></select></div>
        </div>

        <div id="lb-other-row" style="display:none;grid-template-columns:1.4fr 1.4fr 1fr;gap:10px;align-items:end">
          <div class="fld" style="margin:0"><label>Who paid — name</label>
            <input class="in" id="lb-name" placeholder="e.g. Aarav (day care only)"></div>
          <div class="fld" style="margin:0"><label>Their email — for the receipt</label>
            <input class="in" id="lb-email" type="email" placeholder="optional"></div>
          <div class="fld" style="margin:0"><label>Phone</label>
            <input class="in" id="lb-phone" placeholder="optional"></div>
        </div>

        <div class="fld" id="lb-purpose-note-wrap" style="display:none;margin:10px 0 0">
          <label>What is it for?</label>
          <input class="in" id="lb-purpose-note" placeholder="e.g. Day care August · Uniform · Class photographs · Annual function">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:10px;align-items:end;margin-top:10px">
          <div class="fld" style="margin:0"><label>Mode</label>
            <select class="in" id="lb-mode"><option>Cash</option><option>UPI</option><option>Cheque</option><option>Other</option></select></div>
          <div class="fld" style="margin:0"><label>Amount</label><input class="in num" id="lb-amt" type="number" min="1"></div>
          <div class="fld" style="margin:0"><label>Received on</label><input class="in" id="lb-on" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="fld" style="margin:0"><label>Received by</label><input class="in" id="lb-by" placeholder="who took it"></div>
